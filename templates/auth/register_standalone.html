<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 培训考试平台</title>
    
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css" rel="stylesheet">
    
    <style>
        /* ==================== 全局重置 ==================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            width: 100%;
            min-height: 100vh;
            background: #0a0e1a;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            overflow-x: hidden;
        }
        
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 20px;
        }

        /* ==================== 粒子画布 ==================== */
        #particles-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* ==================== 背景光晕 ==================== */
        .bg-glow {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            pointer-events: none;
            z-index: 0;
            animation: glowFloat 8s ease-in-out infinite alternate;
        }
        
        .bg-glow-1 {
            width: 500px;
            height: 500px;
            top: -100px;
            right: -100px;
            background: rgba(99, 102, 241, 0.3);
            animation-delay: 0s;
        }
        
        .bg-glow-2 {
            width: 400px;
            height: 400px;
            bottom: -50px;
            left: -50px;
            background: rgba(236, 72, 153, 0.25);
            animation-delay: -3s;
        }
        
        .bg-glow-3 {
            width: 300px;
            height: 300px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(59, 130, 246, 0.15);
            animation-delay: -5s;
        }

        @keyframes glowFloat {
            0% { transform: translate(0, 0) scale(1); opacity: 0.6; }
            100% { transform: translate(30px, -30px) scale(1.1); opacity: 1; }
        }

        /* ==================== 注册卡片 ==================== */
        .register-wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 520px;
            padding: 20px;
        }

        .register-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(24px) saturate(1.4);
            -webkit-backdrop-filter: blur(24px) saturate(1.4);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            padding: 36px 32px 32px;
            box-shadow: 
                0 25px 60px rgba(0, 0, 0, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
            overflow: hidden;
            max-height: 90vh;
            overflow-y: auto;
        }
        
        .register-card::-webkit-scrollbar {
            width: 4px;
        }
        .register-card::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 2px;
        }
        .register-card::-webkit-scrollbar-thumb {
            background: rgba(129, 140, 248, 0.3);
            border-radius: 2px;
        }
        
        .register-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, #818cf8, #a78bfa, #f472b6, transparent);
            opacity: 0.6;
        }

        .register-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.7);
        }

        /* ==================== Logo / 标题区域 ==================== */
        .register-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .register-icon {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #34d399, #6ee7b7);
            border-radius: 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            color: white;
            margin-bottom: 16px;
            box-shadow: 0 8px 32px rgba(52, 211, 153, 0.35);
            animation: iconPulse 3s ease-in-out infinite;
        }

        @keyframes iconPulse {
            0%, 100% { box-shadow: 0 8px 32px rgba(52, 211, 153, 0.35); }
            50% { box-shadow: 0 8px 48px rgba(52, 211, 153, 0.55); }
        }

        .register-title {
            color: #ffffff;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin: 0 0 4px;
        }

        .register-subtitle {
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
            margin: 0;
            font-weight: 400;
        }

        /* ==================== 表单元素 ==================== */
        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            color: rgba(255, 255, 255, 0.7);
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 5px;
            letter-spacing: 0.3px;
        }

        .form-group .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            background: rgba(0, 0, 0, 0.4);
            border: 1.5px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            transition: all 0.3s ease;
        }

        .form-group .input-wrapper:focus-within {
            border-color: #34d399;
            background: rgba(0, 0, 0, 0.5);
            box-shadow: 0 0 0 4px rgba(52, 211, 153, 0.15);
        }

        .form-group .input-wrapper .input-icon {
            flex-shrink: 0;
            width: 40px;
            text-align: center;
            color: rgba(255, 255, 255, 0.3);
            font-size: 16px;
            transition: color 0.3s ease;
        }

        .form-group .input-wrapper:focus-within .input-icon {
            color: #34d399;
        }

        .form-group .input-wrapper input,
        .form-group .input-wrapper select {
            flex: 1;
            background: transparent !important;
            border: none !important;
            outline: none !important;
            padding: 12px 14px 12px 0 !important;
            color: #f0f0f0 !important;
            font-size: 14px !important;
            font-weight: 400 !important;
            min-height: 44px !important;
            box-shadow: none !important;
            width: 100%;
            text-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }

        .form-group .input-wrapper input::placeholder {
            color: rgba(255, 255, 255, 0.25) !important;
            font-size: 13px !important;
        }

        .form-group .input-wrapper input:-webkit-autofill {
            -webkit-box-shadow: 0 0 0 1000px rgba(0, 0, 0, 0.6) inset !important;
            -webkit-text-fill-color: #f0f0f0 !important;
            border-radius: 12px !important;
        }

        /* 选择框特殊样式 */
        .form-group .input-wrapper select {
            appearance: none;
            cursor: pointer;
            color: #f0f0f0 !important;
        }
        .form-group .input-wrapper select option {
            background: #1a1f3a;
            color: #f0f0f0;
        }

        /* 单选按钮组 */
        .radio-group {
            display: flex;
            gap: 20px;
            padding: 8px 0;
        }

        .radio-group .form-check {
            display: flex;
            align-items: center;
            gap: 8px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            cursor: pointer;
        }

        .radio-group .form-check input[type="radio"] {
            appearance: none;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            transition: all 0.3s ease;
            cursor: pointer;
            flex-shrink: 0;
        }

        .radio-group .form-check input[type="radio"]:checked {
            border-color: #34d399;
            background: #34d399;
            box-shadow: 0 0 0 3px rgba(52, 211, 153, 0.2);
        }

        .radio-group .form-check input[type="radio"]:checked::after {
            content: '';
            display: block;
            width: 6px;
            height: 6px;
            margin: 4px auto;
            background: white;
            border-radius: 50%;
        }

        .radio-group .form-check:hover {
            color: #ffffff;
        }

        /* ==================== 注册按钮 ==================== */
        .btn-register {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #34d399, #6ee7b7);
            border: none;
            border-radius: 12px;
            color: #0a0e1a;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            margin-top: 8px;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-register::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 300%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transform: skewX(-25deg);
            transition: left 0.6s ease;
        }

        .btn-register:hover:not(:disabled)::before {
            left: 100%;
        }

        .btn-register:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(52, 211, 153, 0.4);
        }

        .btn-register:active:not(:disabled) {
            transform: translateY(0);
        }

        .btn-register:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none !important;
        }

        /* ==================== 底部链接 ==================== */
        .register-footer {
            margin-top: 20px;
            text-align: center;
        }

        .register-footer a {
            color: rgba(255, 255, 255, 0.4);
            font-size: 13px;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .register-footer a:hover {
            color: #34d399;
        }

        /* ==================== 语言切换 ==================== */
        .lang-switch {
            position: fixed;
            top: 24px;
            right: 24px;
            z-index: 100;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 6px;
            display: flex;
            gap: 4px;
        }

        .lang-switch button {
            background: transparent;
            border: none;
            padding: 6px 14px;
            border-radius: 8px;
            color: rgba(255, 255, 255, 0.4);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .lang-switch button.active {
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
        }

        .lang-switch button:hover:not(.active) {
            color: rgba(255, 255, 255, 0.7);
        }

        /* ==================== Toast 适配 ==================== */
        .toast-container {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 9999;
        }

        .toast-custom {
            background: rgba(30, 35, 55, 0.95);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            color: #ffffff;
            padding: 14px 24px;
            min-width: 280px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
            display: none;
            align-items: center;
            gap: 12px;
            animation: slideUp 0.4s ease;
        }

        .toast-custom.show {
            display: flex;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .toast-custom .toast-icon {
            font-size: 20px;
            flex-shrink: 0;
        }

        .toast-custom .toast-message {
            flex: 1;
            font-size: 14px;
        }

        .toast-custom .toast-close {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.4);
            cursor: pointer;
            font-size: 18px;
            padding: 0 4px;
        }

        .toast-custom .toast-close:hover {
            color: #ffffff;
        }

        .toast-custom.success .toast-icon { color: #34d399; }
        .toast-custom.error .toast-icon { color: #f87171; }
        .toast-custom.warning .toast-icon { color: #fbbf24; }
        .toast-custom.info .toast-icon { color: #60a5fa; }

        /* ==================== 响应式 ==================== */
        @media (max-width: 480px) {
            .register-card {
                padding: 24px 16px 20px;
                border-radius: 18px;
                max-height: 95vh;
            }
            
            .register-title {
                font-size: 20px;
            }
            
            .register-icon {
                width: 48px;
                height: 48px;
                font-size: 22px;
            }
            
            .form-group .input-wrapper input {
                font-size: 13px !important;
                padding: 10px 10px 10px 0 !important;
                min-height: 40px !important;
            }
            
            .btn-register {
                padding: 12px;
                font-size: 14px;
                min-height: 44px;
            }
            
            .lang-switch {
                top: 12px;
                right: 12px;
                padding: 4px;
            }
            
            .lang-switch button {
                padding: 4px 8px;
                font-size: 11px;
            }
            
            .radio-group {
                gap: 12px;
                flex-wrap: wrap;
            }
            
            .bg-glow-1 {
                width: 250px;
                height: 250px;
            }
            .bg-glow-2 {
                width: 200px;
                height: 200px;
            }
        }

        @media (max-height: 750px) {
            .register-card {
                padding: 20px 24px 16px;
                max-height: 95vh;
            }
            .register-header {
                margin-bottom: 16px;
            }
            .register-icon {
                width: 44px;
                height: 44px;
                font-size: 18px;
                margin-bottom: 10px;
            }
            .form-group {
                margin-bottom: 10px;
            }
            .form-group .input-wrapper input {
                min-height: 36px !important;
                padding: 8px 10px 8px 0 !important;
                font-size: 13px !important;
            }
            .btn-register {
                padding: 10px;
                min-height: 38px;
                font-size: 14px;
            }
            .register-footer {
                margin-top: 12px;
            }
        }
    </style>
</head>
<body>

<!-- 背景光晕 -->
<div class="bg-glow bg-glow-1"></div>
<div class="bg-glow bg-glow-2"></div>
<div class="bg-glow bg-glow-3"></div>

<!-- 粒子背景 -->
<canvas id="particles-canvas"></canvas>

<!-- 语言切换 -->
<div class="lang-switch">
    <button class="active" data-lang="zh" onclick="switchLang('zh')">中</button>
    <button data-lang="en" onclick="switchLang('en')">EN</button>
</div>

<!-- 注册卡片 -->
<div class="register-wrapper">
    <div class="register-card">
        <!-- 头部 -->
        <div class="register-header">
            <div class="register-icon">📝</div>
            <h1 class="register-title" id="registerTitle">新用户注册</h1>
            <p class="register-subtitle" id="registerSubtitle">创建您的账号，开始学习之旅</p>
        </div>

        <!-- 注册表单 -->
        <form id="regForm" novalidate>
            <!-- 第一行：邮箱 + 验证码 -->
            <div class="row g-2">
                <div class="col-md-7">
                    <div class="form-group">
                        <label for="email" id="labelEmail">邮箱地址</label>
                        <div class="input-wrapper">
                            <span class="input-icon">📧</span>
                            <input type="email" id="email" name="email" 
                                   placeholder="name@company.com" required autocomplete="email">
                        </div>
                        <div style="color: #f87171; font-size: 11px; margin-top: 3px; display: none;" id="emailError">请输入有效的邮箱地址</div>
                    </div>
                </div>
                <div class="col-md-5">
                    <div class="form-group">
                        <label for="otp" id="labelOtp">验证码</label>
                        <div class="input-wrapper" style="padding-right: 4px;">
                            <span class="input-icon">🔑</span>
                            <input type="text" id="otp" name="otp" maxlength="6" pattern="\d{6}" 
                                   placeholder="6位数字" required autocomplete="one-time-code" style="flex: 1;">
                            <button type="button" id="regOtpBtn" class="btn" style="background: rgba(255,255,255,0.06); border: none; border-radius: 8px; color: #a78bfa; padding: 6px 12px; font-size: 12px; white-space: nowrap; flex-shrink: 0;">
                                <span id="otpBtnText">获取</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 第二行：密码 + 确认密码 -->
            <div class="row g-2">
                <div class="col-md-6">
                    <div class="form-group">
                        <label for="password" id="labelPassword">密码</label>
                        <div class="input-wrapper">
                            <span class="input-icon">🔒</span>
                            <input type="password" id="password" name="password" 
                                   placeholder="至少6位" required minlength="6" autocomplete="new-password">
                        </div>
                        <div style="color: #f87171; font-size: 11px; margin-top: 3px; display: none;" id="passwordError">密码至少6位</div>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-group">
                        <label for="confirm_password" id="labelConfirmPwd">确认密码</label>
                        <div class="input-wrapper">
                            <span class="input-icon">✓</span>
                            <input type="password" id="confirm_password" name="confirm_password" 
                                   placeholder="再次输入" required minlength="6" autocomplete="new-password">
                        </div>
                        <div style="color: #f87171; font-size: 11px; margin-top: 3px; display: none;" id="confirmError">两次密码不一致</div>
                    </div>
                </div>
            </div>

            <!-- 第三行：姓名 + 生日 -->
            <div class="row g-2">
                <div class="col-md-7">
                    <div class="form-group">
                        <label for="regName" id="labelName">姓名 <small style="color: rgba(255,255,255,0.3);">(支持长文本)</small></label>
                        <div class="input-wrapper">
                            <span class="input-icon">👤</span>
                            <input type="text" id="regName" name="name_en" list="nameSuggestions"
                                   placeholder="John Alexander Smith" required autocomplete="off">
                            <datalist id="nameSuggestions"></datalist>
                        </div>
                    </div>
                </div>
                <div class="col-md-5">
                    <div class="form-group">
                        <label for="regBirthday" id="labelBirthday">出生日期 <small style="color: rgba(255,255,255,0.3);">(验证身份)</small></label>
                        <div class="input-wrapper">
                            <span class="input-icon">🎂</span>
                            <input type="date" id="regBirthday" name="birthday" autocomplete="bday">
                        </div>
                    </div>
                </div>
            </div>

            <!-- 第四行：国家 + 服务商 -->
            <div class="row g-2">
                <div class="col-md-7">
                    <div class="form-group">
                        <label for="regCountrySelect" id="labelCountry">国家</label>
                        <div class="input-wrapper">
                            <span class="input-icon">🌍</span>
                            <input type="text" id="regCountrySelect" list="countryDatalist" 
                                   placeholder="输入选择国家" autocomplete="off"
                                   data-code-input="regCountryCode" required>
                            <datalist id="countryDatalist"></datalist>
                            <input type="hidden" name="country" id="regCountryCode">
                        </div>
                        <div style="color: #f87171; font-size: 11px; margin-top: 3px; display: none;" id="countryError">请选择您的国家</div>
                    </div>
                </div>
                <div class="col-md-5">
                    <div class="form-group">
                        <label id="labelPartner">您是服务商吗？</label>
                        <div class="radio-group">
                            <label class="form-check">
                                <input type="radio" name="is_partner" value="Y" checked>
                                <span id="partnerYes">是</span>
                            </label>
                            <label class="form-check">
                                <input type="radio" name="is_partner" value="N">
                                <span id="partnerNo">否</span>
                            </label>
                        </div>
                    </div>
                </div>
            </div>

            <button type="submit" class="btn-register" id="registerBtn">
                <span id="registerBtnText">✅ 完成注册</span>
            </button>
        </form>

        <!-- 底部链接 -->
        <div class="register-footer">
            <span style="color: rgba(255,255,255,0.3);" id="HaveAccount">已有账号？</span>
            <a href="{{ url_for('auth.login') }}" id="loginLink">直接登录</a>
        </div>
    </div>
</div>

<!-- Toast 容器 -->
<div class="toast-container">
    <div class="toast-custom" id="globalToast">
        <span class="toast-icon" id="toastIcon">✅</span>
        <span class="toast-message" id="toastMessage">操作成功</span>
        <button class="toast-close" onclick="hideToast()">✕</button>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
// ==================== 国际化字典 ====================
const translations = {
    zh: {
        registerTitle: '新用户注册',
        registerSubtitle: '创建您的账号，开始学习之旅',
        labelEmail: '邮箱地址',
        labelOtp: '验证码',
        otpBtnText: '获取',
        labelPassword: '密码',
        labelConfirmPwd: '确认密码',
        labelName: '姓名',
        labelBirthday: '出生日期',
        labelCountry: '国家',
        labelPartner: '您是服务商吗？',
        partnerYes: '是',
        partnerNo: '否',
        registerBtnText: '✅ 完成注册',
        HaveAccount: '已有账号？',
        loginLink: '登录',
        emailPlaceholder: 'name@company.com',
        otpPlaceholder: '6位数字',
        passwordPlaceholder: '至少6位',
        confirmPlaceholder: '再次输入',
        input_password: '请输入6位密码',
        input_name: '请输入全称，中文请使用拼音',
        namePlaceholder: 'John Alexander Smith',
        countryPlaceholder: '输入选择国家',
        emailError: '请输入有效的邮箱地址',
        passwordError: '密码至少6位',
        confirmError: '两次密码不一致',
        countryError: '请选择您的国家',
        registerSuccess: '注册成功！正在跳转到仪表盘...',

// ==================== Toast ====================
let toastTimer = null;

function showToast(message, type = 'info') {
    const toast = document.getElementById('globalToast');
    const icon = document.getElementById('toastIcon');
    const msgEl = document.getElementById('toastMessage');
    
    toast.className = 'toast-custom ' + type;
    icon.textContent = type === 'success' ? '✅' : type === 'error' ? '❌' : type === 'warning' ? '⚠️' : 'ℹ️';
    msgEl.textContent = message;
    toast.classList.add('show');
    
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
        toast.classList.remove('show');
    }, 3000);
}

function hideToast() {
    document.getElementById('globalToast').classList.remove('show');
    clearTimeout(toastTimer);
}

// ==================== 粒子系统（与登录页一致） ====================
(function() {
    const canvas = document.getElementById('particles-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    let animationId = null;
    let mouseX = -1000;
    let mouseY = -1000;

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    document.addEventListener('mousemove', function(e) {
        mouseX = e.clientX;
        mouseY = e.clientY;
    });

    class Particle {
        constructor() {
            this.x = Math.random() * canvas.width;
            this.y = Math.random() * canvas.height;
            this.size = Math.random() * 2.5 + 0.5;
            this.speedX = (Math.random() - 0.5) * 0.6;
            this.speedY = (Math.random() - 0.5) * 0.6;
            this.opacity = Math.random() * 0.4 + 0.1;
        }

        update() {
            this.x += this.speedX;
            this.y += this.speedY;
            if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
            if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;

            const dx = this.x - mouseX;
            const dy = this.y - mouseY;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < 150) {
                const force = (150 - dist) / 150 * 0.5;
                this.speedX += (dx / dist) * force * 0.02;
                this.speedY += (dy / dist) * force * 0.02;
            }

            const maxSpeed = 1.2;
            const spd = Math.sqrt(this.speedX * this.speedX + this.speedY * this.speedY);
            if (spd > maxSpeed) {
                this.speedX = (this.speedX / spd) * maxSpeed;
                this.speedY = (this.speedY / spd) * maxSpeed;
            }
        }

        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            const gradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size * 3);
            gradient.addColorStop(0, `rgba(52, 211, 153, ${this.opacity * 0.8})`);  // 绿色主题
            gradient.addColorStop(1, `rgba(110, 231, 183, ${this.opacity * 0.2})`);
            ctx.fillStyle = gradient;
            ctx.fill();
            ctx.shadowColor = `rgba(52, 211, 153, ${this.opacity * 0.2})`;
            ctx.shadowBlur = 8;
            ctx.fill();
            ctx.shadowBlur = 0;
        }
    }

    const particleCount = Math.min(120, Math.floor(window.innerWidth * window.innerHeight / 8000));
    for (let i = 0; i < particleCount; i++) {
        particles.push(new Particle());
    }

    function drawLines() {
        for (let i = 0; i < particles.length; i++) {
            for (let j = i + 1; j < particles.length; j++) {
                const dx = particles[i].x - particles[j].x;
                const dy = particles[i].y - particles[j].y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < 120) {
                    const opacity = (1 - dist / 120) * 0.15;
                    ctx.beginPath();
                    ctx.moveTo(particles[i].x, particles[i].y);
                    ctx.lineTo(particles[j].x, particles[j].y);
                    ctx.strokeStyle = `rgba(52, 211, 153, ${opacity})`;
                    ctx.lineWidth = 0.6;
                    ctx.stroke();
                }
            }
        }
    }

    function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => { p.update(); p.draw(); });
        drawLines();
        animationId = requestAnimationFrame(animate);
    }

    animate();

    document.addEventListener('visibilitychange', function() {
        if (document.hidden) {
            if (animationId) { cancelAnimationFrame(animationId); animationId = null; }
        } else {
            if (!animationId) animate();
        }
    });

    let resizeTimeout;
    window.addEventListener('resize', function() {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(() => {
            resizeCanvas();
            const newCount = Math.min(120, Math.floor(window.innerWidth * window.innerHeight / 8000));
            if (newCount !== particles.length) {
                particles = [];
                for (let i = 0; i < newCount; i++) particles.push(new Particle());
            }
        }, 500);
    });
})();

// ==================== 姓名建议 ====================
let nameDebounceTimer;

document.getElementById('regName').addEventListener('input', function() {
    const q = this.value.trim();
    const datalist = document.getElementById('nameSuggestions');
    if (q.length < 2) { datalist.innerHTML = ''; return; }
    clearTimeout(nameDebounceTimer);
    nameDebounceTimer = setTimeout(async () => {
        try {
            const res = await fetch(`/api/check-name?q=${encodeURIComponent(q)}`);
            const names = await res.json();
            datalist.innerHTML = names.map(n => `<option value="${escapeHtml(n)}">`).join('');
        } catch (e) { console.error('查询姓名失败', e); }
    }, 300);
});

function escapeHtml(text) {
    const map = {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'};
    return String(text).replace(/[&<>"']/g, m => map[m]);
}

// ==================== OTP 发送 ====================
document.getElementById('regOtpBtn').addEventListener('click', async function() {
    const email = document.getElementById('email').value;
    if (!email || !email.includes('@')) {
        showToast(t('enterValidEmail'), 'warning');
        return;
    }
    
    this.disabled = true;
    let sec = 60;
    const originalText = this.innerHTML;
    const timer = setInterval(() => {
        this.innerHTML = `${sec}s`;
        if (--sec < 0) {
            clearInterval(timer);
            this.disabled = false;
            this.innerHTML = originalText;
        }
    }, 1000);
    
    try {
        const res = await fetch('/api/send-otp', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
                email,
                purpose: 'register'
            })
        });
        const data = await res.json();
        
        if (res.ok && data.success) {
            showToast(t('otpSent'), 'success');
        } else {
            const msg = t(data.message) || t('otpSendFailed');
            showToast(msg, 'error');
            clearInterval(timer);
            this.disabled = false;
            this.innerHTML = originalText;
        }
    } catch(e) {
        clearInterval(timer);
        this.disabled = false;
        this.innerHTML = originalText;
        showToast(t('otpSendFailed'), 'error');
    }
});

// ==================== 国家选择 ====================
document.addEventListener('DOMContentLoaded', async function() {
    // 恢复语言
    const savedLang = localStorage.getItem('app_lang') || 'zh';
    switchLang(savedLang);
    
    // 加载国家列表
    try {
        const res = await fetch('/api/countries');
        const countries = await res.json();
        const datalist = document.getElementById('countryDatalist');
        countries.forEach(c => {
            const opt = document.createElement('option');
            opt.value = c.name_zh;
            datalist.appendChild(opt);
            const optEn = document.createElement('option');
            optEn.value = c.name_en;
            datalist.appendChild(optEn);
            const optCode = document.createElement('option');
            optCode.value = c.code;
            datalist.appendChild(optCode);
        });
    } catch(e) { console.error('加载国家失败', e); }
    
    // 国家输入框失焦校验
    const countryInput = document.getElementById('regCountrySelect');
    const countryCodeHidden = document.getElementById('regCountryCode');
    const countryError = document.getElementById('countryError');
    
    countryInput.addEventListener('blur', async function() {
        const val = this.value.trim();
        if (!val) { countryCodeHidden.value = ''; countryError.style.display = 'block'; return; }
        
        try {
            const res = await fetch('/api/countries');
            const countries = await res.json();
            const matched = countries.find(c => 
                c.name_zh === val || c.name_en === val || c.code === val.toUpperCase()
            );
            if (matched) {
                countryCodeHidden.value = matched.code;
                countryError.style.display = 'none';
            } else {
                countryCodeHidden.value = '';
                countryError.style.display = 'block';
            }
        } catch(e) { console.error('校验国家失败', e); }
    });
});

// ==================== 注册表单提交 ====================
document.getElementById('regForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    // 验证
    let valid = true;
    const email = document.getElementById('email');
    const otp = document.getElementById('otp');
    const password = document.getElementById('password');
    const confirmPwd = document.getElementById('confirm_password');
    const name = document.getElementById('regName');
    const countryCode = document.getElementById('regCountryCode');
    
    if (!email.value || !email.value.includes('@')) {
        document.getElementById('emailError').style.display = 'block';
        valid = false;
    } else {
        document.getElementById('emailError').style.display = 'none';
    }
    
    if (!otp.value || otp.value.length !== 6) {
        showToast(t('input_password'), 'warning');
        valid = false;
    }
    
    if (!password.value || password.value.length < 6) {
        document.getElementById('passwordError').style.display = 'block';
        valid = false;
    } else {
        document.getElementById('passwordError').style.display = 'none';
    }
    
    if (password.value !== confirmPwd.value) {
        document.getElementById('confirmError').style.display = 'block';
        valid = false;
    } else {
        document.getElementById('confirmError').style.display = 'none';
    }
    
    if (!name.value.trim()) {
        showToast(t('input_name'), 'warning');
        valid = false;
    }
    
    if (!countryCode.value) {
        document.getElementById('countryError').style.display = 'block';
        valid = false;
    } else {
        document.getElementById('countryError').style.display = 'none';
    }
    
    if (!valid) return;
    
    const submitBtn = document.getElementById('registerBtn');
    const originalText = submitBtn.innerHTML;
    submitBtn.disabled = true;
    submitBtn.innerHTML = `<span class="spinner-border spinner-border-sm" style="width:18px;height:18px;"></span> ${t('registering')}`;
    
    const data = {
        email: email.value,
        otp: otp.value,
        password: password.value,
        name_en: name.value.trim(),
        birthday: document.getElementById('regBirthday').value || '',
        country: countryCode.value,
        is_partner: document.querySelector('input[name="is_partner"]:checked')?.value || 'N'
    };
    
    try {
        const res = await fetch('/api/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });
        const json = await res.json();
        
        if (json.success) {
            showToast(t('registerSuccess'), 'success');
            setTimeout(() => {
                window.location.href = json.redirect || '/dashboard';
            }, 1500);
        } else {
            const msg = t(json.message) || t('registerFailed');
            showToast(msg, 'error');
            submitBtn.disabled = false;
            submitBtn.innerHTML = originalText;
        }
    } catch(err) {
        showToast(t('networkError') + ': ' + err.message, 'error');
        submitBtn.disabled = false;
        submitBtn.innerHTML = originalText;
    }
});
