<!-- templates/auth/register.html -->
{% extends "base.html" %}
{% block title %}注册 - 培训考试平台{% endblock %}
{% block content %}
<div class="row justify-content-center py-4">
  <div class="col-md-8 col-lg-5">
    <div class="card shadow-sm border-0">
      <div class="card-body p-4">
        <h3 class="text-center mb-4 fw-bold">📝 <span data-i18n="new_user_registration">新用户注册</span></h3>
        <form id="regForm" class="needs-validation" novalidate>
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label"><span data-i18n="email_add">邮箱地址</span> <span class="text-danger">*</span></label>
              <input type="email" name="email" class="form-control" required>
            </div>

            <div class="col-md-6">
              <label class="form-label"><span data-i18n="verification_code">验证码</span> <span class="text-danger">*</span> 
                <button type="button" id="regOtpBtn" class="btn btn-sm btn-outline-primary float-end"><span data-i18n="get">获取</span></button>
              </label>
              <input type="text" name="otp" class="form-control" maxlength="6" pattern="\d{6}" 
              data-i18n-placeholder="placeholder_otp_number"
              required placeholder="6位数字">
            </div>
            <div class="col-md-6">
              <label class="form-label"><span data-i18n="password">密码</span> <span class="text-danger">*</span></label>
              <input type="password" name="password" class="form-control" required minlength="6">
              <small class="text-muted" data-i18n="password_rule">密码长度至少6位</small>
            </div>
            <div class="col-md-6">
              <label class="form-label"><span data-i18n="confirm_password">确认密码</span> <span class="text-danger">*</span></label>
              <input type="password" name="confirm_password" class="form-control" required>
            </div>
            <div class="col-12"><hr class="my-2"></div>
            <div class="col-md-6">
              <label class="form-label"><span data-i18n="name_cn">中文姓名</span></label>
              <input type="text" name="name_cn" class="form-control" 
              data-i18n-placeholder="placeholder_name_cn" 
              placeholder="张三">
            </div>
            <div class="col-md-6">
              <label class="form-label"><span data-i18n="name_en">英文姓名</span> <small class="text-muted"><span data-i18n="name_en_tip">(支持长文本)</span></small></label>
              <input type="text" name="name_en" class="form-control" placeholder="John Alexander Smith">
            </div>
            <div class="col-12">
              <label class="form-label"><span data-i18n="company">公司</span></label>
              <input type="text" name="company" class="form-control" data-i18n-placeholder="placeholder_company_name" placeholder="XX国际物流集团">
            </div>
          </div>
          <button type="submit" class="btn btn-success w-100 mt-4 py-2">✅ <span data-i18n="complete_registration">完成注册</span></button>
        </form>
        <div class="text-center mt-3"><span><span data-i18n="already_have_account_q">已有账号？</span> <a href="{{ url_for('login') }}" class="fw-bold"><span data-i18n="direct_login">直接登录</span></a></span></div>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
  const form = document.getElementById('regForm');
  const otpBtn = document.getElementById('regOtpBtn');
  
  // OTP 倒计时
  otpBtn.addEventListener('click', async () => {
    const email = form.email.value;
    if (!email.includes('@')) return alert(window.i18n.t('js_enter_valid_email'));
    otpBtn.disabled = true; let sec = 60;
    const t = setInterval(() => { otpBtn.textContent = `${sec}s`; if(--sec<0){clearInterval(t);otpBtn.disabled=false;otpBtn.textContent=window.i18n.t('js_get');} },1000);
    const res = await fetch('/api/send-otp', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({email}) });
    if(res.ok) alert(window.i18n.t('js_verification_code_sent')); else alert(window.i18n.t('js_email_available_tip'));
  });

  // 提交注册
  form.addEventListener('submit', async e => {
    e.preventDefault();
    if (!form.checkValidity()) { form.classList.add('was-validated'); return; }
    if (form.password.value !== form.confirm_password.value) return alert(window.i18n.t('js_two_pw_inconsistent'));
    const data = {
      email: form.email.value, otp: form.otp.value, password: form.password.value,
      name_cn: form.name_cn.value, name_en: form.name_en.value, company: form.company.value
    };
    const res = await fetch('/api/register', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(data) });
    const json = await res.json();
    if (json.success) { window.location.href = json.redirect; }
    else alert(json.message || window.i18n.t('js_register_failed'));
  });
</script>
{% endblock %}
