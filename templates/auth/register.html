<!-- templates/auth/register.html -->
{% extends "base.html" %}
{% block title %}注册 - 培训考试平台{% endblock %}
{% block content %}
<div class="row justify-content-center py-4">
  <div class="col-md-8 col-lg-5">
    <div class="card shadow-sm border-0">
      <div class="card-body p-4">
        <h3 class="text-center mb-4 fw-bold">📝 <span data-i18n="new_user_registration">新用户注册</span></h3>
        <form id="regForm" class="needs-validation" novalidate>
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label" for="email"><span data-i18n="email_add">邮箱地址</span> <span class="text-danger">*</span></label>
              <input type="email" name="email" id="email" class="form-control" 
              placeholder="@gmail, @hotmail, @qq, @sina, @icloud" required autocomplete="email"
              style="font-size: 0.875rem;">
            </div>
            <div class="col-md-6">
              <label class="form-label" for="otp"><span data-i18n="verification_code">验证码</span> <span class="text-danger">*</span> 
                <button type="button" id="regOtpBtn" class="btn btn-sm btn-outline-primary float-end"><span data-i18n="get">获取</span></button>
              </label>
              <input type="text" name="otp" id="otp" class="form-control" maxlength="6" pattern="\d{6}" 
              data-i18n-placeholder="placeholder_otp_number" required placeholder="6位数字" autocomplete="one-time-code"
              style="font-size: 0.875rem;">
            </div>
            <div class="col-md-6">
              <label class="form-label" for="password"><span data-i18n="password">密码</span> <span class="text-danger">*</span></label>
              <input type="password" name="password" id="password" class="form-control" required minlength="6" 
              data-i18n-placeholder="placeholder_password_rule" placeholder="密码长度至少6位" autocomplete="new-password" 
              style="font-size: 0.875rem;">
            </div>
            <div class="col-md-6">
              <label class="form-label" for="confirm_password"><span data-i18n="confirm_password">确认密码</span> <span class="text-danger">*</span></label>
              <input type="password" name="confirm_password" id="confirm_password" class="form-control" required 
              data-i18n-placeholder="placeholder_consistent_need" placeholder="密码录入需保持一致" autocomplete="new-password">
            </div>
            <div class="col-12"><hr class="my-2"></div>
            <div class="col-md-6">
              <label class="form-label" for="regName"><span data-i18n="name_en">姓名</span> <span class="text-danger">*</span><small class="text-muted"><span data-i18n="name_en_tip">(支持长文本)</span></small></label>
              <input type="text" name="name_en" id="regName" class="form-control" list="nameSuggestions" 
                data-i18n-placeholder="placeholder_name_spell" placeholder="John Alexander Smith" autocomplete="off"
                style="font-size: 0.875rem;">
              <datalist id="nameSuggestions"></datalist>
            </div>
            <div class="col-md-6">
              <label class="form-label" for="regBirthday"><span data-i18n="birthday">出生日期</span> 
                <small class="text-muted"><span data-i18n="identity_verification">（用于验证身份）</span></small>
              </label>
              <input type="date" name="birthday" id="regBirthday" class="form-control" autocomplete="bday">
            </div>
            <!-- <div class="col-12">
              <label class="form-label" for="company"><span data-i18n="company">公司</span></label>
              <input type="text" name="company" id="company" class="form-control" data-i18n-placeholder="placeholder_company_name" placeholder="XX国际物流集团" autocomplete="organization">
            </div> -->
            <div class="col-md-6">
              <label class="form-label" for="regCountrySelect"><span data-i18n="country">国家</span> <span class="text-danger">*</span></label>
              <input type="text" id="regCountrySelect" class="form-control" list="countryDatalist" 
                data-i18n-placeholder="placeholder_select_or_input" placeholder="输入选择国家" autocomplete="off"
                data-code-input="regCountryCode" required style="font-size: 0.875rem;">
              <datalist id="countryDatalist"></datalist>
              <input type="hidden" name="country" id="regCountryCode">
              <div class="invalid-feedback"><span data-i18n="choice_your_country">请选择您的国家</span></div>
            </div>
            <div class="col-12">
              <label class="form-label fs-6 fw-bold" for="partnerYes"><span data-i18n="is_partner_q">您是服务商吗？</span> <span class="text-danger">*</span></label>             
                <span class="form-check form-check-inline ms-2">
                  <input class="form-check-input" type="radio" name="is_partner" id="partnerYes" value="Y" checked>
                  <label class="form-check-label" for="partnerYes"><span data-i18n="partner_yes">是</span></label>
                </span>
                <span class="form-check form-check-inline">
                  <input class="form-check-input" type="radio" name="is_partner" id="partnerNo" value="N">
                  <label class="form-check-label" for="partnerNo"><span data-i18n="partner_no">否</span></label>
                </span>
            </div>
          </div>
          <button type="submit" class="btn btn-success w-100 mt-4 py-2">✅ <span data-i18n="complete_registration">完成注册</span></button>
        </form>
        <div class="text-center mt-3"><span><span data-i18n="already_have_account_q">已有账号？</span> <a href="{{ url_for('login') }}" class="fw-bold"><span data-i18n="direct_login">直接登录</span></a></span></div>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
  const form = document.getElementById('regForm');
  const otpBtn = document.getElementById('regOtpBtn');
  const regNameInput = document.getElementById('regName');
  const nameDatalist = document.getElementById('nameSuggestions');
  let nameDebounceTimer;

  // OTP 倒计时
  otpBtn.addEventListener('click', async () => {
    const email = form.email.value;
    if (!email.includes('@')) return alert(window.i18n.t('js_enter_valid_email'));
    otpBtn.disabled = true; let sec = 60;
    const t = setInterval(() => { otpBtn.textContent = `${sec}s`; if(--sec<0){clearInterval(t);otpBtn.disabled=false;otpBtn.textContent=window.i18n.t('js_get');} },1000);
    const res = await fetch('/api/send-otp', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({email}) });
    if(res.ok) alert(window.i18n.t('js_verification_code_sent')); else alert(window.i18n.t('js_email_available_tip'));
  });

  // 姓名建议实现只查询 imported 用户
  regNameInput.addEventListener('input', () => {
    const q = regNameInput.value.trim();
    if (q.length < 2) { nameDatalist.innerHTML = ''; return; }
    clearTimeout(nameDebounceTimer);
    nameDebounceTimer = setTimeout(async () => {
      try {
        const res = await fetch(`/api/check-name?q=${encodeURIComponent(q)}`);
        const names = await res.json();
        nameDatalist.innerHTML = names.map(n => `<option value="${escapeHtml(n)}">`).join('');
      } catch (e) { console.error(t('t_name_query_failed'), e); }
    }, 300);
  });

  function escapeHtml(text) {
    const map = {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'};
    return String(text).replace(/[&<>"']/g, m => map[m]);
  }

  // 国家输入框失焦校验
  const regCountryInput = document.getElementById('regCountrySelect');
  if (regCountryInput) {
      regCountryInput.addEventListener('blur', () => {
          validateCountryInput('regCountrySelect', 'regCountryCode');
      });
  }


  // 提交注册
  form.addEventListener('submit', async e => {
    e.preventDefault();
    if (!form.checkValidity()) { form.classList.add('was-validated'); return; }
    // 校验国家是否有效
    const countryCode = document.getElementById('regCountryCode').value;
    if (!countryCode) {
        alert(t('t_select_valid_country'));
        return;
    }
    if (form.password.value !== form.confirm_password.value) return alert(window.i18n.t('js_two_pw_inconsistent'));
    const data = {
      email: form.email.value, 
      otp: form.otp.value, 
      password: form.password.value,
      name_en: form.name_en.value, 
      birthday: form.birthday.value,          // 新增
      // company: form.company.value,
      country: countryCode,
      is_partner: form.querySelector('input[name="is_partner"]:checked')?.value || 'N'
    };
    const res = await fetch('/api/register', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(data) });
    const json = await res.json();
    if (json.success) { window.location.href = json.redirect; }
    // else alert(json.message || window.i18n.t('js_register_failed'));
    else apiAlert(json);   // 使用全局翻译函数
  });

  // 初始化国家列表
  document.addEventListener('DOMContentLoaded', async () => {
      await setupCountryAutocomplete('regCountrySelect', 'countryDatalist', 'regCountryCode');
  });
</script>
{% endblock %}
