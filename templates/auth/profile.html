<!-- templates/auth/profile.html -->
{% extends "base.html" %}
{% block title %}{{ _('personal_info') }}{% endblock %}
{% block content %}
<div class="container py-4">
    <div class="row">
        <!-- 基本信息编辑 -->
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0"><span data-i18n="basic_info">基本信息</span></h4>
                </div>
                <div class="card-body">
                    <form method="POST" action="{{ url_for('profile') }}">
                        <input type="hidden" name="action" value="update_info">
                        
                        <!-- 第一行：姓名，生日 -->
                        <div class="d-flex flex-wrap gap-3 mb-3">
                            <div class="flex-grow-1" style="min-width: 200px;">
                                <label class="form-label" for="name_en"><span data-i18n="name_en">姓名</span></label>
                                <input type="text" name="name_en" id="name_en" class="form-control" value="{{ user.name_en or '' }}" autocomplete="name">
                            </div>
                            <div class="flex-grow-1" style="min-width: 200px;">
                                <label class="form-label" for="birthday"><span data-i18n="birthday">出生日期</span> 
                                    <small class="text-muted"><span data-i18n="identity_verification">（用于验证身份）</span></small>
                                </label>
                                <input type="date" name="birthday" id="birthday" class="form-control" value="{{ user.birthday or '' }}" autocomplete="bday">
                            </div>
                        </div>

                        <!-- 第二行：国家，公司/合作伙伴 -->
                        <div class="d-flex flex-wrap gap-3 mb-3">
                            <div class="flex-grow-1" style="min-width: 200px;">
                                <label class="form-label" for="countrySelect" data-i18n="country">国家</label>
                                <input type="text" id="countrySelect" class="form-control" 
                                value="{{ user.country_display or '' }}" readonly disabled>
                                <input type="hidden" name="country" id="countryCode" value="{{ user.country or '' }}">
                                <small class="text-muted">国家信息不可自行修改，请联系管理员</small>
                            </div>
                            <!-- 如果是超管或管理员，显示权限范围（只读） -->
                            {% if user.role in ['admin', 'super_admin'] %}
                            <div class="flex-grow-1" style="min-width: 200px;">
                                <label class="form-label" data-i18n="power_scope">权限范围</label>
                                <input type="text" class="form-control" 
                                    value="{{ user.admin_countries_display or '无限制' }}" readonly disabled>
                                <small class="text-muted">权限范围不可自行修改，请联系上级管理员</small>
                            </div>
                            {% endif %}
                            <div class="flex-grow-1" style="min-width: 200px;">
                                <label class="form-label" for="company"><span data-i18n="company">公司/合作伙伴</span></label>
                                <input type="text" name="company" id="company" class="form-control" value="{{ user.company or '' }}" autocomplete="organization">
                            </div>
                        </div>

                        <!-- 第三行：部门，工号 -->
                        <div class="d-flex flex-wrap gap-3 mb-3">
                            <div class="flex-grow-1" style="min-width: 200px;">
                                <label class="form-label" for="department"><span data-i18n="department">部门</span></label>
                                <input type="text" name="department" id="department" class="form-control" value="{{ user.department or '' }}" autocomplete="organization-title">
                            </div>
                            <div class="flex-grow-1" style="min-width: 200px;">
                                <label class="form-label" for="employee_id"><span data-i18n="employee_id">工号</span></label>
                                <input type="text" name="employee_id" id="employee_id" class="form-control" value="{{ user.employee_id or '' }}" autocomplete="off">
                            </div>
                        </div>

                        <!-- 第四行：邮箱，手机号 -->
                        <div class="d-flex flex-wrap gap-3 mb-3">
                            <div class="flex-grow-1" style="min-width: 200px;">
                                <label class="form-label" for="email"><span data-i18n="email">邮箱</span></label>
                                <input type="email" name="email" id="email" class="form-control" value="{{ user.email }}" disabled autocomplete="email">
                                <small class="text-muted"><span data-i18n="mail_no_modify">邮箱不可修改</span></small>
                            </div>
                            <div class="flex-grow-1" style="min-width: 200px;">
                                <label class="form-label" for="phone" data-i18n="phone">手机号</label>
                                <input type="text" name="phone" id="phone" class="form-control" value="{{ user.phone or '' }}" autocomplete="tel">
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary"><span data-i18n="save">保存修改</span></button>
                        <button type="button" class="btn btn-sm btn-outline-secondary ms-auto" onclick="history.back();">✖ <span data-i18n="close">关闭</span></button>
                    </form>
                </div>
            </div>
        </div>

        <!-- 修改密码 -->
        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-header bg-warning text-dark">
                    <h4 class="mb-0" data-i18n="change_password_title">修改密码</h4>
                </div>
                <div class="card-body">
                    <form method="POST" action="{{ url_for('profile') }}">
                        <input type="hidden" name="action" value="change_password">
                        <div class="mb-3">
                            <label class="form-label" for="old_password" data-i18n="old_password">原密码</label>
                            <input type="password" name="old_password" id="old_password" class="form-control" required autocomplete="current-password">
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="new_password" data-i18n="new_password">新密码</label>
                            <input type="password" name="new_password" id="new_password" class="form-control" required minlength="6" autocomplete="new-password">
                            <small class="text-muted" data-i18n="password_rule">密码长度至少6位</small>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="confirm_password" data-i18n="confirm_new_password">确认新密码</label>
                            <input type="password" name="confirm_password" id="confirm_password" class="form-control" required autocomplete="new-password">
                        </div>
                        <button type="submit" class="btn btn-warning" data-i18n="change_password_btn">修改密码</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}

{% block extra_js %}
<script>
    document.addEventListener('DOMContentLoaded', async () => {
        await setupCountryAutocomplete('countrySelect', 'countryDatalist', 'countryCode');

        // 3. 根据已有国家代码设置输入框的显示文本
        const userCountryCode = "{{ user.country or '' }}";
        if (userCountryCode) {
            const countries = await loadCountryList();
            const matched = countries.find(c => c.code === userCountryCode);
            if (matched) {
                const currentLang = window.i18n?.currentLang || 'zh';
                document.getElementById('countrySelect').value = currentLang === 'zh' ? matched.name_zh : matched.name_en;
                document.getElementById('countryCode').value = matched.code;
            }
        }

        // 4. 国际化翻译
        if (window.i18n) { 
            window.i18n.applyTranslations();
        }
    });
</script>
{% endblock %}
