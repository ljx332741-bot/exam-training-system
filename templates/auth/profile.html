{% extends "base.html" %}
{% block title %}{{ _('personal_info') }}{% endblock %}
{% block content %}
<div class="container py-4">
    <div class="row">
        <!-- 基本信息编辑 -->
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0"><span data-i18n="basic_info">基本信息</span></h4>
                </div>
                <div class="card-body">
                    <form method="POST" action="{{ url_for('profile') }}">
                        <input type="hidden" name="action" value="update_info">
                        <div class="mb-3">
                            <label class="form-label"><span data-i18n="name_en">姓名</span></label>
                            <input type="text" name="name_en" class="form-control" value="{{ user.name_en or '' }}">
                        </div>
                        <div class="mb-3">
                            <label class="form-label"><span data-i18n="company">公司</span></label>
                            <input type="text" name="company" class="form-control" value="{{ user.company or '' }}">
                        </div>
                        <div class="mb-3">
                            <label class="form-label"><span data-i18n="department">部门</span></label>
                            <input type="text" name="department" class="form-control" value="{{ user.department or '' }}">
                        </div>
                        <div class="mb-3">
                            <label class="form-label"><span data-i18n="employee_id">工号</span></label>
                            <input type="text" name="employee_id" class="form-control" value="{{ user.employee_id or '' }}">
                        </div>
                        <div class="mb-3">
                            <label class="form-label" data-i18n="country">国家</label>
                            <input type="text" id="countrySelect" class="form-control" list="countryDatalist" 
                            placeholder="输入选择国家" autocomplete="off"
                            data-code-input="countryCode">
                            <datalist id="countryDatalist"></datalist>
                            <input type="hidden" name="country" id="countryCode" value="{{ user.country or '' }}">
                        </div>
                        <div class="mb-3">
                            <label class="form-label" data-i18n="phone">手机号</label>
                            <input type="text" name="phone" class="form-control" value="{{ user.phone or '' }}">
                        </div>
                        <div class="mb-3">
                            <label class="form-label"><span data-i18n="email">邮箱</span></label>
                            <input type="email" class="form-control" value="{{ user.email }}" disabled>
                            <small class="text-muted"><span data-i18n="mail_no_modify">邮箱不可修改</span></small>
                        </div>
                        <button type="submit" class="btn btn-primary"><span data-i18n="save">保存修改</span></button>
                        <a href="{{ url_for('dashboard') }}" class="btn btn-secondary"><span data-i18n="back">← 返回</span></a>
                    </form>
                </div>
            </div>
        </div>

        <!-- 修改密码 -->
        <div class="col-md-6">
            <div class="card shadow-sm">
                <div class="card-header bg-warning text-dark">
                    <h4 class="mb-0" data-i18n="change_password_title">修改密码</h4>
                </div>
                <div class="card-body">
                    <form method="POST" action="{{ url_for('profile') }}">
                        <input type="hidden" name="action" value="change_password">
                        <div class="mb-3">
                            <label class="form-label" data-i18n="old_password">原密码</label>
                            <input type="password" name="old_password" class="form-control" required autocomplete="current-password">
                        </div>
                        <div class="mb-3">
                            <label class="form-label" data-i18n="new_password">新密码</label>
                            <input type="password" name="new_password" class="form-control" required minlength="6" autocomplete="new-password">
                            <small class="text-muted" data-i18n="password_rule">密码长度至少6位</small>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" data-i18n="confirm_new_password">确认新密码</label>
                            <input type="password" name="confirm_password" class="form-control" required autocomplete="new-password">
                        </div>
                        <button type="submit" class="btn btn-warning" data-i18n="change_password_btn">修改密码</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    document.addEventListener('DOMContentLoaded', async () => {
        // 1. 填充国家 datalist
        await populateCountryDatalist('countryDatalist');

        // 2. 绑定失焦校验
        const countryInput = document.getElementById('countrySelect');
        if (countryInput) {
            countryInput.addEventListener('blur', () => {
                validateCountryInput('countrySelect', 'countryCode');
            });
        }

        // 3. 根据已有国家代码设置输入框的显示文本
        const userCountryCode = "{{ user.country or '' }}";
        if (userCountryCode) {
            const countries = await loadCountryList();
            const matched = countries.find(c => c.code === userCountryCode);
            if (matched) {
                const currentLang = window.i18n?.currentLang || 'zh';
                document.getElementById('countrySelect').value = currentLang === 'zh' ? matched.name_zh : matched.name_en;
                document.getElementById('countryCode').value = matched.code;
            }
        }

        // 4. 国际化翻译
        if (window.i18n) { 
            window.i18n.applyTranslations();
        }
    });
</script>
{% endblock %}
