<!-- templates/components/privacy_modal.html -->
<div class="modal fade" id="privacyModal" tabindex="-1" data-bs-backdrop="static" data-bs-keyboard="false">
    <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content" style="background: rgba(20, 25, 45, 0.98); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.08); border-radius: 20px;">
            <div class="modal-header" style="border-bottom: 1px solid rgba(255,255,255,0.06);">
                <h5 class="modal-title" id="privacyModalTitle" style="color: #fff; font-weight: 600;">
                    <i class="bi bi-shield-lock me-2" style="color: #34d399;"></i>
                    <span data-i18n="privacy_title">数据保护与隐私声明</span>
                </h5>
                <div style="display: flex; align-items: center; gap: 12px;">
                    <span id="privacyVersion" style="color: rgba(255,255,255,0.4); font-size: 0.75rem; background: rgba(255,255,255,0.06); padding: 2px 12px; border-radius: 12px;"></span>
                    <span id="privacyDate" style="color: rgba(255,255,255,0.3); font-size: 0.7rem;"></span>
                </div>
            </div>
            <div class="modal-body" style="padding: 24px 28px; max-height: 55vh; overflow-y: auto; color: rgba(255,255,255,0.85);">
                <div id="privacyContent" style="line-height: 1.8; font-size: 0.92rem;">
                    <div class="text-center py-4">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer" style="border-top: 1px solid rgba(255,255,255,0.06); padding: 16px 28px; flex-wrap: wrap;">
                <div style="flex: 1; display: flex; align-items: center; gap: 12px; min-width: 200px;">
                    <input type="checkbox" id="privacyAgreeCheck" style="width: 18px; height: 18px; accent-color: #34d399;">
                    <label for="privacyAgreeCheck" style="color: rgba(255,255,255,0.6); font-size: 0.85rem; cursor: pointer;">
                        <span data-i18n="privacy_agree_text">我已阅读并同意以上隐私声明</span>
                    </label>
                </div>
                <button class="btn btn-primary" id="privacyConfirmBtn" disabled style="border-radius: 10px; padding: 10px 32px; background: linear-gradient(135deg, #34d399, #6ee7b7); border: none; color: #0a0e1a; font-weight: 600; min-width: 140px;">
                    <span data-i18n="confirm_and_continue">确认并继续</span>
                    <i class="bi bi-arrow-right ms-1"></i>
                </button>
            </div>
        </div>
    </div>
</div>
