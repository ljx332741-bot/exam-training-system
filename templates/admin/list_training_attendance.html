<!-- templates/admin/list_training_attendance.html -->
{% extends "base.html" %}
{% block title %}培训签到详情{% endblock %}

{% block content %}

<style media="print">
    /* ========== 打印全局设置 ========== */
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    
    body {
        font-family: 'Microsoft YaHei', 'SimHei', 'PingFang SC', sans-serif;
        font-size: 10pt;
        padding: 0;
        margin: 0;
    }
    
    /* 隐藏不需要打印的元素 */
    .no-print, 
    .navbar, 
    footer, 
    .btn, 
    button,
    .print-hide,
    #selectAll,
    .attendance-checkbox,
    .d-flex.justify-content-end,
    .dropdown,
    nav,
    .card-footer,
    .pagination,
    [class*="btn"],
    .country-cell {
        display: none !important;
    }
    
    /* 卡片样式重置 */
    .card {
        border: none !important;
        box-shadow: none !important;
        margin: 0 !important;
        padding: 0 !important;
    }
    
    .card-body {
        padding: 0 !important;
    }
    
    .container-fluid {
        padding: 0 !important;
        margin: 0 !important;
    }
    
    /* ========== 标题样式 ========== */
    h2 {
        font-size: 14pt;
        font-weight: bold;
        text-align: center;
        margin-bottom: 15px;
        display: block !important;
    }
    
    /* ========== 表头信息两列布局（与 PDF 一致）========== */
    #headerInfo .row {
        border: 1px solid #000;
        border-collapse: collapse;
        margin-bottom: 15px;
    }
    #headerInfo .row > .col-md-6 {
        border: 1px solid #000;
        padding: 4px 6px;
        font-size: 10pt;
        word-break: break-word;
    }

    #headerInfo .col-md-6:nth-child(odd) {
        clear: left;
    }
    
    #headerInfo .row::after {
        content: "";
        display: table;
        clear: both;
    }
    
    #headerInfo hr {
        display: none;
    }
    
    /* ========== 🔥 关键修复：表头和表格作为一个整体不分页 ========== */
    #printArea {
        page-break-inside: avoid !important;
    }
    
    /* 🔥 修复：表头信息与表格保持在一起 */
    #headerInfo {
        page-break-after: avoid !important;
        page-break-inside: avoid !important;
    }
    
    /* 🔥 表格容器不分页 */
    .table-responsive {
        page-break-inside: avoid !important;
        page-break-before: avoid !important;
        overflow: visible !important;
    }
    
    /* ========== 签到表格样式 ==========
    .table-responsive {
        overflow: visible !important;
    }  */
    
    .table {
        width: 100% !important;
        border-collapse: collapse !important;
        table-layout: fixed !important;
        font-size: 9pt;
    }
    
    .table-bordered,
    .table-bordered th,
    .table-bordered td {
        border: 1px solid #000 !important;
    }
    
    /* 表格头部背景（保持浅灰） */
    .table thead th {
        background-color: #f0f0f0 !important;
        font-weight: bold;
        text-align: center;
    }
    
    /* 打印时只保留可见列，隐藏操作列和多余列 */
    .table th:nth-child(1),  /* 复选框列（隐藏） */
    .table td:nth-child(1) {
        display: none !important;
    }
    
    .table th:nth-child(6),  /* 签到时间列（隐藏） */
    .table td:nth-child(6) {
        display: none !important;
    }
    
    .table th:nth-child(7),  /* 国家列（隐藏） */
    .table td:nth-child(7) {
        display: none !important;
    }
    
    .table th:nth-child(8),  /* 操作列（隐藏） */
    .table td:nth-child(8) {
        display: none !important;
    }
    
    /* 重新计算打印时可见列的数量（4列） */
    .table th:nth-child(2),
    .table td:nth-child(2) {
        width: 8% !important;  /* 序号 */
    }
    
    .table th:nth-child(3),
    .table td:nth-child(3) {
        width: 34% !important;  /* 部门/合作伙伴 */
    }
    
    .table th:nth-child(4),
    .table td:nth-child(4) {
        width: 30% !important;  /* 姓名+工号 */
    }
    
    .table th:nth-child(5),
    .table td:nth-child(5) {
        width: 28% !important;  /* 签名 */
    }
    
    /* 表格单元格内边距 */
    .table td, 
    .table th {
        padding: 6px 8px;
        vertical-align: middle;
        word-break: break-word;
    }
    
    /* 序号列居中对齐 */
    .table td:nth-child(2),
    .table th:nth-child(2) {
        text-align: center;
    }
    
    /* 签名图片样式 */
    .table td img {
        max-width: 100px;
        max-height: 45px;
        object-fit: contain;
    }
    
    /* 无签名的提示文字 */
    .text-warning {
        color: #856404 !important;
        font-style: italic;
    }
    
    /* ========== 页面边距设置 ========== */
    @page {
        size: A4;
        margin: 1.5cm;
    }
    
    /* ========== 🔥 分页控制 ========== */
    /* 表格行尽量不分页 */
    .table tr {
        page-break-inside: avoid !important;
        page-break-after: auto !important;
    }
    
    /* 表格头部重复打印 */
    .table thead {
        display: table-header-group;
    }
    
    /* 🔥 强制将表头和表格保持在同一页，如果放不下则一起到下一页 */
    #printArea {
        page-break-inside: avoid !important;
    }
    
    /* 🔥 表头信息块不要单独分页 */
    #headerInfo {
        page-break-after: avoid !important;
    }
    
    /* 🔥 表格容器不要单独分页 */
    .table-responsive {
        page-break-before: avoid !important;
    }
    
    /* 标题和表头不分页 */
    h2, #headerInfo {
        page-break-after: avoid;
    }
    
    /* 🔥 整个打印区域作为一个整体 */
    #printArea .card-body {
        page-break-inside: avoid !important;
    }
    
    /* ============================================================
    加载动画样式
    ============================================================ */

    /* 加载遮罩 */
    #loadingOverlay {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(255, 255, 255, 0.88);
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 1000;
        border-radius: 8px;
        min-height: 200px;
    }

    /* 加载动画 - 旋转圈 */
    #loadingOverlay .spinner-border {
        width: 2.5rem;
        height: 2.5rem;
    }

    /* 加载文字 */
    #loadingOverlay .text-muted {
        font-size: 0.9rem;
        color: #6c757d !important;
    }

    /* 加载点动画 */
    .loading-dots {
        display: inline-block;
        font-size: 1.2rem;
        letter-spacing: 4px;
    }

    .loading-dots::after {
        content: '...';
        animation: dots 1.5s steps(3) infinite;
    }

    @keyframes dots {
        0% { content: ''; }
        33% { content: '.'; }
        66% { content: '..'; }
        100% { content: '...'; }
    }

    /* 也可以使用纯 CSS 点动画 */
    .loading-dots-alt {
        display: inline-flex;
        gap: 6px;
        align-items: center;
    }

    .loading-dots-alt span {
        width: 8px;
        height: 8px;
        background: #0d6efd;
        border-radius: 50%;
        animation: dotPulse 1.2s ease-in-out infinite;
    }

    .loading-dots-alt span:nth-child(2) {
        animation-delay: 0.2s;
    }

    .loading-dots-alt span:nth-child(3) {
        animation-delay: 0.4s;
    }

    @keyframes dotPulse {
        0%, 80%, 100% {
            transform: scale(0.6);
            opacity: 0.4;
        }
        40% {
            transform: scale(1);
            opacity: 1;
        }
    }
</style>

<div class="container-fluid">
    <div class="mb-4">
        <h2 class="mb-2" id="attendanceTitle"><i class="bi bi-people-fill"></i> <span data-i18n="training_attendance_record">培训签到表</span></h2>
        <div class="d-flex justify-content-end gap-2 no-print">
            <button class="btn btn-primary" onclick="window.print();"><i class="bi bi-printer"></i> <span data-i18n="print">打印</span></button>
            <a id="pdfExportBtn" class="btn btn-success" href="#" target="_blank">
                <i class="bi bi-download"></i> <span data-i18n="expert_pdf">PDF专用</span>
            </a>
            <button class="btn btn-sm btn-outline-secondary" id="backButton">
                <i class="bi bi-arrow-left me-1"></i> <span data-i18n="back">返回</span>
            </button>
        </div> 
    </div>

    <div class="card shadow-sm" id="printArea">
        <div class="card-body">
            <div class="mb-4" id="headerInfo">
                <!-- 动态加载表头信息 -->
            </div>
            <div class="table-responsive">
                <table class="table table-bordered align-middle">
                    <thead class="table-light">
                        <tr>
                            <th class="no-print" style="width: 5%;"><input type="checkbox" id="selectAll"></th>
                            <th style="width: 5%;">序号No</th>
                            <th style="width: 30%;">部门/合作伙伴（双语）Department/Partner</th>
                            <th style="width: 20%;">姓名+工号Name + Employee ID </th>
                            <th style="width: 20%;">签名Signature</th>
                            <th class="print-hide" style="width: 10%;" data-i18n="sign_in_period">签到时间</th>
                            <th class="print-hide" style="width: 5%;" data-i18n="country">国家</th>
                            <th class="print-hide" style="width: 5%;" data-i18n="actions">操作</th>
                        </tr>
                    </thead>
                    <tbody id="attendanceTbody">
                        <tr><td colspan="8" class="text-center"><span data-i18n="loading">加载中...</span></td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

{% endblock %}

            }

            window.history.replaceState({}, '', newUrl);
            country = '';

        let apiUrl = `/api/training/attendance/${trainingId}`;
        if (country) {
            apiUrl += `?country=${encodeURIComponent(country)}`;

                const signatureCell = r.signature_url
                    ? `<img src="${r.signature_url}" style="max-height:70px; max-width:150px;" onerror="this.style.display='none'">`
                    : `<span class="text-warning fw-bold">${t('pending_re_signature')}</span>`;

                const row = tbody.insertRow();
                row.innerHTML = `
                    <td class="no-print"><input type="checkbox" class="attendance-checkbox" data-att-id="${r.id}"></td>
                    <td>${idx+1}</td>
                    <td>${escapeHtml(r.company || '')}</td>
                    <td>${escapeHtml(nameDisplay)}${empId}</td>
                    <td>${signatureCell}</td>
                    <td class="print-hide">${formatLocalTime(r.sign_time)}</td>
                    <td class="country-cell no-print" title="${escapeHtml(r.country)}">${escapeHtml(r.country)}</td>
                    <td class="print-hide">
                        <button class="btn btn-sm btn-outline-warning reset-sign-btn" data-id="${r.id}">
                            <i class="bi bi-pencil-square"></i> ${t('re_signature')}
                        </button>
                        <button class="btn btn-sm btn-outline-danger delete-attendance-btn" data-id="${r.id}" data-name="${escapeHtml(nameDisplay)}">
                            <i class="bi bi-trash"></i> ${t('t_delete')}
                        </button>
                    </td>
                `;
            });
            
            // ✅ 隐藏加载状态
            hideLoadingState();
            
            // 绑定删除按钮事件
            document.querySelectorAll('.delete-attendance-btn').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    e.stopPropagation();
                    const attId = btn.dataset.id;
                    const name = btn.dataset.name;
                    if (confirm(t('t_confirm_delete_attendance').replace('{name}', name))) {
                        await deleteSingleAttendance(attId);
                    }
                });
            });
            
            // 绑定重置签名按钮事件
            document.querySelectorAll('.reset-sign-btn').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    const attId = e.currentTarget.dataset.id;
                    if (!confirm(t('t_re_sign_prompt'))) return;
                    const res = await fetch(`/api/admin/training/attendance/${attId}/reset-signature`, { method: 'POST' });
                    const json = await res.json();
                    if (json.success) {
                        alert(t('t_re_sign_pushed_prompt'));
                        loadDetail();
                    } else {
                        alert(t('t_operation_failure') + (json.message || t('t_unknown_error')));
                    }
                });
            });

            // 绑定专用PDF导出按钮
            const pdfBtn = document.getElementById('pdfExportBtn');
            if (pdfBtn) {
                const countryParam = country ? `?country=${encodeURIComponent(country)}` : '';
                pdfBtn.href = `/admin/training/${trainingId}/attendance/pdf${countryParam}`;
            }
            
            // 添加批量删除按钮
            addBatchDeleteButton();
            // 绑定全选按钮
            bindSelectAll();
            
        } catch (err) {
            console.error('加载签到详情失败:', err);
            hideLoadingState();
            const tbody = document.getElementById('attendanceTbody');
            if (tbody) {
                tbody.innerHTML = `<tr><td colspan="8" class="text-center text-danger">${t('load_failed')}: ${err.message}</td></tr>`;
            }
        }
    }

    // ============================================================
    // 加载状态控制
    // ============================================================
    let loadingOverlay = null;

    function showLoadingState(message) {
        // 移除已存在的加载提示
        hideLoadingState();
        
        // 获取表格容器
        const tableContainer = document.querySelector('.table-responsive');
        if (!tableContainer) return;
        
        // 创建加载遮罩
        loadingOverlay = document.createElement('div');
        loadingOverlay.id = 'loadingOverlay';
        loadingOverlay.style.cssText = `
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(4px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            border-radius: 8px;
            min-height: 200px;
        `;
        loadingOverlay.innerHTML = `
            <div class="spinner-border text-primary" style="width: 2.5rem; height: 2.5rem;" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <div class="mt-3 text-muted" style="font-size: 0.9rem;">${escapeHtml(message || '加载中...')}</div>
            <div class="mt-2 text-muted small">
                <span class="loading-dots"></span>
            </div>
        `;
        
        // 确保表格容器是相对定位
        if (tableContainer.style.position !== 'relative') {
            tableContainer.style.position = 'relative';
        }
        
        tableContainer.appendChild(loadingOverlay);
    }

    function updateLoadingState(message) {
        if (!loadingOverlay) return;
        const textEl = loadingOverlay.querySelector('.text-muted');
        if (textEl && message) {
            textEl.textContent = message;
        }
    }

    function hideLoadingState() {
        if (loadingOverlay) {
            loadingOverlay.remove();
            loadingOverlay = null;
        }
    }

    // 全选功能
    function bindSelectAll() {
        const selectAll = document.getElementById('selectAll');
        if (selectAll) {
            selectAll.addEventListener('change', (e) => {
                document.querySelectorAll('.attendance-checkbox').forEach(cb => cb.checked = e.target.checked);
            });
        }
    }

    // 批量删除签到记录
    async function batchDeleteAttendances() {
        const selectedIds = Array.from(document.querySelectorAll('.attendance-checkbox:checked'))
            .map(cb => cb.dataset.attId);
        
        if (selectedIds.length === 0) {
            alert(t('t_at_least_one_select'));
            return;
        }
        
        if (typeof window.showDeleteConfirm === 'function') {
            window.showDeleteConfirm({
                message: `确定要删除选中的 ${selectedIds.length} 条签到记录吗？`,
                ids: selectedIds,
                type: 'soft',
                onConfirm: async (deleteType, ids) => {
                    const response = await fetch('/api/admin/training/attendance/batch_delete', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ ids: ids, delete_type: deleteType })
                    });
                    const data = await response.json();
                    if (data.success) {
                        alert(`删除成功: ${data.success_count} 条`);
                        loadDetail(); // 刷新列表
                    } else {
                        alert('删除失败: ' + (data.message || ''));
                    }
                }
            });
        } else {
            if (confirm(`确定要删除选中的 ${selectedIds.length} 条签到记录吗？`)) {
                const response = await fetch('/api/admin/training/attendance/batch_delete', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ids: selectedIds, delete_type: 'soft' })
                });
                const data = await response.json();
                if (data.success) {
                    alert(`删除成功: ${data.success_count} 条`);
                    loadDetail();
                }
            }
        }
    }

    // 单个删除签到记录
    async function deleteSingleAttendance(attendanceId, userName) {
        if (typeof window.showDeleteConfirm === 'function') {
            window.showDeleteConfirm({
                message: `确定要删除 ${userName} 的签到记录吗？`,
                ids: [attendanceId],
                type: 'soft',
                onConfirm: async (deleteType, ids) => {
                    const response = await fetch('/api/admin/training/attendance/batch_delete', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ ids: ids, delete_type: deleteType })
                    });
                    const data = await response.json();
                    if (data.success) {
                        alert('删除成功');
                        loadDetail();
                    } else {
                        alert('删除失败');
                    }
                }
            });
        } else {
            if (confirm(`确定要删除 ${userName} 的签到记录吗？`)) {
                const response = await fetch(`/api/admin/training/attendance/${attendanceId}`, {
                    method: 'DELETE'
                });
                const data = await response.json();
                if (data.success) {
                    alert('删除成功');
                    loadDetail();
                }
            }
        }
    }

    // 添加批量删除按钮
    function addBatchDeleteButton() {
        const headerDiv = document.querySelector('.d-flex.justify-content-end.gap-2');
        if (headerDiv && !document.getElementById('batchDeleteBtn')) {
            const batchDeleteBtn = document.createElement('button');
            batchDeleteBtn.id = 'batchDeleteBtn';
            batchDeleteBtn.className = 'btn btn-danger no-print';
            batchDeleteBtn.innerHTML = `<i class="bi bi-trash no-print"></i> ${t('batch_delete')}`;
            batchDeleteBtn.onclick = batchDeleteAttendances;

            // 手动触发翻译
            if (typeof window.i18n !== 'undefined' && window.i18n.currentLang) {
                const span = batchDeleteBtn.querySelector('[data-i18n="batch_delete"]');
                if (span && typeof t === 'function') {
                    span.textContent = t('batch_delete');
                }
            }
            // 插入到打印按钮后面
            const printBtn = headerDiv.querySelector('.btn-success');
            if (printBtn) {
                printBtn.after(batchDeleteBtn);
            } else {
                headerDiv.appendChild(batchDeleteBtn);
            }
        }
    }

    // 更新批量删除按钮文本（语言切换时调用）
    function updateBatchDeleteButtonText() {
        const batchDeleteBtn = document.getElementById('batchDeleteBtn');
        if (batchDeleteBtn && typeof t === 'function') {
            const span = batchDeleteBtn.querySelector('[data-i18n="batch_delete"]');
            if (span) {
                span.textContent = t('batch_delete');
            }
        }
    }

    // 监听语言切换事件，重新加载数据以更新按钮文字
    // 监听语言切换事件
    window.addEventListener('app:languageChanged', () => {
        currentPage = 1;
        loadDetail();
        // 更新批量删除按钮的文本
        updateBatchDeleteButtonText();
        // 更新 PDF 导出按钮文本（如果有需要）
        const pdfExportBtn = document.getElementById('pdfExportBtn');
        if (pdfExportBtn && typeof t === 'function') {
            const span = pdfExportBtn.querySelector('[data-i18n="expert_pdf"]');
            if (span) span.textContent = t('expert_pdf');
        }
    });

    function escapeHtml(str) {
        if(!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if(m === '&') return '&amp;';
            if(m === '<') return '&lt;';
            if(m === '>') return '&gt;';
            return m;
        });
    }

    loadDetail();

    // ============================================================
    // 来源检测和返回逻辑
    // ============================================================
    // ============================================================
    // 来源检测和返回逻辑（修复版）
    // ============================================================
    function initBackButton() {
        const backBtn = document.getElementById('backButton');
        if (!backBtn) return;
        
        // 检查是否有来源信息（URL 参数）
        const urlParams = new URLSearchParams(window.location.search);
        const from = urlParams.get('from');
        
        // 检查是否从考试绑定进入
        const isFromExamBinding = from === 'exam_binding';
        
        if (isFromExamBinding) {
            // ✅ 从考试绑定进入 → 改为"关闭"按钮（关闭当前标签页或返回考试列表）
            backBtn.innerHTML = `<i class="bi bi-x-lg me-1"></i> <span data-i18n="close">${t('close')}</span>`;
            backBtn.onclick = function(e) {
                e.preventDefault();
                // 尝试关闭当前标签页
                window.close();
                // 如果无法关闭（某些浏览器限制），尝试跳转到考试列表
                setTimeout(function() {
                    window.location.href = '/admin/exams';
                }, 100);
            };
        } else {
            // 从培训管理页面进入 → 正常返回上一页
            backBtn.onclick = function(e) {
                e.preventDefault();
                history.back();
            };
        }
    }

    // 在页面加载时初始化
    document.addEventListener('DOMContentLoaded', async () => {
        await waitForI18n();
        initBackButton();  // ✅ 初始化返回按钮
        loadDetail();
        addBatchDeleteButton();
    });
</script>
{% endblock %}
