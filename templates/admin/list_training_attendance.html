<!-- templates/admin/list_training_attendance.html -->
{% extends "base.html" %}
{% block title %}培训签到详情{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="mb-4">
        <h2 class="mb-2" id="attendanceTitle"><i class="bi bi-people-fill"></i> <span data-i18n="training_attendance_record">培训签到表</span></h2>
        <div class="d-flex justify-content-end gap-2 no-print">
            <button class="btn btn-success" onclick="window.print();"><i class="bi bi-printer"></i> <span data-i18n="brower_export_pdf">打印</span></button>
            <a id="pdfExportBtn" class="btn btn-success" href="#" target="_blank">
                <i class="bi bi-download"></i> <span data-i18n="expert_pdf">PDF专用</span>
            </a>
            <button class="btn btn-sm btn-outline-secondary" onclick="history.back();">✖ <span data-i18n="close">关闭</span></button>
        </div> 
    </div>

    <div class="card shadow-sm" id="printArea">
        <div class="card-body">
            <div class="mb-4" id="headerInfo">
                <!-- 动态加载表头信息 -->
            </div>
            <div class="table-responsive">
                <table class="table table-bordered align-middle">
                    <thead class="table-light">
                        <tr>
                            <th class="no-print"><input type="checkbox" id="selectAll"></th>
                            <th>序号No</th>
                            <th>部门/合作伙伴（双语）Department/Partner</th>
                            <th>姓名+工号Name + Employee ID </th>
                            <th>签名Signature</th>
                            <th class="print-hide" data-i18n="sign_in_period">签到时间</th>
                            <th class="print-hide" data-i18n="country">国家</th>
                            <th class="print-hide" data-i18n="actions">操作</th>
                        </tr>
                    </thead>
                    <tbody id="attendanceTbody">
                        <tr><td colspan="5" class="text-center"><span data-i18n="loading">加载中...</span></td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<style media="print">
    #headerInfo .row {
        border: 1px solid #000;
        border-collapse: collapse;
        margin-bottom: 15px;
    }
    #headerInfo .row > .col-md-6 {
        border: 1px solid #000;
        padding: 4px 6px;
        font-size: 10pt;
        word-break: break-word;
    }

    /* 隐藏按钮、导航、页脚、打印隐藏类 */
    .no-print, .btn, .navbar, footer, .print-hide { display: none !important; }
    .card { border: none !important; box-shadow: none !important; }
    body { 
        padding: 0; 
        margin: 0; 
        font-size: 11pt;
    }

    /* 页面边距 */
    @page {
        size: A4;
        margin: 0.8cm;
    }

    /* 标题 */
    h2 {
        font-size: 14pt;
        display: block !important;
        margin: 0 0 10px 0;
    }

    /* 表格边框 */
    .table-bordered td, .table-bordered th { border: 1px solid #000 !important; }

    /* 表头两列布局 */
    #headerInfo .row > .col-md-6 {
        width: 50% !important;
        float: left !important;
        box-sizing: border-box;
        padding: 0 4px;
        margin-bottom: 4px;
        font-size: 10pt;
    }
    #headerInfo .row::after {
        content: "";
        display: table;
        clear: both;
    }
    #headerInfo strong {
        font-weight: 600;
    }

    /* 表格整体 */
    .table-responsive {
        overflow-x: visible !important;
        white-space: normal !important;
    }
    .table {
        width: 100% !important;
        table-layout: fixed;
        font-size: 10pt;
        border-collapse: collapse;
    }

    /* 列宽分配（仅可见的四列） */
    .table td:nth-child(1), .table th:nth-child(1) { width: 5%; }
    .table td:nth-child(2), .table th:nth-child(2) { width: 45%; }
    .table td:nth-child(3), .table th:nth-child(3) { width: 25%; }
    .table td:nth-child(4), .table th:nth-child(4) { width: 25%; }

    .table td, .table th {
        padding: 4px 5px;
        word-break: break-word;
        vertical-align: middle;
    }

    /* 签名图片 */
    .table td img {
        max-width: 100%;
        max-height: 65px;
        height: auto;
        object-fit: contain;
    }
</style>

{% endblock %}

{% block extra_js %}
<script>
    const trainingId = {{ request.view_args.get('training_id') }};

    // 签到签字详情
    async function loadDetail() {
        const urlParams = new URLSearchParams(window.location.search);
        let country = urlParams.get('country');
        // 过滤无效值（null、'null'、'undefined' 等均视为没有筛选）
        if (!country || country === 'null' || country === 'undefined') {
            country = '';
        }
    
        // ✅ 验证选择的 country 是否在权限范围内
        if (country && allowedCountries !== null && !allowedCountries.includes(country)) {
            alert('您没有权限查看该国家的签到记录');
            // 清空 URL 参数
            const newUrl = window.location.pathname;
            window.history.replaceState({}, '', newUrl);
            country = '';
        }
        
        let apiUrl = `/api/training/attendance/${trainingId}`;
        if (country) {
            apiUrl += `?country=${encodeURIComponent(country)}`;
        }
        const res = await fetch(apiUrl);
        const data = await res.json();

        if (!data.training) {
            document.getElementById('attendanceTbody').innerHTML = `<tr><td colspan="5">${t('t_no_training_exist')}</td></tr>`;
            return;
        }

        // ✅ 动态设置标题为培训名称
        const titleElement = document.getElementById('attendanceTitle');
        if (titleElement && data.training.name) {
            titleElement.innerHTML = `<i class="bi bi-people-fill"></i> 签到表Attendance Record - ${escapeHtml(data.training.name)}`;
        }

        // 使用后端返回的 header_template（已考虑国家模板）
        const header = data.header_template || {};

        // 渲染表头 HTML
        const headerHtml = `
            <div class="row">
                <div class="col-md-6"><strong>培训课程名称（双语）Training Course Name：</strong> ${escapeHtml(header.course_name || '')}</div>
                <div class="col-md-6"><strong>项目编号Training Project NO.：</strong> ${escapeHtml(header.project_no || '')}</div>
                <div class="col-md-6"><strong>培训地点（双语）Training Venue：</strong> ${escapeHtml(header.venue || '')}</div>
                <div class="col-md-6"><strong>培训语言Language：</strong> ${escapeHtml(header.language || '')}</div>
                <div class="col-md-6"><strong>培训对象（双语）Target Trainees：</strong> ${escapeHtml(header.target || '')}</div>
                <div class="col-md-6"><strong>组织部门（双语）Training Organizing Dept：</strong> ${escapeHtml(header.dept || '')}</div>
                <div class="col-md-6"><strong>组织者Training Organizer：</strong> ${escapeHtml(header.organizer || '')}</div>
                <div class="col-md-6"><strong>培训日期Training Date：</strong> ${escapeHtml(header.training_date || '')}</div>
                <div class="col-md-6"><strong>主讲人Course Lecturer：</strong> ${escapeHtml(header.lecturer || '')}</div>
                <div class="col-md-6"><strong>翻译员Translator：</strong> ${escapeHtml(header.translator || '')}</div>
            </div>
            <hr>
        `;
        document.getElementById('headerInfo').innerHTML = headerHtml;

        // 渲染签到记录
        const tbody = document.getElementById('attendanceTbody');
        const records = data.attendances || [];
        if (records.length === 0) {
            tbody.innerHTML = `<td><td colspan="7">${t('t_no_sign_in_record_available')}</td></tr>`;
            return;
        }
        tbody.innerHTML = '';
        records.forEach((r, idx) => {
            const nameDisplay = r.signed_name || r.name_cn || r.name_en || '';
            const empId = r.employee_id ? ` (${r.employee_id})` : '';
            // 签名单元格：有签名显示图片，无签名显示提示文字
            const signatureCell = r.signature_url
                ? `<img src="${r.signature_url}" style="max-height:70px; max-width:150px;" onerror="this.style.display='none'">`
                : `<span class="text-warning fw-bold">${t('t_pending_re_signature')}</span>`;

            const row = tbody.insertRow();
            row.innerHTML = `
                <td class="no-print"><input type="checkbox" class="attendance-checkbox" data-att-id="${r.id}"></td>
                <td>${idx+1}</td>
                <td>${escapeHtml(r.company || '')}</td>
                <td>${escapeHtml(nameDisplay)}${empId}</td>
                <td>${signatureCell}</td>
                <td class="print-hide">${new Date(r.sign_time).toLocaleString()}</td>
                <td class="country-cell no-print" title="${escapeHtml(r.country )}">${escapeHtml(r.country )}</td>
                <td class="print-hide">
                    <button class="btn btn-sm btn-outline-warning reset-sign-btn" data-id="${r.id}">
                        <i class="bi bi-pencil-square"></i> ${t('t_re_signature')}
                    </button>
                    <button class="btn btn-sm btn-outline-danger delete-attendance-btn" data-id="${r.id}" data-name="${escapeHtml(nameDisplay)}">
                        <i class="bi bi-trash"></i> ${t('t_delete')}
                    </button>
                </td>
            `;
        });
    
        // 绑定删除按钮事件
        document.querySelectorAll('.delete-attendance-btn').forEach(btn => {
            btn.addEventListener('click', async (e) => {
                e.stopPropagation();
                const attId = btn.dataset.id;
                const name = btn.dataset.name;
                if (confirm(t('t_confirm_delete_attendance').replace('{name}', name))) {
                    await deleteSingleAttendance(attId);
                }
            });
        });
        
        // 绑定重置签名按钮事件
        document.querySelectorAll('.reset-sign-btn').forEach(btn => {
            btn.addEventListener('click', async (e) => {
                const attId = e.currentTarget.dataset.id;
                if (!confirm(t('t_re_sign_prompt'))) return;
                const res = await fetch(`/api/admin/training/attendance/${attId}/reset-signature`, { method: 'POST' });
                const json = await res.json();
                if (json.success) {
                    alert(t('t_re_sign_pushed_prompt'));
                    // 刷新页面或更新当前行签名显示
                    loadDetail();
                } else {
                    alert(t('t_operation_failure') + (json.message || t('t_unknown_error')));
                }
            });
        });

        // 绑定专用PDF导出按钮
        const pdfBtn = document.getElementById('pdfExportBtn');
        if (pdfBtn) {
            const countryParam = country ? `?country=${encodeURIComponent(country)}` : '';
            pdfBtn.href = `/admin/training/${trainingId}/attendance/pdf${countryParam}`;
        }
        // 添加批量删除按钮
        addBatchDeleteButton();
        // 绑定全选按钮
        bindSelectAll();
    }

    // 全选功能
    function bindSelectAll() {
        const selectAll = document.getElementById('selectAll');
        if (selectAll) {
            selectAll.addEventListener('change', (e) => {
                document.querySelectorAll('.attendance-checkbox').forEach(cb => cb.checked = e.target.checked);
            });
        }
    }

    // 批量删除签到记录
    async function batchDeleteAttendances() {
        const selectedIds = Array.from(document.querySelectorAll('.attendance-checkbox:checked'))
            .map(cb => cb.dataset.attId);
        
        if (selectedIds.length === 0) {
            alert(t('t_at_least_one_select'));
            return;
        }
        
        if (typeof window.showDeleteConfirm === 'function') {
            window.showDeleteConfirm({
                message: `确定要删除选中的 ${selectedIds.length} 条签到记录吗？`,
                ids: selectedIds,
                type: 'soft',
                onConfirm: async (deleteType, ids) => {
                    const response = await fetch('/api/admin/training/attendance/batch_delete', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ ids: ids, delete_type: deleteType })
                    });
                    const data = await response.json();
                    if (data.success) {
                        alert(`删除成功: ${data.success_count} 条`);
                        loadDetail(); // 刷新列表
                    } else {
                        alert('删除失败: ' + (data.message || ''));
                    }
                }
            });
        } else {
            if (confirm(`确定要删除选中的 ${selectedIds.length} 条签到记录吗？`)) {
                const response = await fetch('/api/admin/training/attendance/batch_delete', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ids: selectedIds, delete_type: 'soft' })
                });
                const data = await response.json();
                if (data.success) {
                    alert(`删除成功: ${data.success_count} 条`);
                    loadDetail();
                }
            }
        }
    }

    // 单个删除签到记录
    async function deleteSingleAttendance(attendanceId, userName) {
        if (typeof window.showDeleteConfirm === 'function') {
            window.showDeleteConfirm({
                message: `确定要删除 ${userName} 的签到记录吗？`,
                ids: [attendanceId],
                type: 'soft',
                onConfirm: async (deleteType, ids) => {
                    const response = await fetch('/api/admin/training/attendance/batch_delete', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ ids: ids, delete_type: deleteType })
                    });
                    const data = await response.json();
                    if (data.success) {
                        alert('删除成功');
                        loadDetail();
                    } else {
                        alert('删除失败');
                    }
                }
            });
        } else {
            if (confirm(`确定要删除 ${userName} 的签到记录吗？`)) {
                const response = await fetch(`/api/admin/training/attendance/${attendanceId}`, {
                    method: 'DELETE'
                });
                const data = await response.json();
                if (data.success) {
                    alert('删除成功');
                    loadDetail();
                }
            }
        }
    }

    // 添加批量删除按钮
    function addBatchDeleteButton() {
        const headerDiv = document.querySelector('.d-flex.justify-content-end.gap-2');
        if (headerDiv && !document.getElementById('batchDeleteBtn')) {
            const batchDeleteBtn = document.createElement('button');
            batchDeleteBtn.id = 'batchDeleteBtn';
            batchDeleteBtn.className = 'btn btn-danger no-print';
            batchDeleteBtn.innerHTML = `<i class="bi bi-trash no-print"></i> ${t('batch_delete')}`;
            batchDeleteBtn.onclick = batchDeleteAttendances;

            // ✅ 关键修复：手动触发翻译
            if (typeof window.i18n !== 'undefined' && window.i18n.currentLang) {
                const span = batchDeleteBtn.querySelector('[data-i18n="batch_delete"]');
                if (span && typeof t === 'function') {
                    span.textContent = t('batch_delete');
                }
            }
            // 插入到打印按钮后面
            const printBtn = headerDiv.querySelector('.btn-success');
            if (printBtn) {
                printBtn.after(batchDeleteBtn);
            } else {
                headerDiv.appendChild(batchDeleteBtn);
            }
        }
    }

    // 初始化
    document.addEventListener('DOMContentLoaded', async () => {
        await waitForI18n(); // 等待国际化资源加载完成
        await populateCountryFilter();  // ✅ 限制国家筛选选项
        loadDetail();
        addBatchDeleteButton();
    });

    // 更新批量删除按钮文本（语言切换时调用）
    function updateBatchDeleteButtonText() {
        const batchDeleteBtn = document.getElementById('batchDeleteBtn');
        if (batchDeleteBtn && typeof t === 'function') {
            const span = batchDeleteBtn.querySelector('[data-i18n="batch_delete"]');
            if (span) {
                span.textContent = t('batch_delete');
            }
        }
    }

    // 监听语言切换事件，重新加载数据以更新按钮文字
    // 监听语言切换事件
    window.addEventListener('app:languageChanged', () => {
        currentPage = 1;
        loadDetail();
        // ✅ 更新批量删除按钮的文本
        updateBatchDeleteButtonText();
        // 更新 PDF 导出按钮文本（如果有需要）
        const pdfExportBtn = document.getElementById('pdfExportBtn');
        if (pdfExportBtn && typeof t === 'function') {
            const span = pdfExportBtn.querySelector('[data-i18n="expert_pdf"]');
            if (span) span.textContent = t('expert_pdf');
        }
    });

    function escapeHtml(str) {
        if(!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if(m === '&') return '&amp;';
            if(m === '<') return '&lt;';
            if(m === '>') return '&gt;';
            return m;
        });
    }

    loadDetail();
</script>
{% endblock %}
