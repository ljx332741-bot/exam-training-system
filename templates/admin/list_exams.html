<!-- templates/admin/list_exams.html -->
{% extends "base.html" %}
{% block title %}{{ _('exam_statistics') }}{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="bi bi-bar-chart-steps"></i> <span data-i18n="exam_statistics">考试统计</span></h2>
        <button class="btn btn-sm btn-outline-secondary" onclick="history.back();">✖ <span data-i18n="close">关闭返回</span></button>
    </div>

    <!-- 过滤栏 -->
    <div class="card mb-3">
        <div class="card-body">
            <div class="row g-3">
                <div class="col-md-2">
                    <input type="text" id="filterName" class="form-control" placeholder="考试名称">
                </div>
                <div class="col-md-2">
                    <select id="filterStatus" class="form-select">
                        <option value="">全部状态</option>
                        <option value="draft">草稿</option>
                        <option value="created">未开始</option>
                        <option value="active">进行中</option>
                        <option value="closed">已关闭</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <input type="text" id="filterQuarter" class="form-control" list="quarterDatalist" placeholder="季度 (如2025Q1)">
                    <datalist id="quarterDatalist"></datalist>
                </div>
                <div class="col-md-2">
                    <input type="text" id="filterCountry" class="form-control" list="countryDatalist" placeholder="输入或选择国家" autocomplete="off">
                    <datalist id="countryDatalist"></datalist>
                </div>
                <div class="col-md-2">
                    <button id="searchBtn" class="btn btn-primary">搜索</button>
                </div>
                <div class="col-md-2">
                    <div class="form-check">
                        <input type="checkbox" id="includeDeletedCheckbox" class="form-check-input">
                        <label class="form-check-label" for="includeDeletedCheckbox">显示已删除考试</label>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 考试列表表格 -->
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0" style="min-width: 1000px;" id="examsTable">
                    <style>
                        .table-responsive { overflow-x: auto; white-space: nowrap; }
                        .table td, .table th { vertical-align: middle; }
                        .time-range { min-width: 280px; }
                        .btn-group-sm .btn { white-space: nowrap; }
                    </style>
                    <thead class="table-light">
                        <tr>
                            <th>序号</th>
                            <th>国家</th>
                            <th>考试名称</th>
                            <th>状态</th>
                            <th>考试有效期</th>
                            <th>题目数量</th>
                            <th>时长(分)</th>
                            <th>人数(应考/实考)</th>
                            <th>最高分</th>
                            <th>最低分</th>
                            <th>复考人数</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="examsTbody">
                        <tr><td colspan="13" class="text-center">加载中...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="card-footer d-flex justify-content-between align-items-center">
            <div>共 <span id="totalCount">0</span> 条记录</div>
            <nav><ul class="pagination mb-0" id="pagination"></ul></nav>
        </div>
    </div>
</div>

<!-- 推送 / 设置模态框（复用 admin/dashboard.html 的 settingModal） -->
<div class="modal fade" id="settingModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">考试设置</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="row">
          <div class="col-md-6">
            <label class="form-label" for="settingStartTime">开始时间</label>
            <input type="datetime-local" id="settingStartTime" class="form-control">
          </div>
          <div class="col-md-6">
            <label class="form-label" for="settingEndTime">结束时间</label>
            <input type="datetime-local" id="settingEndTime" class="form-control">
          </div>
        </div>
        <div class="row mt-3">
          <div class="col-md-6">
            <label class="form-label" for="settingDuration">时长（分钟）</label>
            <input type="number" id="settingDuration" class="form-control" min="1">
          </div>
        </div>
        <div class="mt-3">
          <label class="form-label" for="userSearch">选择考生（可多选）</label>
          <div class="row">
            <div class="col-md-5">
                <input type="text" id="userSearch" class="form-control" placeholder="搜索姓名/邮箱">
            </div>
            <div class="col-md-4">
              <input type="text" id="countryInput" class="form-control" list="countryDatalist" placeholder="输入或选择国家" autocomplete="off">
            </div>
            <div class="col-md-3">
              <button id="loadUsersBtn" class="btn btn-secondary">刷新列表</button>
            </div>
          </div>
          <div class="mt-2" style="max-height:300px; overflow-y:auto; border:1px solid #ddd;">
            <table class="table table-sm mb-0">
              <thead><tr><th><input type="checkbox" id="selectAllUsers"></th><th>姓名</th><th>邮箱</th><th>国家</th></tr></thead>
              <tbody id="userListBody"></tbody>
            </table>
          </div>
        </div>
      </div>
      <div class="modal-footer">               
        <button class="btn btn-success" id="confirmSettingBtn">保存并推送通知</button>
        <button class="btn btn-primary" id="saveSettingBtn">保存设置</button>
        <button class="btn btn-secondary" data-bs-dismiss="modal">取消</button> 
      </div>
    </div>
  </div>
</div>

<script>
    let currentPage = 1;
    let filters = { name: '', status: '', quarter: '', country: '' };

    async function loadExams() {
        const params = new URLSearchParams({
            page: currentPage,
            per_page: 20,
            name: filters.name,
            status: filters.status,
            quarter: filters.quarter,
            country: filters.country,
            include_deleted: document.getElementById('includeDeletedCheckbox').checked ? 'true' : 'false'
        });
        const res = await fetch(`/api/admin/exams/list?${params}`);
        const data = await res.json();
        renderExamsTable(data.data);
        document.getElementById('totalCount').innerText = data.total;
        renderPagination(data.page, Math.ceil(data.total / data.per_page));
    }

    function renderExamsTable(exams) {
        const tbody = document.getElementById('examsTbody');
        if (!exams.length) {
            tbody.innerHTML = '<tr><td colspan="13" class="text-center">暂无数据</td></tr>';
            return;
        }        
        tbody.innerHTML = exams.map((ex, idx) => {
            const isDeleted = ex.deleted_at !== null && ex.deleted_at !== undefined;
            // 根据状态决定是否显示详情，推送，导出按钮
            const showDetail = ['active', 'closed'].includes(ex.status);
            const showPush = ['draft', 'created', 'active'].includes(ex.status);
            const showExport = ['active', 'closed'].includes(ex.status);
            let actionButtons = '';
            if (isDeleted) {
                actionButtons = `<button class="btn btn-sm btn-outline-success restore-exam-btn" data-id="${ex.id}">恢复</button>`;
            } else {
                actionButtons = `
                    ${showDetail ? `<button class="btn btn-sm btn-outline-info detail-btn" data-id="${ex.id}">详情</button>` : ''}
                    ${showPush ? `<button class="btn btn-sm btn-outline-primary push-btn" data-id="${ex.id}">推送</button>` : ''}
                    <button class="btn btn-sm btn-outline-info copy-exam-btn" data-id="${ex.id}">拷贝</button>
                    ${showExport ? `<button class="btn btn-sm btn-outline-secondary batch-export" data-id="${ex.id}">批量导出PDF</button>` : ''}
                `;
            }
            return `
            <tr>
                <td>${(currentPage-1)*20 + idx + 1}</td>
                <td>${ex.country || '-'}</td>
                <td><a href="#" class="exam-detail-link" data-id="${ex.id}">${escapeHtml(ex.title)}</a></td>
                <td>${getStatusText(ex.status)}</td>
                <td>${formatDate(ex.start_time)} 至 ${formatDate(ex.end_time)}</td>
                <td>${ex.question_count}</td>
                <td>${ex.duration}</td>
                <td>${ex.assigned_count}/${ex.submitted_count}</td>
                <td>${ex.max_score ?? '-'}</td>
                <td>${ex.min_score ?? '-'}</td>
                <td>${ex.retake_count}</td>
                <td>${actionButtons}</td>
            </tr>
            `;
        }).join('');
        // 绑定事件
        document.querySelectorAll('.detail-btn').forEach(btn => {
            btn.addEventListener('click', () => location.href = `/admin/exam/${btn.dataset.id}/scores`);
        });
        document.querySelectorAll('.push-btn').forEach(btn => {
            btn.addEventListener('click', () => openSettingModal(btn.dataset.id));
        });
        document.querySelectorAll('.copy-exam-btn').forEach(btn => {
            btn.addEventListener('click', () => copyExam(btn.dataset.id));
        });
        document.querySelectorAll('.batch-export').forEach(btn => {
            btn.addEventListener('click', () => batchExport(btn.dataset.id));
        });
        document.querySelectorAll('.restore-exam-btn').forEach(btn => {
            btn.addEventListener('click', async () => {
                const examId = btn.dataset.id;
                await fetch(`/admin/exam/restore/${examId}`, { method: 'POST' });
                alert('考试已恢复');
                loadExams();
            });
        });
        document.querySelectorAll('.exam-detail-link').forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                const examId = link.dataset.id;
                if (examId) window.location.href = `/admin/exam/${examId}/scores`;
            });
        });
    }

    function getStatusText(status) {
        const map = { 'draft': '草稿', 'created': '未开始', 'active': '进行中', 'closed': '已关闭', 'deleted': '已删除'};
        return map[status] || status;
    }

    function formatDate(iso) {
        if (!iso) return '-';
        return new Date(iso).toLocaleString();
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    function renderPagination(current, totalPages) {
        const pagination = document.getElementById('pagination');
        if (totalPages <= 1) { pagination.innerHTML = ''; return; }
        let html = '';
        for (let i = 1; i <= totalPages; i++) {
            html += `<li class="page-item ${i === current ? 'active' : ''}"><a class="page-link" href="#" data-page="${i}">${i}</a></li>`;
        }
        pagination.innerHTML = html;
        pagination.querySelectorAll('.page-link').forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                currentPage = parseInt(link.dataset.page);
                loadExams();
            });
        });
    }

    document.getElementById('searchBtn').addEventListener('click', () => {
        filters.name = document.getElementById('filterName').value;
        filters.status = document.getElementById('filterStatus').value;
        filters.quarter = document.getElementById('filterQuarter').value;
        filters.country = document.getElementById('filterCountry').value;
        currentPage = 1;
        loadExams();
    });

    // 全局变量
    let currentExamIdForSetting = null;

    // 复用 admin/dashboard.html 的设置模态框功能
    async function openSettingModal(examId) {
        currentExamIdForSetting = examId;
        try {
            const res = await fetch(`/api/admin/exam/${examId}`);
            if (res.ok) {
                const data = await res.json();
                document.getElementById('settingStartTime').value = data.start_time ? data.start_time.slice(0,16) : '';
                document.getElementById('settingEndTime').value = data.end_time ? data.end_time.slice(0,16) : '';
                document.getElementById('settingDuration').value = data.duration || 60;
            } else {
                document.getElementById('settingStartTime').value = '';
                document.getElementById('settingEndTime').value = '';
                document.getElementById('settingDuration').value = 60;
            }
        } catch(e) {
            console.error("加载考试信息失败", e);
        }
        await loadUserListForSetting();
        new bootstrap.Modal(document.getElementById('settingModal')).show();
    }

    async function loadUserListForSetting() {
        const search = document.getElementById('userSearch').value;
        const country = document.getElementById('countryInput').value;
        const examId = currentExamIdForSetting;
        let assignedUsers = [];
        if (examId) {
            const assignRes = await fetch(`/api/admin/exam/${examId}/assignments`);
            if (assignRes.ok) {
                const assignData = await assignRes.json();
                assignedUsers = assignData.user_ids || [];
            }
        }
        const res = await fetch(`/api/admin/users?search=${encodeURIComponent(search)}&country=${country}&page=1&per_page=100`);
        const data = await res.json();
        const tbody = document.getElementById('userListBody');
        tbody.innerHTML = data.data.map(u => `
            <tr>
                <td><input type="checkbox" class="user-checkbox" value="${u.id}" ${assignedUsers.includes(u.id) ? 'checked' : ''}></td>
                <td>${u.name_cn || u.name_en || '-'}</td>
                <td>${u.email}</td>
                <td>${u.country || '-'}</td>
            </tr>
        `).join('');
        document.getElementById('selectAllUsers').onclick = (e) => {
            document.querySelectorAll('.user-checkbox').forEach(cb => cb.checked = e.target.checked);
        };
    }

    document.getElementById('loadUsersBtn')?.addEventListener('click', async () => {
        await loadUserListForSetting();
    });

    // 保存设置（不推送）
    document.getElementById('saveSettingBtn')?.addEventListener('click', async () => {
        const examId = currentExamIdForSetting;
        const startTime = document.getElementById('settingStartTime').value;
        const endTime = document.getElementById('settingEndTime').value;
        const duration = parseInt(document.getElementById('settingDuration').value);
        if (!duration || duration <= 0) {
            alert('请输入有效时长');
            return;
        }
        const updateRes = await fetch(`/api/admin/exam/${examId}/update`, {
            method: 'PUT',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ start_time: startTime || null, end_time: endTime || null, duration: duration })
        });
        if (updateRes.ok) {
            alert('设置已保存');
            bootstrap.Modal.getInstance(document.getElementById('settingModal')).hide();
            loadExams();
        } else {
            alert('保存失败');
        }
    });

    // 保存并推送
    document.getElementById('confirmSettingBtn')?.addEventListener('click', async () => {
        const examId = currentExamIdForSetting;
        const startTime = document.getElementById('settingStartTime').value;
        const endTime = document.getElementById('settingEndTime').value;
        const duration = parseInt(document.getElementById('settingDuration').value);
        const userIds = Array.from(document.querySelectorAll('.user-checkbox:checked')).map(cb => cb.value);
        if (!duration || duration <= 0) {
            alert('请输入有效时长');
            return;
        }
        if (userIds.length === 0) {
            alert('请至少选择一个考生');
            return;
        }
        const pushRes = await fetch(`/api/admin/exam/${examId}/push_with_settings`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                start_time: startTime || null,
                end_time: endTime || null,
                duration: duration,
                user_ids: userIds
            })
        });
        if (pushRes.ok) {
            alert('设置已保存并已推送邮件通知');
            bootstrap.Modal.getInstance(document.getElementById('settingModal')).hide();
            loadExams();
        } else {
            alert('操作失败');
        }
    });

    // 拷贝考试
    async function copyExam(examId) {
        const newTitle = prompt("请输入新考试名称", examId + "_copy");
        if (!newTitle) return;
        window.location.href = `/admin/exam/copy_preview/${examId}?new_title=${encodeURIComponent(newTitle)}`;
    }

    // 加载季度选项
    async function loadQuarterOptions() {
        const res = await fetch('/api/common/quarters');
        const quarters = await res.json();
        const datalist = document.getElementById('quarterDatalist');
        if (datalist) {
            datalist.innerHTML = '';
            quarters.forEach(q => {
                const option = document.createElement('option');
                option.value = q;
                datalist.appendChild(option);
            });
        }
    }

    function setupQuarterInput() {
        const input = document.getElementById('filterQuarter');
        if (!input) return;
        input.addEventListener('blur', function() {
            let val = this.value.trim().toUpperCase();
            const match = val.match(/^(\d{2})(Q[1-4])$/);
            if (match) {
                const yearPrefix = parseInt(match[1]);
                const fullYear = (yearPrefix < 30 ? 2000 : 1900) + yearPrefix;
                this.value = `${fullYear}${match[2]}`;
            }
        });
    }

    // 批量导出 PDF
    async function batchExport(examId) {
        if (!confirm("确定导出该考试下所有考生的试卷吗？")) return;
        const res = await fetch(`/api/admin/exam/${examId}/scores?per_page=1000`);
        const data = await res.json();
        const userIds = data.data.map(item => item.user_id);
        if (userIds.length === 0) {
            alert("该考试暂无考生");
            return;
        }
        const response = await fetch(`/api/admin/exam/${examId}/batch_export`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ user_ids: userIds })
        });
        if (response.ok) {
            const blob = await response.blob();
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `exam_${examId}_all_scores.zip`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        } else {
            alert("批量导出失败");
        }
    }

    // 页面初始化
    document.addEventListener('DOMContentLoaded', async () => {
        loadQuarterOptions();
        setupQuarterInput();
        await populateCountryDatalist('countryDatalist');
        loadExams();
    });
</script>
{% endblock %}
