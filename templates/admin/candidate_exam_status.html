<!-- templates/admin/candidate_exam_status.html -->
{% extends "base.html" %}
{% block title %}考生考试状态{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>
            <i class="bi bi-people me-2"></i>
            <span data-i18n="candidate_exam_status">考生考试状态</span>
            - <span id="examTitle">{{ exam_title }}</span>
        </h2>
        <button class="btn btn-outline-secondary" id="closePageBtn">
            <i class="bi bi-x-lg me-1"></i> <span data-i18n="close">关闭</span>
        </button>
    </div>

    <!-- 筛选栏 -->
    <div class="card mb-3">
        <div class="card-body">
            <div class="row g-2 align-items-end">
                <div class="col-md-2">
                    <input type="text" id="statusFilterName" class="form-control form-control-sm" 
                        placeholder="姓名/邮箱" data-i18n-placeholder="placeholder_mail_name">
                </div>
                <div class="col-md-2">
                    <input type="text" id="statusFilterWh" class="form-control form-control-sm" list="whDatalist" 
                        data-i18n-placeholder="placeholder_fuzzy_match_whidname" placeholder="库房编码/名称">
                    <datalist id="whDatalist"></datalist>
                </div>
                <div class="col-md-1">
                    <select id="statusFilterIsPartner" class="form-select form-select-sm">
                        <option value="" data-i18n="supplier_all">服务商(全部)</option>
                        <option value="Y" data-i18n="partner_yes">是</option>
                        <option value="N" data-i18n="partner_no">否</option>
                    </select>
                </div>
                <div class="col-md-1">
                    <input type="text" id="statusFilterCountry" class="form-control form-control-sm" list="countryDatalist" 
                        placeholder="国家" data-i18n-placeholder="placeholder_country">
                    <datalist id="countryDatalist"></datalist>
                </div>
                <div class="col-md-2">
                    <button id="resetFiltersBtn" class="btn btn-sm btn-secondary w-100">
                        <span data-i18n="reset">重置</span>
                    </button>
                </div>
                <div class="col-md-4">
                    <div class="d-flex gap-2 justify-content-end align-items-center">
                        <span id="selectedCountBadge" class="badge bg-primary batch-count-badge" style="display: none;">
                            <span data-i18n="selected">已选</span> <span id="selectedCount">0</span>
                        </span>
                        <button type="button" id="batchAssignBtn" class="btn btn-success btn-sm">
                            <i class="bi bi-plus-circle"></i> <span data-i18n="batch_assign">批量分配</span>
                        </button>
                        <button type="button" id="batchDeleteAssignBtn" class="btn btn-danger btn-sm"
                            data-i18n-title="title_batch_remove_exam_assign"
                            title="批量移除考试分配">
                            <i class="bi bi-trash"></i> <span data-i18n="batch_unassign">批量移除</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 考生状态表格 -->
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0" style="min-width: 1200px;">
                    <thead class="table-light">
                        <tr>
                            <th><input type="checkbox" id="selectAll"></th>
                            <th data-i18n="candidate">考生</th>
                            <th data-i18n="email">邮箱</th>
                            <th data-i18n="t_wh_id">库房编码</th>
                            <th data-i18n="t_is_partner">服务商</th>
                            <th data-i18n="t_country">国家</th>
                            <th data-i18n="status">状态</th>
                            <th data-i18n="candidate_score">得分</th>
                            <th data-i18n="submitted_at">提交时间</th>
                            <th data-i18n="actions">操作</th>
                        </tr>
                    </thead>
                    <tbody id="statusTableBody">
                        <tr><td colspan="10" class="text-center"><span data-i18n="loading">加载中...</span></td></tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="card-footer d-flex justify-content-between align-items-center">
            <div><span data-i18n="total_questions">共</span> <span id="totalCount">0</span> <span data-i18n="record">条记录</span></div>
            <nav><ul class="pagination mb-0" id="pagination"></ul></nav>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    const examId = {{ exam_id }};
    let currentPage = 1;
    let currentExamUsers = [];
    let currentFilters = {
        name: '',
        wh_id: '',
        is_partner: '',
        country: ''
    };

    // ✅ 新增：缓存原始数据
    let cachedExamUsers = [];  // 缓存从服务器获取的原始数据
    let isLoadingData = false;  // 防止重复加载

    // ==================== Toast 提示函数 ======================
    function showToast(message, type = 'success') {
        const toastEl = document.getElementById('globalToast');
        const toastIcon = document.getElementById('toastIcon');
        const toastTitle = document.getElementById('toastTitle');
        const toastMessage = document.getElementById('toastMessage');
        
        // ✅ 检查元素是否存在，如果不存在则使用 alert 作为降级方案
        if (!toastEl || !toastIcon || !toastTitle || !toastMessage) {
            console.warn('Toast 元素不存在，使用 alert 代替');
            alert(message);
            return;
        }
        
        // 根据类型设置样式
        if (type === 'success') {
            toastIcon.className = 'bi bi-check-circle-fill me-2 text-success';
            toastTitle.textContent = t('success') || '成功';
        } else if (type === 'error') {
            toastIcon.className = 'bi bi-x-circle-fill me-2 text-danger';
            toastTitle.textContent = t('error') || '错误';
        } else if (type === 'warning') {
            toastIcon.className = 'bi bi-exclamation-triangle-fill me-2 text-warning';
            toastTitle.textContent = t('warning') || '警告';
        } else {
            toastIcon.className = 'bi bi-info-circle-fill me-2 text-info';
            toastTitle.textContent = t('info') || '提示';
        }
        
        toastMessage.textContent = message;
        
        // 创建新的 Toast 实例并显示
        const toast = new bootstrap.Toast(toastEl, {
            autohide: true,
            delay: 3000
        });
        toast.show();
    }

    // ==================== Loading 遮罩函数 ====================
    function showLoading(text = '正在处理...') {
        const loadingEl = document.getElementById('globalLoading');
        const loadingText = document.getElementById('loadingText');
        
        // ✅ 检查元素是否存在
        if (!loadingEl) {
            console.warn('Loading 元素不存在');
            return;
        }
        
        if (loadingText) loadingText.textContent = text;
        loadingEl.style.display = 'flex';
    }

    function hideLoading() {
        const loadingEl = document.getElementById('globalLoading');
        if (loadingEl) {
            loadingEl.style.display = 'none';
        }
    }

    // ==================== 更新批量选中计数 ====================
    function updateSelectedCount() {
        const selectedCheckboxes = document.querySelectorAll('.user-checkbox:checked');
        const count = selectedCheckboxes.length;
        const badge = document.getElementById('selectedCountBadge');
        const countSpan = document.getElementById('selectedCount');
        
        if (countSpan) countSpan.textContent = count;
        
        if (badge) {
            if (count > 0) {
                badge.style.display = 'inline-block';
            } else {
                badge.style.display = 'none';
            }
        }
    }

    // ==================== 批量分配 ====================
    document.getElementById('batchAssignBtn')?.addEventListener('click', async () => {
        const selectedCheckboxes = document.querySelectorAll('.user-checkbox:checked');
        const selectedUserIds = Array.from(selectedCheckboxes).map(cb => cb.value);
        
        if (selectedUserIds.length === 0) {
            showToast(t('select_at_least_one'), 'warning');
            return;
        }
        
        if (!confirm(t('confirm_assign_selected', selectedUserIds.length))) return;
        
        showLoading(t('assigning') + '...');
        
        try {
            const response = await fetch(`/api/admin/exam/${examId}/quick_assign`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_ids: selectedUserIds })
            });
            
            const result = await response.json();
            hideLoading();
            
            if (result.success) {
                apiToast(result, 'operation_success');
                // 方案二：局部更新（立即生效）
                selectedUserIds.forEach(uid => {
                    updateUserExamStatus(uid, 'pending');
                });
            } else {
                showToast(result.message || t('operation_failed'), 'error');
            }
        } catch (err) {
            hideLoading();
            console.error('分配失败:', err);
            showToast(t('operation_failed'), 'error');
        }
    });

    // ==================== 批量移除 ====================
    document.getElementById('batchDeleteAssignBtn')?.addEventListener('click', async () => {
        const selectedCheckboxes = document.querySelectorAll('.user-checkbox:checked');
        const selectedUserIds = Array.from(selectedCheckboxes).map(cb => cb.value);
        
        if (selectedUserIds.length === 0) {
            showToast(t('select_at_least_one'), 'warning');
            return;
        }
        
        if (!confirm(t('confirm_remove_selected', selectedUserIds.length))) return;
        
        showLoading(t('removing') + '...');
        
        try {
            const response = await fetch(`/api/admin/exam/${examId}/batch_remove`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_ids: selectedUserIds })
            });
            
            const result = await response.json();
            hideLoading();
            
            if (result.success) {
                apiToast(result, 'operation_success');
                // 方案二：局部更新（立即生效）
                selectedUserIds.forEach(uid => {
                    updateUserExamStatus(uid, 'not_assigned', { is_submitted: false, score: null, submitted_at: null, result_id: null });
                });
            } else {
                showToast(result.message || t('operation_failed'), 'error');
            }
        } catch (err) {
            hideLoading();
            console.error('移除失败:', err);
            showToast(t('operation_failed'), 'error');
        }
    });

    // ==================== 全选功能 ====================
    function bindSelectAll() {
        const selectAllCheckbox = document.getElementById('selectAll');
        if (!selectAllCheckbox) return;
        
        // 移除旧监听器
        const newSelectAll = selectAllCheckbox.cloneNode(true);
        selectAllCheckbox.parentNode.replaceChild(newSelectAll, selectAllCheckbox);
        
        newSelectAll.addEventListener('change', (e) => {
            const isChecked = e.target.checked;
            document.querySelectorAll('.user-checkbox').forEach(cb => {
                cb.checked = isChecked;
            });
            updateSelectedCount();
        });
    }

    // ==================== 绑定筛选事件 ====================
    function bindFilterEvents() {
        const nameInput = document.getElementById('statusFilterName');
        const whInput = document.getElementById('statusFilterWh');
        const partnerSelect = document.getElementById('statusFilterIsPartner');
        const countryInput = document.getElementById('statusFilterCountry');
        const resetBtn = document.getElementById('resetFiltersBtn');

        const debounce = (fn, delay) => {
            let timer;
            return function(...args) {
                clearTimeout(timer);
                timer = setTimeout(() => fn.apply(this, args), delay);
            };
        };

        const applyFilters = () => {
            currentFilters.name = nameInput?.value || '';
            currentFilters.wh_id = whInput?.value || '';
            currentFilters.is_partner = partnerSelect?.value || '';
            currentFilters.country = countryInput?.value || '';
            currentPage = 1;
            applyFiltersAndRender();
        };

        const debouncedApply = debounce(applyFilters, 300);

        if (nameInput) nameInput.addEventListener('input', debouncedApply);
        if (whInput) whInput.addEventListener('input', debouncedApply);
        if (partnerSelect) partnerSelect.addEventListener('change', applyFilters);
        if (countryInput) countryInput.addEventListener('input', debouncedApply);
        
        if (resetBtn) {
            resetBtn.addEventListener('click', () => {
                if (nameInput) nameInput.value = '';
                if (whInput) whInput.value = '';
                if (partnerSelect) partnerSelect.value = '';
                if (countryInput) countryInput.value = '';
                currentFilters = { name: '', wh_id: '', is_partner: '', country: '' };
                currentPage = 1;
                applyFiltersAndRender();
            });
        }
    }

    // ==================== 加载考生状态数据 ====================
    async function loadExamStatusData(forceRefresh = false) {
        // 如果强制刷新，清空缓存
        if (forceRefresh) {
            cachedExamUsers = [];
            console.log('强制刷新，清空缓存');
        }
        
        // 如果已经有缓存数据且不强制刷新，直接使用缓存
        if (!forceRefresh && cachedExamUsers.length > 0) {
            console.log('使用缓存数据，不重新请求');
            currentExamUsers = [...cachedExamUsers];
            applyFiltersAndRender();
            return;
        }
        
        // 防止重复加载
        if (isLoadingData) return;
        isLoadingData = true;
        
        const container = document.getElementById('statusTableBody');
        if (!container) return;
        
        container.innerHTML = `<tr><td colspan="10" class="text-center"><div class="spinner-border spinner-border-sm me-2"></div>${t('loading')}<\/td><\/tr>`;

        try {
            const statusRes = await fetch(`/admin/exam_status/${examId}`);
            
            if (statusRes.status === 403) {
                container.innerHTML = `<tr><td colspan="10" class="text-center text-warning">${t('no_permission_to_view_exam')}<\/td><\/tr>`;
                isLoadingData = false;
                return;
            }
            
            if (!statusRes.ok) throw new Error(`HTTP ${statusRes.status}`);
            let statusData = await statusRes.json();

            if (!statusData.length) {
                container.innerHTML = `<tr><td colspan="10" class="text-center">${t('t_no_data')}<\/td><\/tr>`;
                isLoadingData = false;
                return;
            }

            const userIds = statusData.map(item => item.user_id).filter(id => id);
            if (userIds.length === 0) {
                container.innerHTML = `<td><td colspan="10" class="text-center">${t('t_no_data')}<\/td><\/tr>`;
                isLoadingData = false;
                return;
            }

            const usersRes = await fetch(`/api/admin/users?ids=${userIds.join(',')}&status=registered&page=1&per_page=100`);
            const usersData = await usersRes.json();
            const usersMap = {};
            (usersData.data || []).forEach(u => {
                usersMap[u.id] = u;
            });

            const merged = [];
            for (const item of statusData) {
                const userInfo = usersMap[item.user_id];
                if (!userInfo || userInfo.user_status !== 'registered') {
                    continue;
                }
                merged.push({
                    ...item,
                    wh_id: userInfo.wh_id || '',
                    wh_name_en: userInfo.wh_name_en || '',
                    is_partner: userInfo.is_partner || false,
                    country: userInfo.country || '',
                    name: userInfo.name_cn || userInfo.name_en || item.name || '',
                    email: userInfo.email || item.email || ''
                });
            }

            // 缓存原始数据
            cachedExamUsers = merged;
            currentExamUsers = [...cachedExamUsers];
            applyFiltersAndRender();
        } catch (err) {
            console.error('加载失败:', err);
            container.innerHTML = `<tr><td colspan="10" class="text-center text-danger">${t('load_failed')}<\/td><\/tr>`;
        }finally {
            isLoadingData = false;
        }
    }

    // ==================== 局部更新用户考试状态（方案二） ====================
    function updateUserExamStatus(userId, newStatus, newData = {}) {
        // 更新缓存中的数据
        const userIndex = cachedExamUsers.findIndex(u => u.user_id == userId);
        if (userIndex !== -1) {
            cachedExamUsers[userIndex].exam_status = newStatus;
            if (newData.is_submitted !== undefined) {
                cachedExamUsers[userIndex].is_submitted = newData.is_submitted;
            }
            if (newData.score !== undefined) {
                cachedExamUsers[userIndex].score = newData.score;
            }
            if (newData.submitted_at !== undefined) {
                cachedExamUsers[userIndex].submitted_at = newData.submitted_at;
            }
            if (newData.result_id !== undefined) {
                cachedExamUsers[userIndex].result_id = newData.result_id;
            }
        }
        
        // 立即重新渲染
        currentExamUsers = [...cachedExamUsers];
        applyFiltersAndRender();
        updateSelectedCount();
    }

    // ==================== 刷新UI（语言切换时调用） ====================
    function refreshUILanguage() {
        // 如果有缓存数据，只重新渲染表格，不重新请求服务器
        if (cachedExamUsers.length > 0) {
            console.log('语言切换，只刷新UI，不重新请求数据');
            applyFiltersAndRender();
        }
        
        // 重新应用所有 data-i18n 属性的翻译
        if (window.i18n && window.i18n.applyTranslations) {
            window.i18n.applyTranslations();
        }

        // 重新处理 data-i18n-title 属性
        document.querySelectorAll('[data-i18n-title]').forEach(el => {
            const key = el.getAttribute('data-i18n-title');
            if (key && window.i18n && window.i18n.t) {
                const translated = window.i18n.t(key);
                if (translated && translated !== key) {
                    el.setAttribute('title', translated);
                }
            }
        });
        
        // 刷新表格中的动态翻译内容
        refreshTableTranslations();
    }
    
    // 刷新表格中的动态翻译内容
    function refreshTableTranslations() {
        // 刷新状态徽章的文本
        document.querySelectorAll('.badge').forEach(badge => {
            const text = badge.innerText;
            // 根据当前语言重新设置文本
            if (text === '未分配' || text === 'Not Assigned') {
                badge.innerText = t('t_not_assigned');
            } else if (text === '待考试' || text === 'Pending') {
                badge.innerText = t('t_pending_exam');
            } else if (text === '进行中' || text === 'In Progress') {
                badge.innerText = t('t_in_progress');
            } else if (text === '已提交' || text === 'Submitted') {
                badge.innerText = t('t_submitted');
            } else if (text === '是' || text === 'Yes') {
                badge.innerText = t('t_yes');
            } else if (text === '否' || text === 'No') {
                badge.innerText = t('t_no');
            }
        });

        // 刷新按钮文本
        document.querySelectorAll('.reset-btn, .assign-single-btn, .remove-single-btn').forEach(btn => {
            const originalText = btn.innerText;
            if (originalText === '重置' || originalText === 'Reset') {
                btn.innerText = t('reset');
            } else if (originalText === '分配' || originalText === 'Assign') {
                btn.innerText = t('assign');
            } else if (originalText === '移除' || originalText === 'Remove') {
                btn.innerText = t('unassign');
            }
        });
    }

    // ==================== 应用筛选并渲染 ====================
    function applyFiltersAndRender() {
        let filtered = [...currentExamUsers];

        if (currentFilters.name) {
            const nameLower = currentFilters.name.toLowerCase();
            filtered = filtered.filter(u => 
                u.name.toLowerCase().includes(nameLower) || 
                u.email.toLowerCase().includes(nameLower)
            );
        }

        if (currentFilters.wh_id) {
            const whLower = currentFilters.wh_id.toLowerCase();
            filtered = filtered.filter(u => 
                (u.wh_id && u.wh_id.toLowerCase().includes(whLower)) ||
                (u.wh_name_en && u.wh_name_en.toLowerCase().includes(whLower))
            );
        }

        if (currentFilters.is_partner) {
            const isPartnerBool = currentFilters.is_partner === 'Y';
            filtered = filtered.filter(u => u.is_partner === isPartnerBool);
        }

        if (currentFilters.country) {
            const countryLower = currentFilters.country.toLowerCase();
            filtered = filtered.filter(u => u.country && u.country.toLowerCase().includes(countryLower));
        }

        renderTable(filtered);
    }

    // ==================== 渲染表格 ====================
    function renderTable(users) {
        const tbody = document.getElementById('statusTableBody');
        if (!tbody) return;
        
        if (!users.length) {
            tbody.innerHTML = `<tr><td colspan="10" class="text-center">${t('t_no_matching_find')}<\/td><\/tr>`;
            const totalCountSpan = document.getElementById('totalCount');
            if (totalCountSpan) totalCountSpan.innerText = '0';
            updateSelectedCount();
            return;
        }

        const total = users.length;
        const perPage = 20;
        const totalPages = Math.ceil(total / perPage);
        const start = (currentPage - 1) * perPage;
        const end = start + perPage;
        const pageUsers = users.slice(start, end);

        const totalCountSpan = document.getElementById('totalCount');
        if (totalCountSpan) totalCountSpan.innerText = total;
        renderPagination(currentPage, totalPages);

        tbody.innerHTML = pageUsers.map(u => {
            const submitted = u.is_submitted;
            const scoreDisplay = (u.score !== null && u.score !== undefined) ? u.score : '-';
            const submitTime = u.submitted_at ? u.submitted_at.slice(0, 16).replace('T', ' ') : '-';
            
            let statusBadge = '';
            switch (u.exam_status) {
                case 'not_assigned':
                    statusBadge = `<span class="badge bg-secondary">${t('t_not_assigned')}</span>`;
                    break;
                case 'pending':
                    statusBadge = `<span class="badge bg-info">${t('t_pending_exam')}</span>`;
                    break;
                case 'in_progress':
                    statusBadge = `<span class="badge bg-warning text-dark">${t('t_in_progress')}</span>`;
                    break;
                case 'submitted':
                    statusBadge = `<span class="badge bg-success">${t('t_submitted')}</span>`;
                    break;
                default:
                    statusBadge = `<span class="badge bg-secondary">-</span>`;
            }
            
            const partnerText = u.is_partner ? t('t_yes') : t('t_no');
            const detailLink = u.result_id
                ? `<a href="/admin/result/${u.result_id}" class="btn btn-sm btn-outline-info">📋 ${t('details')}</a>`
                : '';
            const pdfLink = (submitted && u.result_id)
                ? `<a href="/admin/export_pdf_by_result/${u.result_id}" class="btn btn-sm btn-outline-secondary"><i class="bi bi-file-earmark-pdf me-1"></i>PDF</a>`
                : '';
            const resetBtn = submitted
                ? `<button type="button" class="btn btn-sm btn-outline-warning reset-btn" 
                        data-exam-id="${examId}" data-user-id="${u.user_id}"
                        data-i18n-title="title_retake_exam"
                        title="点击可以让用户重新考试">
                        🔄 ${t('reset')}
                    </button>`
                : '';
            
            const assignBtn = (u.exam_status === 'not_assigned')
                ? `<button type="button" class="btn btn-sm btn-outline-success assign-single-btn" 
                        data-user-id="${u.user_id}"
                        data-user-name="${escapeHtml(u.name)}"
                        data-i18n-title="title_exam_task_assign"
                        title="考试任务分配">
                        <i class="bi bi-plus-circle"></i> ${t('assign')}
                   </button>`
                : '';
            
            const removeBtn = (u.exam_status !== 'not_assigned')
                ? `<button type="button" class="btn btn-sm btn-outline-danger remove-single-btn" 
                        data-user-id="${u.user_id}"
                        data-user-name="${escapeHtml(u.name)}"
                        data-i18n-title="title_remove_exam_assign"
                        title="移除考试分配">
                        <i class="bi bi-trash"></i> ${t('unassign')}
                   </button>`
                : '';

            return `
                <tr>
                    <td><input type="checkbox" class="user-checkbox" value="${u.user_id}" onchange="updateSelectedCount()"><\/td>
                    <td>${escapeHtml(u.name)}<\/td>
                    <td>${escapeHtml(u.email)}<\/td>
                    <td>${escapeHtml(u.wh_id || '-')}<\/td>
                    <td>${partnerText}<\/td>
                    <td>${escapeHtml(u.country || '-')}<\/td>
                    <td>${statusBadge}<\/td>
                    <td>${scoreDisplay}<\/td>
                    <td>${submitTime}<\/td>
                    <td>${detailLink}${pdfLink} ${resetBtn} ${assignBtn} ${removeBtn}<\/td>
                <\/tr>
            `;
        }).join('');

        // 绑定全选和更新计数
        bindSelectAll();
        updateSelectedCount();
    }

    // ==================== 统一事件委托处理 ====================
    document.addEventListener('click', function(e) {
        // 处理重置按钮
        const resetBtn = e.target.closest('.reset-btn');
        if (resetBtn) {
            e.preventDefault();
            e.stopPropagation();
            handleReset(e);
            return;
        }
        
        // 处理分配按钮
        const assignBtn = e.target.closest('.assign-single-btn');
        if (assignBtn) {
            e.preventDefault();
            e.stopPropagation();
            handleAssign(assignBtn);
            return;
        }
        
        // 处理移除按钮
        const removeBtn = e.target.closest('.remove-single-btn');
        if (removeBtn) {
            e.preventDefault();
            e.stopPropagation();
            handleRemove(removeBtn);
            return;
        }
    });

    // ==================== 重置按钮处理 ====================
    async function handleReset(e) {
        e.preventDefault();
        e.stopPropagation();
        const btn = e.currentTarget;
        if (!btn) return;
        if (!confirm(t('js_candidate_status_reset_tip'))) return;
        
        showLoading(t('resetting') + '...');
        
        const examIdVal = btn.dataset.examId;
        const userId = btn.dataset.userId;
        try {
            const res = await fetch(`/admin/reset_exam/${examIdVal}/${userId}`, { method: 'POST' });
            hideLoading();
            if (res.ok) {
                showToast(t('js_reset_successful'), 'success');
                // 方案二：局部更新（立即生效）
                updateUserExamStatus(userId, 'pending', { is_submitted: false, score: null, submitted_at: null, result_id: null });
                
            } else {
                showToast(t('js_reset_failed'), 'error');
            }
        } catch (err) {
            hideLoading();
            console.error(err);
            showToast(t('js_reset_failed'), 'error');
        }
    }

    // ==================== 处理分配按钮 ====================
    async function handleAssign(btn) {
        const userId = btn.dataset.userId;
        let userName = btn.dataset.userName;
        if (!confirm(t('confirm_assign_single', userName ))) return;
        
        showLoading(t('assigning') + '...');
        
        try {
            const response = await fetch(`/api/admin/exam/${examId}/quick_assign`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_ids: [userId] })
            });
            
            const result = await response.json();
            hideLoading();
            
            if (result.success) {
                apiToast(result, 'operation_success');
                updateUserExamStatus(userId, 'pending');
            } else {
                showToast(result.message || t('operation_failed'), 'error');
            }
        } catch (err) {
            hideLoading();
            console.error('分配失败:', err);
            showToast(t('operation_failed'), 'error');
        }
    }

    // ==================== 处理移除按钮 ====================
    async function handleRemove(btn) {
        const userId = btn.dataset.userId;
        if (!confirm(t('confirm_remove_single'))) return;
        
        showLoading(t('removing') + '...');
        
        try {
            const response = await fetch(`/api/admin/exam/${examId}/batch_remove`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_ids: [userId] })
            });
            
            const result = await response.json();
            hideLoading();
            
            if (result.success) {
                apiToast(result, 'operation_success');
                updateUserExamStatus(userId, 'not_assigned', { is_submitted: false, score: null, submitted_at: null, result_id: null });
                
            } else {
                showToast(result.message || t('operation_failed'), 'error');
            }
        } catch (err) {
            hideLoading();
            console.error('移除失败:', err);
            showToast(t('operation_failed'), 'error');
        }
    }

    // ==================== 分页 ====================
    function renderPagination(current, totalPages) {
        const pagination = document.getElementById('pagination');
        if (!pagination) return;
        
        if (totalPages <= 1) {
            pagination.innerHTML = '';
            return;
        }
        let html = '';
        for (let i = 1; i <= totalPages; i++) {
            html += `<li class="page-item ${i === current ? 'active' : ''}"><a class="page-link" href="javascript:void(0)" data-page="${i}">${i}</a></li>`;
        }
        pagination.innerHTML = html;
        pagination.querySelectorAll('.page-link').forEach(link => {
            link.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
                const page = parseInt(this.dataset.page);
                if (page !== currentPage) {
                    currentPage = page;
                    applyFiltersAndRender();
                }
            });
        });
    }

    // ==================== 关闭按钮 ====================
    const closePageBtn = document.getElementById('closePageBtn');
    if (closePageBtn) {
        closePageBtn.addEventListener('click', () => {
            if (window.history.length > 1) {
                window.history.back();
            } else {
                window.close();
            }
        });
    }

    // ==================== 辅助函数 ====================
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    // 等待 i18n 就绪工具函数
    function waitForI18n() {
        return new Promise((resolve) => {
            if (window.i18n && Object.keys(window.i18n.translations || {}).length > 0) {
                resolve();
                return;
            }
            const check = setInterval(() => {
                if (window.i18n && Object.keys(window.i18n.translations || {}).length > 0) {
                    clearInterval(check);
                    resolve();
                }
            }, 50);
        });
    }

    // ==================== 页面初始化 ====================
    document.addEventListener('DOMContentLoaded', async function() {
        bindFilterEvents();

        // 等待 i18n 就绪后加载列表
        await waitForI18n();
        window.i18n.applyTranslations();  // 处理静态文本

        // 现在 i18n 已经就绪，可以安全使用
        if (window.i18n) {
            window.i18n.applyTranslations();  // 处理静态文本
            
            // 处理 data-i18n-title 属性
            document.querySelectorAll('[data-i18n-title]').forEach(el => {
                const key = el.getAttribute('data-i18n-title');
                if (key && window.i18n.t) {
                    const translated = window.i18n.t(key);
                    if (translated && translated !== key) {
                        el.setAttribute('title', translated);
                    }
                }
            });
        }
        loadExamStatusData();
        
        // 语言切换时重新加载列表
        if (window.i18n && window.i18n.subscribe) {
            let isFirstCall = true;
            window.i18n.subscribe(() => {
                if (isFirstCall) {
                    isFirstCall = false;
                    return;
                }
                // 只刷新UI，不重新请求数据
                refreshUILanguage();
            });
        }
        window.addEventListener('app:languageChanged', function() {
            refreshUILanguage();
        });
    });
</script>
{% endblock %}
