<!-- templates/admin/list_inspection_details.html -->
{% extends "base.html" %}
{% block title %}访谈详情 - {{ interview.exam_title or interview.title }}{% endblock %}
{% block content %}
<div class="container-fluid">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="bi bi-chat-dots"></i> <span data-i18n="interview_detail">访谈详情</span> - <span id="examTitle">加载中...</span></h2>
    </div>

    <!-- 筛选栏 -->
    <div class="card mb-3">
        <div class="card-body">
            <div class="row g-3 align-items-end">
                <div class="col-md-5">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <input type="text" id="searchName" class="form-control" 
                            data-i18n-placeholder="placeholder_interviewee_name" placeholder="访谈人员姓名">
                        </div>
                        <div class="col-md-6">
                            <input type="text" id="filterCountry" class="form-control" list="countryDatalist" 
                            data-i18n-placeholder="placeholder_country" placeholder="国家">
                            <datalist id="countryDatalist"></datalist>
                        </div>
                    </div>
                </div>
                <div class="col-md-2">
                    <button id="searchBtn" class="btn btn-primary w-100"><span data-i18n="search">搜索</span></button>
                </div>
                <div class="col-md-5 d-flex justify-content-end">
                    <button class="btn btn-outline-secondary" onclick="history.back();">✖ <span data-i18n="close">关闭</span></button>
                </div>
            </div>
        </div>
    </div>

    <!-- 数据表格 -->
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th><span data-i18n="country">国家</span></th>
                            <th><span data-i18n="name_en">姓名</span></th>
                            <th><span data-i18n="wh_id">库房编码</span></th>
                            <th><span data-i18n="check_at">检查时间</span></th>
                            <th><span data-i18n="inspector">检查人员</span></th>
                            <th><span data-i18n="ask_qty">访谈问题数量</span></th>
                            <th><span data-i18n="answer_qty">答对问题数量</span></th>
                            <th><span data-i18n="remark">备注</span></th>
                            <th><span data-i18n="feedback_by">反馈人</span></th>
                            <th><span data-i18n="actions">操作</span></th>
                        </tr>
                    </thead>
                    <tbody id="detailsTableBody">
                        <tr><td colspan="10" class="text-center"><span data-i18n="loading">加载中...</span></td></tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="card-footer d-flex justify-content-between align-items-center">
            <div><span data-i18n="total_questions">共</span> <span id="totalCount">0</span> <span data-i18n="record">条记录</span></div>
            <nav><ul class="pagination mb-0" id="pagination"></ul></nav>
        </div>
    </div>
</div>

<!-- 答题详情模态框 -->
<div class="modal fade" id="answersModal" tabindex="-1" data-bs-backdrop="static">
    <div class="modal-dialog modal-xl modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title"><span data-i18n="details">详情</span> - <span id="answersUserName"></span></h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="answersContent">
                <!-- 动态填充 -->
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal"><span data-i18n="close">关闭</span></button>
            </div>
        </div>
    </div>
</div>

{% endblock %}

{% block extra_js %}
<script>
    const interviewId = {{ request.view_args['interview_id'] }};
    let currentPage = 1;

    async function loadDetails() {
        const search = document.getElementById('searchName').value;
        const country = document.getElementById('filterCountry').value;
        const params = new URLSearchParams({ page: currentPage, per_page: 20, search, country });
        const res = await fetch(`/api/admin/interview/${interviewId}/details?${params}`);
        const data = await res.json();
        document.getElementById('examTitle').innerText = data.interview?.exam_title || data.interview?.title || t('t_unknown_examination');
        renderTable(data.data);
        document.getElementById('totalCount').innerText = data.total;
        renderPagination(data.page, Math.ceil(data.total / data.per_page));
    }

    function renderTable(rows) {
        const tbody = document.getElementById('detailsTableBody');
        if (!rows.length) {
            tbody.innerHTML = '<tr><td colspan="10" class="text-center">暂无数据</td></tr>';
            return;
        }
        tbody.innerHTML = rows.map(r => `
            <tr>
                <td>${escapeHtml(r.country || '-')}</td>
                <td>${escapeHtml(r.name)}</td>
                <td>${escapeHtml(r.wh_id || '-')}</td>
                <td>${r.submitted_at ? new Date(r.submitted_at).toLocaleString() : '-'}</td>
                <td>${escapeHtml(r.reviewer || '-')}</td>
                <td>${r.total_questions}</td>
                <td>${r.correct_count}</td>
                <td>${escapeHtml(r.feedback || '-')}</td>
                <td>${escapeHtml(r.department || '-')}</td>
                <td>
                    <button class="btn btn-sm btn-outline-info view-answers-btn" 
                    data-user-id="${r.user_id}" 
                    data-user-name="${escapeHtml(r.name)}">${t('t_answer_detail')}</button>
                    ${r.has_submitted ? `<button class="btn btn-sm btn-outline-warning resample-btn" data-user-id="${r.user_id}">${t('t_re_interview')}</button>` : ''}
                </td>
            </tr>
        `).join('');

        // 绑定重新访谈事件
        document.querySelectorAll('.resample-btn').forEach(btn => {
            btn.addEventListener('click', async () => {
                const userId = btn.dataset.userId;
                if (confirm(t('t_regenerate_interview_question_tip'))) {
                    await fetch(`/api/admin/interview/${interviewId}/resample/${userId}`, { method: 'POST' });
                    alert(t('t_question_regenerated'));
                    loadDetails();
                }
            });
        });
    }

    // 委托事件：查看答题详情
    document.addEventListener('click', (e) => {
        const btn = e.target.closest('.view-answers-btn');
        if (!btn) return;
        const userId = btn.dataset.userId;
        const userName = btn.dataset.userName || userId;  // 用户名回退
        showUserAnswers(interviewId, userId, userName);
    });

    // 答题详情获取函数（独立定义，不依赖 btn）
    async function showUserAnswers(interviewId, userId, userName) {
        try {
            const res = await fetch(`/api/admin/interview/${interviewId}/user/${userId}/answers`);
            const data = await res.json();
            if (!data.answers || data.answers.length === 0) {
                alert(t('t_no_answer_record_available'));
                return;
            }
            document.getElementById('answersUserName').innerText = userName;
            let html = '<div class="list-group">';
            data.answers.forEach((item, index) => {
                const questionNum = index + 1;   // 从1开始的连续编号
                const statusIcon = item.is_correct ? '✅' : '❌';
                const statusColor = item.is_correct ? 'text-success' : 'text-danger';
                let optionsHtml = '';
                const typeBadge = item.question_type === 'multi' ? `<span class="badge bg-warning ms-2">${t('t_multi')}</span>` :
                                item.question_type === 'judge' ? `<span class="badge bg-info ms-2">${t('t_judge')}</span>` :
                                `<span class="badge bg-primary ms-2">${t('t_single')}</span>`;
                if (item.question_type !== 'judge' && item.options && typeof item.options === 'object') {
                    const opts = item.options;
                    const sortedKeys = Object.keys(opts).filter(k => opts[k] && opts[k].toString().trim());
                    if (sortedKeys.length) {
                        optionsHtml = '<ul>' + sortedKeys.map(k => `<li>${k}. ${opts[k]}</li>`).join('') + '</ul>';
                    }
                } else if (item.question_type === 'judge') {
                    optionsHtml = '<span>正确 True | 错误 False</span>';
                }
                html += `
                    <div class="list-group-item">
                        <div class="d-flex justify-content-between align-items-start">
                            <div>
                                <strong>${questionNum}-[${item.question_num}]. ${item.question_content} ${typeBadge}</strong>
                                ${optionsHtml}
                                <div class="mt-2">
                                    <span>${t('t_answer')}：<strong>${item.user_answer || t('t_no_answer')}</strong></span>
                                    <span class="ms-3 ${statusColor}">${statusIcon}</span>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });
            html += '</div>';
            document.getElementById('answersContent').innerHTML = html;
            new bootstrap.Modal(document.getElementById('answersModal')).show();
        } catch (e) {
            console.error(e);
            alert(t('t_load_answer_detail_failed'));
        }
    }

    // 分页、搜索等事件绑定...
    function renderPagination(current, totalPages) {
        const pagination = document.getElementById('pagination');
        if (totalPages <= 1) { pagination.innerHTML = ''; return; }
        let html = '';
        for (let i = 1; i <= totalPages; i++) {
            html += `<li class="page-item ${i === current ? 'active' : ''}"><a class="page-link" href="#" data-page="${i}">${i}</a></li>`;
        }
        pagination.innerHTML = html;
        pagination.querySelectorAll('.page-link').forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                currentPage = parseInt(link.dataset.page);
                loadDetails();
            });
        });
    }

    document.getElementById('searchBtn').addEventListener('click', () => {
        currentPage = 1;
        loadDetails();
    });

    // 初始化
    document.addEventListener('DOMContentLoaded', async () => {
        await waitForI18n(); // 等待国际化资源加载完成
        await populateCountryDatalist('countryDatalist');
        loadDetails();
    });

    // 监听语言切换事件，重新加载数据以更新按钮文字
    window.addEventListener('app:languageChanged', () => {
        currentPage = 1;   // 可选：重置到第一页
        loadDetails();      // 重新加载数据，会重新调用 renderTable 和 t()
    });

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;' })[m]);
    }
</script>
{% endblock %}
