<!-- templates/admin/list_training_status_view.html -->
{% extends "base.html" %}
{% block title %}培训签到人员状态{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="bi bi-people-fill"></i> <span data-i18n="training_attendance_status">培训签到人员状态</span></h2>
        <div>
            <button class="btn btn-success me-2" id="exportExcelBtn">
                <i class="bi bi-file-earmark-excel"></i> <span data-i18n="export_excel">导出Excel</span>
            </button>
            <button class="btn btn-outline-secondary" id="closePageBtn">
                <i class="bi bi-x-lg me-1"></i> <span data-i18n="close">关闭</span>
            </button>
        </div>
    </div>

    <!-- 筛选栏 -->
    <div class="card mb-3">
        <div class="card-body">
            <div class="row g-3 align-items-end">
                <div class="col-md-3">
                    <input type="text" id="searchInput" class="form-control" 
                           data-i18n-placeholder="placeholder_mail_name"
                           placeholder="姓名/邮箱" autocomplete="off">
                </div>
                <div class="col-md-2">
                    <input type="text" id="filterCountry" class="form-control" list="countryDatalist" 
                           data-i18n-placeholder="placeholder_country"
                           placeholder="国家" autocomplete="off">
                    <datalist id="countryDatalist"></datalist>
                    <input type="hidden" id="filterCountryCode">
                </div>
                <div class="col-md-3">
                    <input type="text" id="filterWhId" class="form-control" 
                           data-i18n-placeholder="wh_id_name"
                           placeholder="库房编码/名称" autocomplete="off">
                </div>
                <div class="col-md-2">
                    <input type="text" id="filterTrainingName" class="form-control" 
                           data-i18n-placeholder="placeholder_training_name"
                           placeholder="培训名称" autocomplete="off">
                </div>
                <div class="col-md-2 d-flex gap-2">
                    <button id="resetFiltersBtn" class="btn btn-outline-secondary w-100">
                        <i class="bi bi-arrow-repeat"></i> <span data-i18n="reset">重置</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 统计卡片 -->
    <div class="row mb-3">
        <div class="col-md-3">
            <div class="card bg-success text-white">
                <div class="card-body py-2">
                    <div class="d-flex justify-content-between align-items-center">
                        <div><i class="bi bi-check-circle-fill fs-4"></i></div>
                        <div class="text-end">
                            <h5 class="mb-0" id="signedCount">0</h5>
                            <small data-i18n="signed">已签到</small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card bg-warning text-dark">
                <div class="card-body py-2">
                    <div class="d-flex justify-content-between align-items-center">
                        <div><i class="bi bi-clock-history fs-4"></i></div>
                        <div class="text-end">
                            <h5 class="mb-0" id="pendingCount">0</h5>
                            <small data-i18n="pending_sign">待签到</small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card bg-danger text-white">
                <div class="card-body py-2">
                    <div class="d-flex justify-content-between align-items-center">
                        <div><i class="bi bi-exclamation-triangle-fill fs-4"></i></div>
                        <div class="text-end">
                            <h5 class="mb-0" id="resignCount">0</h5>
                            <small data-i18n="need_re-sign">需重新签名</small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card bg-secondary text-white">
                <div class="card-body py-2">
                    <div class="d-flex justify-content-between align-items-center">
                        <div><i class="bi bi-people fs-4"></i></div>
                        <div class="text-end">
                            <h5 class="mb-0" id="totalCount">0</h5>
                            <small data-i18n="total">总计</small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 人员列表表格 -->
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive" style="overflow-x: auto; white-space: nowrap;">
                <table class="table table-hover align-middle mb-0" style="white-space: nowrap;">
                    <thead class="table-light">
                        <tr>
                            <th><span data-i18n="sequence">序号</span></th>
                            <th><span data-i18n="training_name">培训名称</span></th>
                            <th><span data-i18n="country">国家</span></th>
                            <th><span data-i18n="name_en">姓名</span></th>
                            <th><span data-i18n="email">邮箱</span></th>
                            <th><span data-i18n="wh_id">库房编码</span></th>
                            <th><span data-i18n="wh_name_en">库房名称(EN)</span></th>
                            <th><span data-i18n="company">公司</span></th>
                            <th><span data-i18n="sign_time">签到时间</span></th>
                            <th><span data-i18n="status">签到状态</span></th>
                        </tr>
                    </thead>
                    <tbody id="usersTableBody">
                        <tr><td colspan="10" class="text-center"><span data-i18n="loading">加载中...</span></td></tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="card-footer d-flex justify-content-between align-items-center">
            <div><span data-i18n="total">共</span> <span id="totalRecordCount">0</span> <span data-i18n="record">条记录</span></div>
            <nav><ul class="pagination mb-0" id="pagination"></ul></nav>
        </div>
    </div>
</div>


<!-- 查看签到详情模态框 -->
<div class="modal fade" id="attendanceModal" tabindex="-1" data-bs-backdrop="static">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title"><i class="bi bi-calendar-check"></i> <span data-i18n="sign_in_details">签到详情</span></h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="text-center mb-3">
                    <div id="modalSignature" class="mb-2">
                        <img id="signatureImage" src="" style="max-width: 200px; max-height: 100px; display: none;">
                        <div id="noSignature" class="text-muted" style="display: none;"><span data-i18n="no_data">暂无数据</span></div>
                    </div>
                    <p><strong><span data-i18n="sign_time">签到时间</span>：</strong><span id="modalSignTime"></span></p>
                    <p><strong><span data-i18n="signature_name">签名姓名</span>：</strong><span id="modalSignedName"></span></p>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal"><span data-i18n="close">关闭</span></button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    let currentPage = 1;
    let filters = { search: '', country: '', wh_id: '', training_name: '' };
    let allData = [];
    let filteredData = [];
    const perPage = 20;

    // 加载数据
    // 加载数据（兼容两种模式：单个培训详情 or 全局视图）
    async function loadData() {
        // 优先从 URL 参数获取 training_id
        const urlParams = new URLSearchParams(window.location.search);
        const trainingId = urlParams.get('training_id');
        
        let url;
        if (trainingId) {
            // 模式1：单个培训详情（使用新 API，返回该培训的所有学员状态）
            url = `/api/admin/training/${trainingId}/users`;
        } else {
            // 模式2：全局视图（使用旧 API，返回所有权限范围内的数据）
            const params = new URLSearchParams({
                search: filters.search,
                country: filters.country,
                wh_id: filters.wh_id
            });
            url = `/api/admin/training/users_with_status?${params}`;
        }
        
        try {
            const res = await fetch(url);
            const data = await res.json();
            allData = data.data || [];
            applyFilters();
        } catch (err) {
            console.error('加载数据失败:', err);
            document.getElementById('usersTableBody').innerHTML = `<tr><td colspan="11" class="text-center text-danger">加载失败</td></tr>`;
        }
    }
    
    // 应用筛选（前端内存过滤）
    function applyFilters() {
        let filtered = [...allData];
        
        if (filters.search) {
            const searchLower = filters.search.toLowerCase();
            filtered = filtered.filter(item => 
                (item.name_en && item.name_en.toLowerCase().includes(searchLower)) ||
                (item.email && item.email.toLowerCase().includes(searchLower))
            );
        }
        
        if (filters.country) {
            filtered = filtered.filter(item => item.user_country === filters.country);
        }
        
        if (filters.wh_id) {
            const whLower = filters.wh_id.toLowerCase();
            filtered = filtered.filter(item => 
                (item.wh_id && item.wh_id.toLowerCase().includes(whLower)) ||
                (item.wh_name_en && item.wh_name_en.toLowerCase().includes(whLower))
            );
        }
        
        if (filters.training_name) {
            const nameLower = filters.training_name.toLowerCase();
            filtered = filtered.filter(item => 
                item.training_name && item.training_name.toLowerCase().includes(nameLower)
            );
        }
        
        filteredData = filtered;
        
        // 更新统计卡片
        updateStats(filteredData);
        
        // 重置分页
        currentPage = 1;
        renderTable();
        renderPagination();
    }

    // 更新统计卡片
    function updateStats(data) {
        let signed = 0;
        let pending = 0;
        let resign = 0;
        
        data.forEach(item => {
            if (item.sign_status === 'signed') signed++;
            else if (item.sign_status === 'pending') pending++;
            else if (item.sign_status === 'resign') resign++;
        });
        
        document.getElementById('signedCount').innerText = signed;
        document.getElementById('pendingCount').innerText = pending;
        document.getElementById('resignCount').innerText = resign;
        document.getElementById('totalCount').innerText = data.length;
    }

    // 渲染表格
    function renderTable() {
        const tbody = document.getElementById('usersTableBody');
        const totalCount = filteredData.length;
        document.getElementById('totalRecordCount').innerText = totalCount;
        
        if (totalCount === 0) {
            tbody.innerHTML = `<tr><td colspan="11" class="text-center">${t('t_no_data') || '暂无数据'}</td></tr>`;
            return;
        }
        
        const start = (currentPage - 1) * perPage;
        const end = start + perPage;
        const pageData = filteredData.slice(start, end);
        
        tbody.innerHTML = pageData.map((item, idx) => {
            let statusBadge = '';
            let actionHtml = '';
            
            switch (item.sign_status) {
                case 'not_assigned':
                    statusBadge = '<span class="badge bg-secondary"><i class="bi bi-dash-circle"></i> ' + (t('t_not_assigned') || '未分配') + '</span>';
                    actionHtml = `<button class="btn btn-sm btn-outline-primary assign-btn" 
                                        data-training-id="${item.training_id}" 
                                        data-user-id="${item.user_id}"
                                        data-user-name="${escapeHtml(item.name_en)}">
                                    <i class="bi bi-person-plus"></i> ${t('assign') || '分配'}
                                </button>`;
                    break;
                case 'signed':
                    statusBadge = '<span class="badge bg-success"><i class="bi bi-check-circle"></i> ' + (t('signed') || '已签到') + '</span>';
                    actionHtml = `<button class="btn btn-sm btn-outline-warning resign-btn" 
                                        data-training-id="${item.training_id}" 
                                        data-user-id="${item.user_id}"
                                        data-user-name="${escapeHtml(item.name_en)}">
                                    <i class="bi bi-arrow-repeat"></i> ${t('resign') || '重新签到'}
                                </button>`;
                    break;
                case 'pending':
                    statusBadge = '<span class="badge bg-warning text-dark"><i class="bi bi-clock"></i> ' + (t('pending_sign') || '待签到') + '</span>';
                    actionHtml = `<button class="btn btn-sm btn-outline-danger unassign-btn" 
                                        data-training-id="${item.training_id}" 
                                        data-user-id="${item.user_id}"
                                        data-user-name="${escapeHtml(item.name_en)}">
                                    <i class="bi bi-person-x"></i> ${t('unassign') || '取消分配'}
                                </button>`;
                    break;
                case 'resign':
                    statusBadge = '<span class="badge bg-danger"><i class="bi bi-exclamation-triangle"></i> ' + (t('need_re-sign') || '需重新签名') + '</span>';
                    actionHtml = `<button class="btn btn-sm btn-outline-warning resign-btn" 
                                        data-training-id="${item.training_id}" 
                                        data-user-id="${item.user_id}"
                                        data-user-name="${escapeHtml(item.name_en)}">
                                    <i class="bi bi-arrow-repeat"></i> ${t('resign') || '重新签到'}
                                </button>`;
                    break;
                default:
                    statusBadge = '<span class="badge bg-secondary">-</span>';
            }

            // 添加查看详情按钮（如果有签到记录）
            let viewDetailHtml = '';
            if (item.sign_status === 'signed' || item.sign_status === 'resign') {
                viewDetailHtml = `<button class="btn btn-sm btn-outline-info view-attendance-btn ms-2" 
                                    data-user-id="${item.user_id}" 
                                    data-signed-name="${escapeHtml(item.signed_name || '')}"
                                    data-sign-time="${item.sign_time || ''}"
                                    data-signature-url="${item.signature_url || ''}">
                                <i class="bi bi-eye"></i>
                            </button>`;
            }

            return `
                <tr>
                    <td>${start + idx + 1}</td>
                    <td class="training-name-cell"><strong>${escapeHtml(item.training_name || '-')}</strong></td>  <!-- ✅ 培训名称 -->
                    <td>${escapeHtml(item.user_country || item.country || '-')}</td>
                    <td>${escapeHtml(item.name_en || '-')} ${viewDetailHtml}</td>
                    <td>${escapeHtml(item.email || '-')}</td>
                    <td>${escapeHtml(item.wh_id || '-')}</td>
                    <td>${escapeHtml(item.wh_name_en || '-')}</td>
                    <td>${escapeHtml(item.company || '-')}</td>
                    <td>${item.sign_time ? new Date(item.sign_time).toLocaleString() : '-'}</td>
                    <td>${statusBadge}</td>
                    <td class="action-cell" style="min-width: 100px;">${actionHtml}</td>
                </tr>
            `;
        }).join('');

        // 绑定操作按钮事件
        bindActionButtons();
        bindAttendanceViewButtons();
    }

    // 绑定分配/取消分配/重新签到按钮事件
    function bindActionButtons() {
        // 分配按钮
        document.querySelectorAll('.assign-btn').forEach(btn => {
            btn.removeEventListener('click', btn._assignHandler);
            btn._assignHandler = async () => {
                const trainingId = btn.dataset.trainingId;
                const userId = btn.dataset.userId;
                const userName = btn.dataset.userName;
                
                if (!confirm(`确定要将培训分配给 ${userName} 吗？`)) return;
                
                showLoading('分配中...');
                try {
                    const res = await fetch(`/api/admin/training/${trainingId}/assign`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ user_ids: [userId] })
                    });
                    const data = await res.json();
                    hideLoading();
                    
                    if (data.success) {
                        if (typeof showToast === 'function') {
                            showToast(t('assign_success') || `已分配 ${data.assigned_count} 人`, 'success');
                        } else {
                            alert(`分配成功: ${data.assigned_count} 人`);
                        }
                        loadData();
                    } else {
                        const msg = data.message || '分配失败';
                        if (typeof showToast === 'function') {
                            showToast(msg, 'error');
                        } else {
                            alert(msg);
                        }
                    }
                } catch (err) {
                    hideLoading();
                    console.error('分配失败:', err);
                    alert('网络错误，请重试');
                }
            };
            btn.addEventListener('click', btn._assignHandler);
        });
        
        // 取消分配按钮
        document.querySelectorAll('.unassign-btn').forEach(btn => {
            btn.removeEventListener('click', btn._unassignHandler);
            btn._unassignHandler = async () => {
                const trainingId = btn.dataset.trainingId;
                const userId = btn.dataset.userId;
                const userName = btn.dataset.userName;
                
                if (!confirm(`确定要取消 ${userName} 的培训分配吗？\n取消后该学员将无法看到此培训。`)) return;
                
                showLoading('取消分配中...');
                try {
                    const res = await fetch(`/api/admin/training/${trainingId}/unassign`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ user_ids: [userId] })
                    });
                    const data = await res.json();
                    hideLoading();
                    
                    if (data.success) {
                        if (typeof showToast === 'function') {
                            showToast(t('unassign_success') || `已取消 ${data.unassigned_count} 人分配`, 'success');
                        } else {
                            alert(`取消分配成功: ${data.unassigned_count} 人`);
                        }
                        loadData();
                    } else {
                        const msg = data.message || '取消分配失败';
                        if (typeof showToast === 'function') {
                            showToast(msg, 'error');
                        } else {
                            alert(msg);
                        }
                    }
                } catch (err) {
                    hideLoading();
                    console.error('取消分配失败:', err);
                    alert('网络错误，请重试');
                }
            };
            btn.addEventListener('click', btn._unassignHandler);
        });
        
        // 重新签到按钮（管理员强制重置）
        document.querySelectorAll('.resign-btn').forEach(btn => {
            btn.removeEventListener('click', btn._resignHandler);
            btn._resignHandler = async () => {
                const trainingId = btn.dataset.trainingId;
                const userId = btn.dataset.userId;
                const userName = btn.dataset.userName;
                
                if (!confirm(`确定要重置 ${userName} 的签到状态吗？\n重置后该学员需要重新签名。`)) return;
                
                showLoading('重置中...');
                try {
                    const res = await fetch(`/api/admin/training/${trainingId}/resign/${userId}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' }
                    });
                    const data = await res.json();
                    hideLoading();
                    
                    if (data.success) {
                        if (typeof showToast === 'function') {
                            showToast(t('resign_success') || `已重置 ${userName} 的签到状态`, 'success');
                        } else {
                            alert(`重置成功: ${userName} 需要重新签到`);
                        }
                        loadData();
                    } else {
                        const msg = data.message || '重置失败';
                        if (typeof showToast === 'function') {
                            showToast(msg, 'error');
                        } else {
                            alert(msg);
                        }
                    }
                } catch (err) {
                    hideLoading();
                    console.error('重置失败:', err);
                    alert('网络错误，请重试');
                }
            };
            btn.addEventListener('click', btn._resignHandler);
        });
    }

    // 绑定查看签到详情按钮事件
    function bindAttendanceViewButtons() {
        document.querySelectorAll('.view-attendance-btn').forEach(btn => {
            btn.removeEventListener('click', btn._viewHandler);
            btn._viewHandler = () => {
                const signedName = btn.dataset.signedName;
                const signTime = btn.dataset.signTime;
                const signatureUrl = btn.dataset.signatureUrl;
                
                document.getElementById('modalSignedName').innerText = signedName || '-';
                document.getElementById('modalSignTime').innerText = signTime ? new Date(signTime).toLocaleString() : '-';
                
                const signatureImg = document.getElementById('signatureImage');
                const noSignature = document.getElementById('noSignature');
                
                if (signatureUrl && signatureUrl !== 'null' && signatureUrl !== '') {
                    signatureImg.src = signatureUrl;
                    signatureImg.style.display = 'inline-block';
                    noSignature.style.display = 'none';
                } else {
                    signatureImg.style.display = 'none';
                    noSignature.style.display = 'block';
                }
                
                new bootstrap.Modal(document.getElementById('attendanceModal')).show();
            };
            btn.addEventListener('click', btn._viewHandler);
        });
    }

    // 分页
    function renderPagination() {
        const totalCount = filteredData.length;
        const totalPages = Math.ceil(totalCount / perPage);
        const pagination = document.getElementById('pagination');
        
        if (totalPages <= 1) {
            pagination.innerHTML = '';
            return;
        }
        
        let html = '';
        for (let i = 1; i <= totalPages; i++) {
            html += `<li class="page-item ${i === currentPage ? 'active' : ''}">
                        <a class="page-link" href="#" data-page="${i}">${i}</a>
                     </li>`;
        }
        pagination.innerHTML = html;
        
        pagination.querySelectorAll('.page-link').forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                currentPage = parseInt(link.dataset.page);
                renderTable();
                renderPagination();
            });
        });
    }

    // 导出Excel
    document.getElementById('exportExcelBtn').addEventListener('click', async () => {
        try {
            const params = new URLSearchParams({
                search: filters.search,
                country: filters.country,
                wh_id: filters.wh_id
            });
            
            const response = await fetch(`/api/admin/training/export_attendance_status?${params}`);
            const blob = await response.blob();
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `培训签到状态_${new Date().toISOString().slice(0, 19)}.xlsx`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        } catch (err) {
            console.error('导出失败:', err);
            alert('导出失败');
        }
    });

    // 绑定筛选事件
    function bindFilterEvents() {
        const searchInput = document.getElementById('searchInput');
        const countryInput = document.getElementById('filterCountry');
        const whInput = document.getElementById('filterWhId');
        const trainingNameInput = document.getElementById('filterTrainingName');
        const resetBtn = document.getElementById('resetFiltersBtn');
        
        const debounce = (fn, delay) => {
            let timer;
            return function(...args) {
                clearTimeout(timer);
                timer = setTimeout(() => fn.apply(this, args), delay);
            };
        };
        
        const updateFilters = () => {
            filters.search = searchInput?.value || '';
            filters.country = document.getElementById('filterCountryCode')?.value || '';
            filters.wh_id = whInput?.value || '';
            filters.training_name = trainingNameInput?.value || '';
            currentPage = 1;
            applyFilters();
        };
        
        const debouncedUpdate = debounce(updateFilters, 300);
        
        if (searchInput) searchInput.addEventListener('input', debouncedUpdate);
        if (countryInput) countryInput.addEventListener('change', updateFilters);
        if (whInput) whInput.addEventListener('input', debouncedUpdate);
        if (trainingNameInput) trainingNameInput.addEventListener('input', debouncedUpdate);
        
        if (resetBtn) {
            resetBtn.addEventListener('click', () => {
                if (searchInput) searchInput.value = '';
                if (countryInput) countryInput.value = '';
                if (whInput) whInput.value = '';
                if (trainingNameInput) trainingNameInput.value = '';
                document.getElementById('filterCountryCode').value = '';
                filters = { search: '', country: '', wh_id: '', training_name: '' };
                currentPage = 1;
                applyFilters();
            });
        }
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[m]);
    }

    // 等待 i18n 就绪工具函数
    function waitForI18n() {
        return new Promise((resolve) => {
            if (window.i18n && Object.keys(window.i18n.translations || {}).length > 0) {
                resolve();
                return;
            }
            const check = setInterval(() => {
                if (window.i18n && Object.keys(window.i18n.translations || {}).length > 0) {
                    clearInterval(check);
                    resolve();
                }
            }, 50);
        });
    }

    // 初始化
    document.addEventListener('DOMContentLoaded', async () => {
        await setupCountryAutocomplete('filterCountry', 'countryDatalist', 'filterCountryCode');
        bindFilterEvents();
    
        // 等待 i18n 就绪后加载列表
        await waitForI18n();
        window.i18n.applyTranslations();  // 处理静态文本
        loadData();

        // 关闭按钮
        const closePageBtn = document.getElementById('closePageBtn');
        if (closePageBtn) {
            closePageBtn.addEventListener('click', () => {
                // 直接跳转到培训列表页面
                window.location.replace('/admin/trainings');
            });
        }

        // ✅ 语言切换时重新加载列表
        if (window.i18n && window.i18n.subscribe) {
            window.i18n.subscribe(() => {
                loadData();  // 重新加载列表，会触发 renderWhTable 使用新的翻译
            });
        }
    });

    window.addEventListener('app:languageChanged', function() {
        loadData();
    });
</script>
{% endblock %}
