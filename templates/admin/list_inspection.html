<!-- templates/admin/list_inspection.html -->
{% extends "base.html" %}
{% block title %}访谈管理{% endblock %}
{% block content %}
<div class="container-fluid">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="bi bi-chat-dots"></i> <span data-i18n="interview_statistics_management">访谈统计与管理</span></h2>
        <button class="btn btn-outline-secondary" onclick="history.back();">✖ <span data-i18n="close">关闭</span></button>
    </div>
    <!-- 筛选栏 -->
    <div class="card mb-3">
        <div class="card-body">
            <div class="row g-3 align-items-end">
                <!-- 输入区域 -->
                <div class="col-md-5">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <input type="text" id="filterName" class="form-control" 
                            data-i18n-placeholder="placeholder_interview_title" placeholder="访谈名称">
                        </div>
                        <div class="col-md-6">
                            <input type="text" id="filterCountry" class="form-control" list="countryDatalist" 
                            data-i18n-placeholder="placeholder_country" placeholder="国家代码/名称">
                            <datalist id="countryDatalist"></datalist>
                            <input type="hidden" id="filterCountryCode">
                        </div>
                    </div>
                </div>
                <div class="col-md-2">
                    <button id="searchBtn" class="btn btn-primary w-100"><span data-i18n="search">搜索</span></button>
                </div>
                <div class="col-md-5 d-flex justify-content-end">
                    <button class="btn btn-success me-2" id="newInterviewBtn">➕ <span data-i18n="add_new_interviewee">新增访谈</span></button>
                </div>
            </div>
        </div>
    </div>

    <!-- 列表表格 -->
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0" style="min-width: 1000px; white-space: nowrap;">
                    <thead class="table-light">
                        <tr>
                            <th>ID</th>
                            <th><span data-i18n="country">国家</span></th>
                            <th><span data-i18n="interview_title">访谈名称</span></th>
                            <th><span data-i18n="created_at">创建时间</span></th>
                            <th><span data-i18n="interviewee_period">访谈有效期</span></th>
                            <th><span data-i18n="interviewee_number">访谈人数</span></th>
                            <th><span data-i18n="quenstion_number">题目数量</span></th>
                            <th><span data-i18n="inspector">检查人员</span></th>
                            <th><span data-i18n="feedback_person">反馈人</span></th>  <!-- ✅ 新增 -->
                            <th><span data-i18n="status">状态</span></th>
                            <th><span data-i18n="actions">操作</span></th>
                        </tr>
                    </thead>
                    <tbody id="interviewTableBody">
                        <tr><td colspan="9" class="text-center"><span data-i18n="loading">加载中...</span></td></tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="card-footer d-flex justify-content-between align-items-center">
            <div><span data-i18n="total_questions">共</span> <span id="totalCount">0</span> <span data-i18n="record">条记录</span></div>
            <nav><ul class="pagination mb-0" id="pagination"></ul></nav>
        </div>
    </div>
</div>

<!-- 新增访谈模态框 -->
<div class="modal fade" id="newInterviewModal" tabindex="-1" data-bs-backdrop="static">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title"><span data-i18n="add_new_interviewee">新增访谈</span></h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label" for="examSearch"><span data-i18n="exam_name">考试名称</span></label>
                        <input type="text" id="examSearch" class="form-control" list="examDatalist" 
                        data-i18n-placeholder="placeholder_exam_name" placeholder="考试名称">
                        <datalist id="examDatalist"></datalist>
                        <input type="hidden" id="selectedExamId">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="questionCount"><span data-i18n="interview_check_number">抽查数量（每人）</span></label>
                        <input type="number" id="questionCount" class="form-control" min="1" value="5">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="startTime"><span data-i18n="interview_start_time">访谈开始时间</span></label>
                        <input type="datetime-local" id="startTime" class="form-control">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="endTime"><span data-i18n="interview_end_time">访谈结束时间</span></label>
                        <input type="datetime-local" id="endTime" class="form-control">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="reviewerInput"><span data-i18n="inspector">检查人员（监督员）</span></label>
                        <input type="text" id="reviewerInput" class="form-control" 
                        data-i18n-placeholder="placeholder_optional" placeholder="选填">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="feedbackInput"><span data-i18n="feedback_person">反馈人</span></label>
                        <input type="text" id="feedbackInput" class="form-control" 
                        data-i18n-placeholder="placeholder_optional" placeholder="选填">
                    </div>
                </div>
                <hr>
                <h6><span data-i18n="selecting_interviewee">选择访谈人员</span></h6>
                <div class="row g-2 mb-2">
                    <div class="col-md-3">
                        <input type="text" id="userSearch" class="form-control" 
                        data-i18n-placeholder="placeholder_mail_name" placeholder="姓名/邮箱">
                    </div>
                    <div class="col-md-2">
                        <input type="text" id="whIdFilter" class="form-control" 
                        data-i18n-placeholder="placeholder_wh_id" placeholder="库房编码">
                    </div>
                    <div class="col-md-2">
                        <select id="isPartnerFilter" class="form-select">
                            <option value="" data-i18n="supplier_all">服务商(全部)</option>
                            <option value="Y" data-i18n="partner_yes">是</option>
                            <option value="N" data-i18n="partner_no">否</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <input type="text" id="countryFilter" class="form-control" list="countryDatalist" 
                        data-i18n-placeholder="placeholder_country" placeholder="国家">
                        <input type="hidden" id="countryCodeForInterview">
                    </div>
                    <div class="col-md-3">
                        <button id="loadUsersBtn" class="btn btn-secondary w-100"><span data-i18n="refresh_list">刷新列表</span></button>
                    </div>
                </div>
                <div style="max-height: 300px; overflow-y: auto; border: 1px solid #ddd;">
                    <table class="table table-sm mb-0">
                        <thead>
                            <tr>
                                <th><input type="checkbox" id="selectAllUsers"></th>
                                <th><span data-i18n="name_en">姓名</span></th>
                                <th><span data-i18n="email">邮箱</span></th>
                                <th><span data-i18n="country">国家</span></th>
                                <th><span data-i18n="wh_id">库房编码</span></th>
                            </tr>
                        </thead>
                        <tbody id="userListBody"></tbody>
                    </table>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-info" id="previewBtn"><span data-i18n="preview_content">预览访谈内容</span></button>
                <button class="btn btn-warning" id="saveDraftBtn"><span data-i18n="save_as_draft">保存为草稿</span></button>
                <button class="btn btn-success" id="saveAndPublishBtn"><span data-i18n="save_public">保存并发布</span></button>
                <button class="btn btn-secondary" data-bs-dismiss="modal"><span data-i18n="cancel">取消</span></button>
            </div>
        </div>
    </div>
</div>

<!-- 预览模态框 -->
<div class="modal fade" id="previewModal" tabindex="-1" data-bs-backdrop="static">
    <div class="modal-dialog modal-xl modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title"><span data-i18n="interview_preview">访谈预览</span> - <span id="previewExamTitle"></span></h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="previewContent">
                <!-- 动态填充 -->
            </div>
            <div class="modal-footer">
                <span id="currentUserIndicator" class="me-auto"></span>
                <button class="btn btn-secondary" id="prevUserBtn" disabled><span data-i18n="interview_previous">上一个</span></button>
                <button class="btn btn-secondary" id="nextUserBtn"><span data-i18n="interview_next">下一个</span></button>
                <button class="btn btn-primary" id="confirmSaveBtn"><span data-i18n="confirm_to_save_close">确认保存并关闭预览</span></button>
            </div>
        </div>
    </div>
</div>

<!-- 编辑草稿模态框 -->
<div class="modal fade" id="editInterviewModal" tabindex="-1" data-bs-backdrop="static">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title"><span data-i18n="edit">编辑</span></h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="editInterviewId">
                <div class="mb-3">
                    <label class="form-label" for="editStartTime"><span data-i18n="interview_start_time">访谈开始时间</span></label>
                    <input type="datetime-local" id="editStartTime" class="form-control">
                </div>
                <div class="mb-3">
                    <label class="form-label" for="editEndTime"><span data-i18n="interview_end_time">访谈结束时间</span></label>
                    <input type="datetime-local" id="editEndTime" class="form-control">
                </div>
                <div class="mb-3">
                    <label class="form-label" for="editReviewer"><span data-i18n="inspector">检查人员（监督员）</span></label>
                    <input type="text" id="editReviewer" class="form-control">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal"><span data-i18n="cancel">取消</span></button>
                <button class="btn btn-primary" id="saveEditBtn"><span data-i18n="save">保存</span></button>
            </div>
        </div>
    </div>
</div>

{% endblock %}

{% block extra_js %}
<script>
    const CURRENT_USER_ROLE = "{{ session.get('role', 'user') }}";
    // 全局变量
    let currentPage = 1;
    let filters = { name: '', country: '' };
    let selectedExamId = null;
    let previewData = [];          // 预览数据
    let currentPreviewIndex = 0;
    let pendingSaveData = null;   // 暂存待提交的表单数据

    let editMode = false;
    let editingInterviewId = null;

    // 等待 i18n 就绪工具函数
    function waitForI18n() {
        return new Promise((resolve) => {
            if (window.i18n && Object.keys(window.i18n.translations || {}).length > 0) {
                resolve();
                return;
            }
            const check = setInterval(() => {
                if (window.i18n && Object.keys(window.i18n.translations || {}).length > 0) {
                    clearInterval(check);
                    resolve();
                }
            }, 50);
        });
    }

    // ========== 初始化 ==========
    document.addEventListener('DOMContentLoaded', async () => {
        await setupCountryAutocomplete('filterCountry', 'countryDatalist', 'filterCountryCode');
        await waitForI18n();                 // 确保 i18n 已就绪
        window.i18n.applyTranslations();     // 翻译静态 data-i18n 元素
        loadInterviews();

        // 语言切换时重新加载列表，实现实时翻译
        let isInitialSubscribe = true;
        window.i18n.subscribe(async () => {
            if (isInitialSubscribe) {
                isInitialSubscribe = false;
                return;
            }
        });
    });

    // ========== 列表加载 ==========
    async function loadInterviews() {
        const params = new URLSearchParams({
            page: currentPage,
            per_page: 20,
            name: filters.name,
            country: filters.country
        });
        const res = await fetch(`/api/admin/interviews?${params}`);
        const data = await res.json();
        renderInterviewTable(data.data);
        document.getElementById('totalCount').innerText = data.total;
        renderPagination(data.page, Math.ceil(data.total / data.per_page));
    }

    function getStatusText(status) {
        const map = { 'draft': t('t_draft'), 'created': t('t_not_started'), 'active': t('t_on_going'), 'closed': t('t_closed') };
        return map[status] || status;
    }
    function formatDate(iso) {
        if (!iso) return '-';
        return new Date(iso).toLocaleString();
    }
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;' })[m]);
    }

    function renderInterviewTable(interviews) {
        const tbody = document.getElementById('interviewTableBody');
        if (!interviews.length) {
            tbody.innerHTML = `<tr><td colspan="9" class="text-center">${t('t_no_data')}</td></tr>`;
            return;
        }
        tbody.innerHTML = interviews.map(inv => {
        const status = inv.status; // draft, created, active, closed
        const isSuperAdmin = CURRENT_USER_ROLE === 'super_admin';
        let actionButtons = '';

        if (status === 'draft' || status === 'created') {
            actionButtons = `
                <button class="btn btn-sm btn-outline-primary edit-interview-btn" data-id="${inv.id}">${t('t_edit')}</button>
                <button class="btn btn-sm btn-outline-danger delete-interview-btn" data-id="${inv.id}">${t('t_delete')}</button>`;
        } else if (status === 'active') {
            actionButtons = `
                <button class="btn btn-sm btn-outline-primary edit-interview-btn" data-id="${inv.id}">${t('t_edit')}</button>
                <button class="btn btn-sm btn-outline-info detail-btn" data-id="${inv.id}">${t('t_details')}</button>
                <button class="btn btn-sm btn-outline-danger delete-interview-btn" data-id="${inv.id}">${t('t_delete')}</button>`;
        } else if (status === 'closed') {
            // 已关闭：仅详情；超管额外显示删除
            actionButtons = `<button class="btn btn-sm btn-outline-info detail-btn" data-id="${inv.id}">${t('t_details')}</button>`;
            if (isSuperAdmin) {
                actionButtons += `
                <button class="btn btn-sm btn-outline-primary edit-interview-btn" data-id="${inv.id}">${t('t_edit')}</button>
                <button class="btn btn-sm btn-outline-danger delete-interview-btn" data-id="${inv.id}">${t('t_delete')}</button>`;
            }
        }

        return `
            <tr>
                <td>${inv.id}</td>
                <td>${escapeHtml(inv.country || '-')}</td>
                <td><a href="/admin/interview/${inv.id}" class="text-decoration-none">${escapeHtml(inv.title)}</a></td>
                <td>${formatLocalTime(inv.created_at)}</td>
                <td>${formatLocalTime(inv.start_time)} - ${formatLocalTime(inv.end_time)}</td>
                <td>${inv.interviewee_count} ${t('t_people')}</td>
                <td>${inv.question_count} ${t('t_question_per_people')}</td>
                <td>${escapeHtml(inv.reviewer || '-')}</td>
                <td>${escapeHtml(inv.feedback || '-')}</td>  <!-- ✅ 新增反馈人列 -->
                <td>${getStatusBadge(status)}</td>
                <td>${actionButtons}</td>
            </tr>
        `;
        }).join('');

        // 绑定事件
        document.querySelectorAll('.detail-btn').forEach(btn => {
            btn.addEventListener('click', () => location.href = `/admin/interview/${btn.dataset.id}/details`);
        });
        document.querySelectorAll('.edit-interview-btn').forEach(btn => {
            btn.addEventListener('click', () => openEditInterviewModal(btn.dataset.id));
        });
        document.querySelectorAll('.delete-interview-btn').forEach(btn => {
            btn.addEventListener('click', async () => {
                if (confirm(t('t_interveiw_delete_confirm'))) {
                    await fetch(`/api/admin/interviews/${btn.dataset.id}`, { method: 'DELETE' });
                    loadInterviews();
                }
            });
        });
    }

    function getStatusBadge(status) {
        const map = {
            'draft': `<span class="badge bg-secondary">${t('t_draft')}</span>`,
            'created': `<span class="badge bg-info">${t('t_not_started')}</span>`,
            'active': `<span class="badge bg-success">${t('t_on_going')}</span>`,
            'closed': `<span class="badge bg-danger">${t('t_closed')}</span>`
        };
        return map[status] || status;
    }

    function formatDate(iso) {
        if (!iso) return '-';
        return new Date(iso).toLocaleString();
    }

    function renderPagination(current, totalPages) {
        const pagination = document.getElementById('pagination');
        if (totalPages <= 1) { pagination.innerHTML = ''; return; }
        let html = '';
        for (let i = 1; i <= totalPages; i++) {
            html += `<li class="page-item ${i === current ? 'active' : ''}"><a class="page-link" href="#" data-page="${i}">${i}</a></li>`;
        }
        pagination.innerHTML = html;
        pagination.querySelectorAll('.page-link').forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                currentPage = parseInt(link.dataset.page);
                loadInterviews();
            });
        });
    }

    document.getElementById('searchBtn').addEventListener('click', () => {
        filters.name = document.getElementById('filterName').value;
        const countryText = document.getElementById('filterCountry').value;
        filters.country = document.getElementById('filterCountryCode').value || resolveCountryParam(countryText);
        currentPage = 1;
        loadInterviews();
    });

    // ========== 新增访谈模态框 ==========
    document.getElementById('newInterviewBtn').addEventListener('click', () => {
        // 重置表单
        document.getElementById('examSearch').value = '';
        document.getElementById('selectedExamId').value = '';
        document.getElementById('questionCount').value = 5;
        document.getElementById('startTime').value = '';
        document.getElementById('endTime').value = '';
        document.getElementById('reviewerInput').value = '';
        document.getElementById('userSearch').value = '';
        document.getElementById('whIdFilter').value = '';
        document.getElementById('isPartnerFilter').value = '';
        document.getElementById('countryFilter').value = '';
        document.getElementById('userListBody').innerHTML = '';
        // 清空预览相关
        editMode = false;
        resetInterviewForm();
        previewData = [];
        pendingSaveData = null;
        new bootstrap.Modal(document.getElementById('newInterviewModal')).show();
    });

    // 考试名称模糊搜索
    document.getElementById('examSearch').addEventListener('input', async function () {
        const q = this.value.trim();
        const datalist = document.getElementById('examDatalist');
        if (!q) { datalist.innerHTML = ''; return; }
        try {
            const res = await fetch(`/api/search/exams?q=${encodeURIComponent(q)}`);
            const names = await res.json();
            datalist.innerHTML = names.map(name => `<option value="${escapeHtml(name)}">`).join('');
        } catch (e) {
            console.error(t('t_search_examination_failed'), e);
        }
    });

    // 当考试名称选定后，获取考试ID (通过匹配 exam 名称)
    document.getElementById('examSearch').addEventListener('change', async function () {
        const selectedTitle = this.value.trim();
        if (!selectedTitle) return;
        try {
            const res = await fetch('/api/admin/exams/list?per_page=1&name=' + encodeURIComponent(selectedTitle));
            const data = await res.json();
            if (data.data.length > 0) {
                document.getElementById('selectedExamId').value = data.data[0].id;
                console.log(t('t_select_exam'), data.data[0].id);
            } else {
                alert(t('t_no_matching_exam'));
            }
        } catch (e) {
            console.error(e);
        }
    });

    // 加载学员列表
    document.getElementById('loadUsersBtn').addEventListener('click', loadUserListForInterview);
    
    async function loadUserListForInterview() {
        const search = document.getElementById('userSearch').value;
        const countryText = document.getElementById('countryFilter').value;
        const countryCode = document.getElementById('countryCodeForInterview').value || resolveCountryParam(countryText);
        const whId = document.getElementById('whIdFilter').value;
        const isPartner = document.getElementById('isPartnerFilter').value;
        // 构建查询参数（后端暂时只支持 search 和 country，其余前端过滤）
        const params = new URLSearchParams({
            search: search,
            country: countryCode,
            page: 1,
            per_page: 100   // 一次加载足够多
        });
        const res = await fetch(`/api/admin/users?${params}`);
        const data = await res.json();
        // 在获取用户列表后过滤
        let users = data.data.filter(u => u.user_status === 'registered');
        // 前端额外过滤
        if (whId) {
            users = users.filter(u => u.wh_id && u.wh_id.toLowerCase().includes(whId.toLowerCase()));
        }
        if (isPartner) {
            users = users.filter(u => u.is_partner === (isPartner === 'Y'));
        }
        const tbody = document.getElementById('userListBody');
        tbody.innerHTML = users.map(u => `
            <tr>
                <td><input type="checkbox" class="user-checkbox" value="${u.id}"></td>
                <td>${escapeHtml(u.name_en || '')}</td>
                <td>${escapeHtml(u.email)}</td>
                <td>${escapeHtml(u.country || '-')}</td>
                <td>${escapeHtml(u.wh_id || '-')}</td>
            </tr>
        `).join('');
        document.getElementById('selectAllUsers').onclick = (e) => {
            document.querySelectorAll('.user-checkbox').forEach(cb => cb.checked = e.target.checked);
        };
    }

    // ========== 预览按钮 ==========
    document.getElementById('previewBtn').addEventListener('click', async () => {
        const examId = document.getElementById('selectedExamId').value;
        if (!examId || examId === 'undefined' || examId === 'null') {
            alert(t('t_choice_availabel_exam'));
            return;
        }
        const userIds = Array.from(document.querySelectorAll('.user-checkbox:checked')).map(cb => cb.value);
        const questionCount = parseInt(document.getElementById('questionCount').value) || 5;
        if (!examId) { alert(t('t_choice_exam')); return; }
        if (userIds.length === 0) { alert(t('t_choice_candidate')); return; }

        const payload = {
            exam_id: examId,
            user_ids: userIds,
            question_count: questionCount
        };

        try {
            const res = await fetch('/api/admin/interview/preview', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            if (!res.ok) throw new Error(t('t_preview_failed'));
            const data = await res.json();
            previewData = data.preview;
            document.getElementById('previewExamTitle').innerText = data.exam_title || t('t_unnamed_examination');
            currentPreviewIndex = 0;
            renderPreviewUser();
            new bootstrap.Modal(document.getElementById('previewModal')).show();
        } catch (e) {
            alert('预览出错：' + e.message);
        }
    });

    function renderPreviewUser() {
        if (previewData.length === 0) return;
        const user = previewData[currentPreviewIndex];
        document.getElementById('currentUserIndicator').innerText = `学员：${user.user_name} (${currentPreviewIndex + 1}/${previewData.length})`;
        let html = `<h6>${user.user_name} 的访谈题目</h6><ol>`;
        user.questions.forEach(q => {
            // html += `<li>${escapeHtml(q.content_cn || q.content_raw)}</li>`;
            html += `<li>${escapeHtml(q.content)}</li>`;
        });
        html += '</ol>';
        document.getElementById('previewContent').innerHTML = html;
        document.getElementById('prevUserBtn').disabled = currentPreviewIndex === 0;
        document.getElementById('nextUserBtn').disabled = currentPreviewIndex === previewData.length - 1;
    }

    document.getElementById('prevUserBtn').addEventListener('click', () => {
        if (currentPreviewIndex > 0) {
            currentPreviewIndex--;
            renderPreviewUser();
        }
    });
    document.getElementById('nextUserBtn').addEventListener('click', () => {
        if (currentPreviewIndex < previewData.length - 1) {
            currentPreviewIndex++;
            renderPreviewUser();
        }
    });

    // ========== 保存（草稿/发布） ==========
    async function saveInterview(isDraft) {
        const examId = document.getElementById('selectedExamId').value;
        const questionCount = parseInt(document.getElementById('questionCount').value) || 5;
        const reviewer = document.getElementById('reviewerInput').value;
        const feedback = document.getElementById('feedbackInput').value;  // ✅ 新增
        const startTime = localDateTimeToUTC(document.getElementById('startTime').value);
        const endTime = localDateTimeToUTC(document.getElementById('endTime').value);
        const userIds = Array.from(document.querySelectorAll('.user-checkbox:checked')).map(cb => cb.value);
        if (!examId) { alert('请选择考试'); return; }
        if (userIds.length === 0) { alert('请选择学员'); return; }

        const payload = {
            exam_id: examId,
            question_count: questionCount,
            reviewer: reviewer,
            feedback: feedback,  // ✅ 新增
            is_draft: isDraft,
            start_time: startTime || null,
            end_time: endTime || null,
            user_ids: userIds
        };

        if (editMode) {
            payload.id = editingInterviewId;
        }

        const url = editMode ? '/api/admin/interviews' : '/api/admin/interviews';
        const method = editMode ? 'PUT' : 'POST';

        try {
            const res = await fetch(url, {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const result = await res.json();
            if (result.success) {
                alert('保存成功');
                bootstrap.Modal.getInstance(document.getElementById('newInterviewModal')).hide();
                bootstrap.Modal.getInstance(document.getElementById('previewModal'))?.hide();
                editMode = false;
                resetInterviewForm();
                loadInterviews();
            } else {
                alert('保存失败: ' + (result.message || ''));
            }
        } catch (e) {
            alert('保存出错: ' + e.message);
        }
    }

    function resetInterviewForm() {
        document.getElementById('examSearch').value = '';
        document.getElementById('selectedExamId').value = '';
        document.getElementById('questionCount').value = 5;
        document.getElementById('reviewerInput').value = '';
        document.getElementById('feedbackInput').value = '';  // ✅ 新增
        document.getElementById('startTime').value = '';
        document.getElementById('endTime').value = '';
        document.getElementById('userSearch').value = '';
        document.getElementById('whIdFilter').value = '';
        document.getElementById('isPartnerFilter').value = '';
        document.getElementById('countryFilter').value = '';
        document.getElementById('userListBody').innerHTML = '';
        // 重新启用所有字段（防止残留禁用状态）
        document.getElementById('examSearch').disabled = false;
        document.getElementById('questionCount').disabled = false;
        document.getElementById('userSearch').disabled = false;
        document.querySelectorAll('.user-checkbox').forEach(cb => cb.disabled = false);
    }

    document.getElementById('saveDraftBtn').addEventListener('click', () => saveInterview(true));
    document.getElementById('saveAndPublishBtn').addEventListener('click', () => saveInterview(false));

    // 预览模态框中的确认保存按钮
    document.getElementById('confirmSaveBtn').addEventListener('click', async () => {
        // 关闭预览，保留新建模态框，然后自行点击保存按钮
        bootstrap.Modal.getInstance(document.getElementById('previewModal')).hide();    
        // 自动保存为草稿（安全），如果用户想修改有效期再编辑
        await saveInterview(true);
        // 提示用户选择草稿或发布
    });

    // ========== 辅助函数 ==========
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    // ========== 编辑访谈 ==========
    async function openEditInterviewModal(invId) {
        function toLocalDatetimeLocal(isoString) {
            if (!isoString) return '';
            const date = new Date(isoString);
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            const hours = String(date.getHours()).padStart(2, '0');
            const minutes = String(date.getMinutes()).padStart(2, '0');
            return `${year}-${month}-${day}T${hours}:${minutes}`;
        }
        // 获取访谈完整数据（需要后端提供返回现有人员ID的接口，或从详情接口获取）
        // 这里通过 GET 单个访谈的详情（需新增简单接口，或从列表缓存中提取）
        let interview;
        // 尝试从列表数据中获取（如果页面已加载）
        const res = await fetch(`/api/admin/interviews?per_page=100`);
        const data = await res.json();
        interview = (data.data || []).find(inv => inv.id == invId);
        if (!interview) return alert('未找到访谈信息');

        const examId = interview.exam_id;
        if (examId) {
            document.getElementById('selectedExamId').value = examId;
        } else {
            console.warn('编辑的访谈缺少 exam_id');
        }
        // 准备打开新增模态框并填充数据
        editMode = true;
        editingInterviewId = invId;

        // 填充基本信息
        document.getElementById('examSearch').value = interview.exam_title || '';
        document.getElementById('selectedExamId').value = interview.exam_id || '';
        document.getElementById('questionCount').value = interview.question_count || 8;
        document.getElementById('reviewerInput').value = interview.reviewer || '';
        document.getElementById('feedbackInput').value = interview.feedback || '';  // ✅ 新增
        document.getElementById('startTime').value = toLocalDatetimeLocal(interview.start_time);
        document.getElementById('endTime').value = toLocalDatetimeLocal(interview.end_time);

        // 加载学员列表并勾选已存在的学员
        await loadUserListForInterview(); // 先加载全部可选学员
        // 通过异步请求获取该访谈已有的 user_ids（需后端提供简单接口）
        const userRes = await fetch(`/api/admin/interview/${invId}/user_ids`);
        const userIds = (await userRes.json()).user_ids || [];
        // 勾选对应复选框
        document.querySelectorAll('.user-checkbox').forEach(cb => {
            cb.checked = userIds.includes(cb.value);
        });

        // 根据状态控制字段是否可修改
        const status = interview.status;
        const disableFields = status === 'active'; // 进行中禁用人员、考试、题目数量
        document.getElementById('examSearch').disabled = disableFields;
        document.getElementById('questionCount').disabled = disableFields;
        document.getElementById('userSearch').disabled = disableFields;
        // 禁用复选框（通过禁用整个表格区域？更优雅的是禁用所有复选框）
        document.querySelectorAll('.user-checkbox').forEach(cb => cb.disabled = disableFields);
        document.getElementById('isPartnerFilter').disabled = disableFields;
        document.getElementById('whIdFilter').disabled = disableFields;
        document.getElementById('countryFilter').disabled = disableFields;

        // 显示模态框
        new bootstrap.Modal(document.getElementById('newInterviewModal')).show();
    }

    document.getElementById('saveEditBtn').addEventListener('click', async () => {
        const invId = document.getElementById('editInterviewId').value;
        const startTime = localDateTimeToUTC(document.getElementById('editStartTime').value);
        const endTime = localDateTimeToUTC(document.getElementById('editEndTime').value);
        const reviewer = document.getElementById('editReviewer').value;
        const payload = { id: invId };
        if (startTime) payload.start_time = startTime;
        if (endTime) payload.end_time = endTime;
        if (reviewer) payload.reviewer = reviewer;
        const res = await fetch('/api/admin/interviews', {
            method: 'PUT',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(payload)
        });
        const result = await res.json();
        if (result.success) {
            alert('更新成功');
            bootstrap.Modal.getInstance(document.getElementById('editInterviewModal')).hide();
            loadInterviews();
        } else {
            alert('更新失败');
        }
    });
    window.addEventListener('app:languageChanged', function() {
        if (typeof loadInterviews === 'function') loadInterviews();
    });
</script>
