<!-- templates/admin/list_users.html -->
{% extends "base.html" %}
{% block title %}{{ _('user_management') }}{% endblock %}
{% block content %}
<div class="container-fluid">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="bi bi-people"></i> <span data-i18n="user_management">用户管理</span></h2>
    </div>

    <!-- 搜索筛选 -->
    <div class="card mb-3">
        <div class="card-body">
            <div class="row g-3">
                <div class="col-md-3">
                    <input type="text" id="searchInput" class="form-control" 
                    data-i18n-placeholder="placeholder_mail_name" placeholder="搜索邮箱/姓名">
                </div>
                <div class="col-md-3">
                    <input type="text" id="filterCountry" class="form-control" list="countryDatalist" 
                    data-i18n-placeholder="placeholder_select_or_input" placeholder="输入选择国家" 
                    autocomplete="off">
                    <datalist id="countryDatalist"></datalist>
                </div>
                <div class="col-md-2">
                    <button id="searchBtn" class="btn btn-primary"><span data-i18n="search">搜索</span></button>
                </div>
                <div class="col-md-4">
                    <button class="btn btn-sm btn-outline-secondary ms-2" onclick="history.back();">✖ <span data-i18n="close">关闭</span></button>
                    <button class="btn btn-sm btn-primary" data-bs-toggle="modal" data-bs-target="#addUserModal">
                        <i class="bi bi-plus-circle"></i> <span data-i18n="add_user">添加用户</span>
                    </button>
                    <button class="btn btn-sm btn-outline-success" id="importBtn">
                        <i class="bi bi-file-earmark-excel"></i><span data-i18n="batch_import">批量导入</span>
                    </button>
                    <input type="file" id="importFileInput" accept=".xlsx,.xls" style="display:none">
                </div>
            </div>
        </div>
    </div>

    <!-- 用户列表表格 -->
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0" style="min-width: 1000px;" >
                    <style>
                        .table-responsive {
                            overflow-x: auto;
                            white-space: nowrap;
                        }
                        .table td, .table th {
                            vertical-align: middle;
                        }
                        /* 允许部分列在内容过长时换行（可选），但保持表格整体不换行 */
                        .time-range {
                            min-width: 280px;
                        }
                        .btn-group-sm .btn {
                            white-space: nowrap;
                        }
                    </style>
                    <thead class="table-light">
                        <tr>
                            <th>ID</th>
                            <th><span data-i18n="country">国家</span></th>
                            <th><span data-i18n="name_en">姓名</span></th>
                            <th><span data-i18n="email">邮箱</span></th>
                            <th><span data-i18n="company">公司</span></th>
                            <th><span data-i18n="department">部门/合作伙伴</span></th>
                            <th><span data-i18n="wh_type">库房类型</span></th>
                            <th><span data-i18n="wh_id">库房编码</span></th>
                            <th><span data-i18n="wh_name_en">库房名称(EN)</span></th>
                            <th><span data-i18n="user_status">用户状态</span></th>
                            <th><span data-i18n="is_partner">合作方?</span></th>
                            <th><span data-i18n="employee_id">工号</span></th>
                            <th><span data-i18n="birthday">生日</span></th>
                            <th><span data-i18n="role">角色</span></th>
                            <th><span data-i18n="actions">操作</span></th>
                        </tr>
                    </thead>
                    <tbody id="userTableBody">
                        <tr><td colspan="13" class="text-center"><span data-i18n="loading">加载中...</span></td></tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="card-footer d-flex justify-content-between align-items-center">
            <div><span data-i18n="total_questions">共</span> <span id="totalCount">0</span> <span data-i18n="record">条记录</span></div>
            <nav><ul class="pagination mb-0" id="pagination"></ul></nav>
        </div>
    </div>
</div>

<!-- 添加/编辑用户模态框 -->
<div class="modal fade" id="addUserModal" tabindex="-1" data-bs-backdrop="static">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title"><span data-i18n="add_user">添加用户</span></h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="userForm">
                    <input type="hidden" id="editUserId">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label" for="email"><span data-i18n="email">邮箱</span> *</label>
                            <input type="email" class="form-control" id="email" autocomplete="email" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="userCountrySelect"><span data-i18n="country">国家</span></label>
                            <input type="text" id="userCountrySelect" name="country" class="form-control" list="countryDatalist" 
                            data-i18n-placeholder="placeholder_select_or_input" placeholder="请输入或选择国家"
                            data-code-input="countryCode" autocomplete="off">
                            <datalist id="countryDatalist"></datalist>
                            <input type="hidden" id="countryCode">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="name_en"><span data-i18n="name_en">姓名</span></label>
                            <input type="text" class="form-control" id="name_en">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="company"><span data-i18n="company">公司</span></label>
                            <input type="text" class="form-control" id="company" autocomplete="organization">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="wh_type"><span data-i18n="wh_type">库房类型</span></label>
                            <input type="text" class="form-control" id="wh_type">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="wh_id"><span data-i18n="wh_id">库房编码</span></label>
                            <input type="text" class="form-control" id="wh_id">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="wh_name_en"><span data-i18n="wh_name_en">库房名称(EN)</span></label>
                            <input type="text" class="form-control" id="wh_name_en">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="user_status"><span data-i18n="user_status">用户状态</span></label>
                            <select class="form-select" id="user_status">
                                <option value="imported"><span data-i18n="imported">已添加</span></option>
                                <option value="registered"><span data-i18n="registered">已注册</span></option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="isPartnerSelect"><span data-i18n="is_partner">服务商?</span></label>
                            <select class="form-select" id="isPartnerSelect">
                                <option value="Y"><span data-i18n="partner_yes">是</span></option>
                                <option value="N"><span data-i18n="partner_no">否</span></option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="department"><span data-i18n="department">部门/合作伙伴</span></label>
                            <input type="text" class="form-control" id="department">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="employee_id" data-i18n="employee_id">工号</label>
                            <input type="text" class="form-control" id="employee_id">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="birthday"><span data-i18n="birthday">出生日期</span></label>
                            <input type="date" name="birthday" id="birthday" class="form-control">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="role" data-i18n="role">角色</label>
                            <select class="form-select" id="role">
                                <option value="user" data-i18n="ordinary_user">普通用户</option>
                                <option value="admin" data-i18n="administrator">管理员</option>
                                <option value="super_admin">超级管理员</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="phone"><span data-i18n="phone">手机号</span></label>
                            <input type="text" class="form-control" id="phone" autocomplete="tel">
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal"><span data-i18n="cancel">取消</span></button>
                <button type="button" class="btn btn-primary" id="saveUserBtn"><span data-i18n="save">保存</span></button>
            </div>
        </div>
    </div>
</div>

<!-- 重置密码模态框 -->
<div class="modal fade" id="resetPwdModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title"><span data-i18n="reset_password">重置密码</span></h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p><span data-i18n="generate_new_pw_tip">将生成新密码并发送到用户邮箱，确定继续吗？</span></p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal"><span data-i18n="cancel">取消</span></button>
                <button type="button" class="btn btn-warning" id="confirmResetBtn"><span data-i18n="confirm_reset">确定重置</span></button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    function isSuperAdmin() {
        return CURRENT_USER_ROLE === 'super_admin';
    }

    const CURRENT_USER_ROLE = "{{ session.get('role', 'user') }}";
   
    // 全局：动态更新邮箱必填属性
    function updateEmailRequired() {
        const emailInput = document.getElementById('email');
        const userStatusSelect = document.getElementById('user_status');
        if (emailInput && userStatusSelect) {
            if (userStatusSelect.value === 'imported') {
                emailInput.removeAttribute('required');
            } else {
                emailInput.setAttribute('required', 'required');
            }
        }
    }

    // 等待 i18n 就绪工具函数
    function waitForI18n() {
        return new Promise((resolve) => {
            if (window.i18n && Object.keys(window.i18n.translations || {}).length > 0) {
                resolve();
                return;
            }
            const check = setInterval(() => {
                if (window.i18n && Object.keys(window.i18n.translations || {}).length > 0) {
                    clearInterval(check);
                    resolve();
                }
            }, 50);
        });
    }

    let currentPage = 1;
    let currentSearch = '';
    let currentCountry = '';
    let currentEditUserId = null;

    function loadUsers() {
        const params = new URLSearchParams({
            page: currentPage,
            per_page: 20,
            search: currentSearch,
            country: currentCountry
        });
        fetch(`/api/admin/users?${params}`)
            .then(res => res.json())
            .then(data => {
                renderUserTable(data.data);
                document.getElementById('totalCount').textContent = data.total;
                renderPagination(data.page, Math.ceil(data.total / data.per_page));
            })
            .catch(err => console.error(err));
    }

    // 定义辅助函数用于超级用户管理
    function canEditUser(user) {
        if (CURRENT_USER_ROLE === 'super_admin') return true;
        if (user.role === 'admin' || user.role === 'super_admin') return false;
        return true; // 普通用户可编辑
    }
    function canDeleteUser(user) {
        if (CURRENT_USER_ROLE === 'super_admin') return user.id !== '{{ session.user_id }}';
        if (user.role === 'admin' || user.role === 'super_admin') return false;
        return user.id !== '{{ session.user_id }}';
    }
    function canResetPwd(user) {
        // 普通管理员不能重置管理员密码
        if (CURRENT_USER_ROLE === 'super_admin') return true;
        return user.role === 'user';
    }

    function renderUserTable(users) {
        const tbody = document.getElementById('userTableBody');
        // 过滤超级管理员行（非超管看不到）
        let displayUsers = users;
        if (CURRENT_USER_ROLE !== 'super_admin') {
            displayUsers = users.filter(u => u.role !== 'super_admin');
        }
        if (!displayUsers.length) {
            tbody.innerHTML = `<tr><td colspan="13" class="text-center">${t('no_data')}</td></tr>`;
            return;
        }
        tbody.innerHTML = displayUsers.map(u => `
            <tr>
                <td>${u.id.slice(0,8)}...</td>
                <td>${escapeHtml(u.country || '-')}</td>
                <td>${escapeHtml(u.name_en || '-')}</td>
                <td>${u.email && u.email.startsWith('noemail-') ? '' : escapeHtml(u.email)}</td>
                <td>${escapeHtml(u.company || '-')}</td>
                <td>${escapeHtml(u.department || '-')}</td>
                <td>${escapeHtml(u.wh_type || '-')}</td>
                <td>${escapeHtml(u.wh_id || '-')}</td>
                <td>${escapeHtml(u.wh_name_en || '-')}</td>
                <td>${u.user_status === 'imported' ? t('t_imported') : (u.user_status === 'registered' ? t('t_registered') : escapeHtml(u.user_status || '-'))}</td>
                <td>${u.is_partner ? t('t_yes') : t('t_no')}</td>
                <td>${escapeHtml(u.employee_id || '-')}</td>
                <td>${escapeHtml(u.birthday || '-')}</td>
                <td>
                    ${u.role === 'super_admin' ? t('t_super_admin') : (u.role === 'admin' ? t('t_admin') : t('t_ordinary_user'))}
                </td>
                <td>
                    ${canEditUser(u) ? `<button class="btn btn-sm btn-outline-primary edit-btn" data-id="${u.id}">${t('t_edit')}</button>` : ''}
                    ${canResetPwd(u) ? `<button class="btn btn-sm btn-outline-warning reset-pwd-btn" data-id="${u.id}">${t('t_reset_password')}</button>` : ''}
                    ${canDeleteUser(u) ? `<button class="btn btn-sm btn-outline-danger delete-btn" data-id="${u.id}">${t('t_delete')}</button>` : ''}
                 </td>
            </tr>
        `).join('');
        
        // 绑定事件
        document.querySelectorAll('.edit-btn').forEach(btn => {
            btn.addEventListener('click', () => openEditModal(btn.dataset.id));
        });
        document.querySelectorAll('.reset-pwd-btn').forEach(btn => {
            btn.addEventListener('click', () => openResetPwd(btn.dataset.id));
        });
        document.querySelectorAll('.delete-btn').forEach(btn => {
            btn.addEventListener('click', () => deleteUser(btn.dataset.id));
        });
    }

    // 辅助函数：防XSS
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    function renderPagination(current, totalPages) {
        const pagination = document.getElementById('pagination');
        if (totalPages <= 1) {
            pagination.innerHTML = '';
            return;
        }
        let html = '';
        for (let i = 1; i <= totalPages; i++) {
            html += `<li class="page-item ${i === current ? 'active' : ''}"><a class="page-link" href="#" data-page="${i}">${i}</a></li>`;
        }
        pagination.innerHTML = html;
        pagination.querySelectorAll('.page-link').forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                currentPage = parseInt(link.dataset.page);
                loadUsers();
            });
        });
    }

    // 专用接口获取用户详情，并正确加载国家下拉框
    async function openEditModal(userId) {
        currentEditUserId = userId;
        try {
            // 使用专用接口获取单个用户（需要后端支持，见下文）
            const res = await fetch(`/api/admin/users/${userId}`);
            if (!res.ok) throw new Error('获取用户失败');
            const user = await res.json();
            
            // 依据 user_status 控制邮箱必填
            const emailInput = document.getElementById('email');
            if (user.user_status === 'imported') {
                emailInput.removeAttribute('required');
            } else {
                emailInput.setAttribute('required', 'required');
            }
                    
            const roleSelect = document.getElementById('role');
            // 从模板传入的 session 角色（将在后面说明如何获取）
            if (typeof CURRENT_USER_ROLE !== 'undefined' && CURRENT_USER_ROLE !== 'super_admin') {
                roleSelect.disabled = true;       // 普通管理员不能改角色
            }

            // 填充表单字段
            document.getElementById('email').value = user.email;
            document.getElementById('phone').value = user.phone || '';
            document.getElementById('name_en').value = user.name_en || '';
            document.getElementById('company').value = user.company || '';
            document.getElementById('department').value = user.department || '';
            document.getElementById('employee_id').value = user.employee_id || '';
            document.getElementById('birthday').value = user.birthday || '';
            document.getElementById('role').value = user.role || 'user';
            // 新增字段
            document.getElementById('wh_type').value = user.wh_type || '';
            document.getElementById('wh_id').value = user.wh_id || '';
            document.getElementById('wh_name_en').value = user.wh_name_en || '';
            document.getElementById('user_status').value = user.user_status || 'imported';
            document.getElementById('isPartnerSelect').value = user.is_partner || 'N';
                
            // 处理国家字段：设置输入框显示文本和隐藏代码
            const countryInput = document.getElementById('userCountrySelect');
            const countryCodeHidden = document.getElementById('countryCode');
            if (countryInput && countryCodeHidden) {
                if (user.country) {
                    // 需要将国家代码转换为显示名称（利用已缓存的国家列表）
                    const countries = await loadCountryList(); // 全局函数，需在 base.html 中实现
                    const matched = countries.find(c => c.code === user.country);
                    if (matched) {
                        const currentLang = window.i18n?.currentLang || 'zh';
                        countryInput.value = currentLang === 'zh' ? matched.name_zh : matched.name_en;
                        countryCodeHidden.value = matched.code;
                    } else {
                        countryInput.value = '';
                        countryCodeHidden.value = '';
                    }
                } else {
                    countryInput.value = '';
                    countryCodeHidden.value = '';
                }
            }
            // 绑定状态变化监听
            const userStatusSelect = document.getElementById('user_status');
            userStatusSelect.removeEventListener('change', updateEmailRequired);
            userStatusSelect.addEventListener('change', updateEmailRequired);
            updateEmailRequired(); // 根据当前状态设置

            new bootstrap.Modal(document.getElementById('addUserModal')).show();
        } catch (err) {
            console.error(t('t_user_loading_failed'), err);
            alert(t('t_user_loading_failed'));
        }
    }

    function openResetPwd(userId) {
        currentEditUserId = userId;
        new bootstrap.Modal(document.getElementById('resetPwdModal')).show();
    }

    async function deleteUser(userId) {
        if (!(await showConfirm(window.i18n.t('delete_user_tip')))) return;
        fetch(`/api/admin/users/${userId}`, { method: 'DELETE' })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    alert(t('delete_success'));
                    loadUsers();
                } else {
                    alert(t('delete_failed') + data.message);
                }
            });
    }

    document.getElementById('saveUserBtn').addEventListener('click', () => {
        const formData = {
            email: document.getElementById('email').value.trim(),
            phone: document.getElementById('phone').value,
            name_en: document.getElementById('name_en').value,
            company: document.getElementById('company').value,
            department: document.getElementById('department').value,
            employee_id: document.getElementById('employee_id').value,
            birthday: document.getElementById('birthday').value,
            country: document.getElementById('countryCode').value,
            // 只有当角色下拉框未被禁用时才传递角色（即超级管理员或自己编辑自己）
            ...(document.getElementById('role').disabled ? {} : { role: document.getElementById('role').value }),
            wh_type: document.getElementById('wh_type').value,
            wh_id: document.getElementById('wh_id').value,
            wh_name_en: document.getElementById('wh_name_en').value,
            user_status: document.getElementById('user_status').value,
            is_partner: document.getElementById('isPartnerSelect').value
        };
        const userStatus = document.getElementById('user_status')?.value;
            
        // 只有 user_status 不是 'imported' 时，邮箱才是必填的
        if (!formData.email && userStatus !== 'imported') {
            alert(t('mail_no_empty'));
            return;
        }
        const url = currentEditUserId ? `/api/admin/users/${currentEditUserId}` : '/api/admin/users';
        const method = currentEditUserId ? 'PUT' : 'POST';
        
        fetch(url, {
            method: method,
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(formData)
        }).then(res => res.json()).then(data => {
            if (data.success) {
                if (currentEditUserId) {
                    alert(t('update_success'));
                } else {
                    if (data.temp_password) {
                        alert(t('add_success', data.temp_password));
                    } else {
                        alert(t('add_success_no_pwd'));
                    }
                }
                bootstrap.Modal.getInstance(document.getElementById('addUserModal')).hide();
                loadUsers();
                currentEditUserId = null;
                document.getElementById('userForm').reset();
            } else {
                alert(t('operation_failed') + data.message);
            }
        });
    });

    // 新建用户时清空国家相关字段
    document.getElementById('addUserModal').addEventListener('show.bs.modal', async () => {
        // 绑定邮箱必填状态变化
        const userStatusSelect = document.getElementById('user_status');
        userStatusSelect.removeEventListener('change', updateEmailRequired);
        userStatusSelect.addEventListener('change', updateEmailRequired);
        updateEmailRequired();

        if (!currentEditUserId) {
            // 新建模式
            document.getElementById('userForm').reset();
            document.getElementById('editUserId').value = '';
            const countryInput = document.getElementById('userCountrySelect');
            const countryCodeHidden = document.getElementById('countryCode');
            if (countryInput) countryInput.value = '';
            if (countryCodeHidden) countryCodeHidden.value = '';
            if (typeof populateCountryDatalist === 'function') {
                await populateCountryDatalist('countryDatalist');
            }
            updateEmailRequired(); // 确保默认状态去掉 required
        }
    });

    // 导入按钮点击 → 触发1文件选择
    document.getElementById('importBtn').addEventListener('click', () => {
        document.getElementById('importFileInput').click();
    });

    // 1文件选择后自动上传
    document.getElementById('importFileInput').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        
        if (!confirm(`${t('t_confirm_import_file')} ${file.name} `)) {
            e.target.value = '';
            return;
        }
        
        const formData = new FormData();
        formData.append('file', file);
        
        const importBtn = document.getElementById('importBtn');
        importBtn.disabled = true;
        importBtn.innerHTML = `<span class="spinner-border spinner-border-sm"></span> ${t('t_importing')}`;
        
        try {
            const res = await fetch('/api/admin/users/import', {
                method: 'POST',
                body: formData
            });
            const result = await res.json();
            
            if (result.success) {
                alert(`${t('t_import_done')} ${result.success_count} ，${t('t_failed')} ${result.error_count} 。`);
                if (result.errors.length > 0) {
                    console.warn(t('t_failed_details'), result.errors);
                    alert('部分失败（详情见控制台）:\n' + result.errors.join('\n'));
                }
                loadUsers();  // 刷新列表
            } else {
                alert('导入失败: ' + (result.message || '未知错误'));
            }
        } catch (err) {
            alert('网络错误: ' + err.message);
        } finally {
            importBtn.disabled = false;
            importBtn.innerHTML = `<i class="bi bi-file-earmark-excel"></i> ${t('t_batch_import')}`;
            e.target.value = '';  // 清空文件选择
        }
    });

    // 重置密码按钮
    document.getElementById('confirmResetBtn').addEventListener('click', () => {
        if (!currentEditUserId) return;
        fetch(`/api/admin/users/${currentEditUserId}/reset_password`, { method: 'POST' })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    alert(t('pw_reset_success', data.new_password));
                    bootstrap.Modal.getInstance(document.getElementById('resetPwdModal')).hide();
                } else {
                    alert(t('reset_failed') + data.message);
                }
            });
    });

    document.getElementById('searchBtn').addEventListener('click', () => {
        currentSearch = document.getElementById('searchInput').value;
        currentCountry = document.getElementById('filterCountry').value;
        currentPage = 1;
        loadUsers();
    });

    // 页面初始化流程
    (async function() {
        await waitForI18n();
        window.i18n.applyTranslations();  // 处理静态文本
        loadUsers();
        // 语言切换时，重新加载列表以刷新动态文本
        window.i18n.subscribe(() => {
            loadUsers();
        });
    })();

    document.getElementById('userCountrySelect')?.addEventListener('blur', () => {
        validateCountryInput('userCountrySelect', 'countryCode');
    });

    // 初始化国家列表
    document.addEventListener('DOMContentLoaded', async () => {
        await populateCountryDatalist('countryDatalist');
    });
</script>
{% endblock %}
