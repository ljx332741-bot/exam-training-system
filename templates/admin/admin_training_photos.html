<!-- templates/admin/admin_training_photos.html -->
{% extends "base.html" %}
{% block title %}培训照片管理{% endblock %}

{% block extra_css %}
<style>
    .photo-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 16px;
        margin-top: 16px;
    }
    .photo-card {
        position: relative;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        transition: transform 0.2s;
        background: #fff;
        border: 1px solid #eee;
    }
    .photo-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 8px 24px rgba(0,0,0,0.15);
    }
    .photo-card img {
        width: 100%;
        height: 180px;
        object-fit: cover;
        display: block;
    }
    .photo-card .photo-info {
        padding: 10px 12px;
        font-size: 0.85rem;
    }
    .photo-card .photo-info .file-name {
        font-weight: 500;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .photo-card .photo-info .meta {
        color: #6c757d;
        font-size: 0.7rem;
        margin-top: 4px;
    }
    .photo-card .cover-badge {
        position: absolute;
        top: 8px;
        right: 8px;
        background: #198754;
        color: white;
        padding: 2px 10px;
        border-radius: 12px;
        font-size: 0.65rem;
        font-weight: 500;
    }
    .photo-card .action-menu {
        position: absolute;
        bottom: 8px;
        right: 8px;
        display: flex;
        gap: 4px;
        opacity: 0;
        transition: opacity 0.2s;
    }
    .photo-card:hover .action-menu {
        opacity: 1;
    }
    .photo-card .action-menu .btn {
        padding: 2px 8px;
        font-size: 0.7rem;
        border-radius: 6px;
        background: rgba(255,255,255,0.9);
        border: 1px solid #ddd;
    }
    .photo-card .action-menu .btn:hover {
        background: #fff;
    }
    .upload-zone {
        border: 2px dashed #ced4da;
        border-radius: 12px;
        padding: 40px;
        text-align: center;
        transition: all 0.2s;
        cursor: pointer;
    }
    .upload-zone:hover {
        border-color: #0d6efd;
        background: #f8f9fa;
    }
    .upload-zone.dragover {
        border-color: #0d6efd;
        background: #e7f3ff;
    }
    .upload-preview {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 12px;
    }
    .upload-preview .preview-item {
        position: relative;
        width: 100px;
        height: 100px;
        border-radius: 8px;
        overflow: hidden;
        border: 1px solid #ddd;
    }
    .upload-preview .preview-item img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }
    .upload-preview .preview-item .remove-btn {
        position: absolute;
        top: -6px;
        right: -6px;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: #dc3545;
        color: white;
        border: none;
        font-size: 12px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .photo-checkbox {
        position: absolute;
        top: 8px;
        left: 8px;
        z-index: 2;
        width: 18px;
        height: 18px;
        cursor: pointer;
    }
    .photo-card.selected {
        border: 2px solid #0d6efd;
        box-shadow: 0 0 0 2px rgba(13, 110, 253, 0.25);
    }
    .loading-spinner {
        display: flex;
        justify-content: center;
        padding: 40px;
        color: #6c757d;
    }
</style>
{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="bi bi-images me-2"></i><span data-i18n="training_photos_management">培训照片管理</span></h2>
        <div>
            <button class="btn btn-success me-2" data-bs-toggle="modal" data-bs-target="#uploadModal">
                <i class="bi bi-upload"></i> <span data-i18n="upload_photos">上传照片</span>
            </button>
            <button class="btn btn-danger" id="batchDeleteBtn" style="display: none;">
                <i class="bi bi-trash"></i> <span data-i18n="delete_selected">删除选中</span>
            </button>
        </div>
    </div>

    <!-- 筛选栏 -->
    <div class="card mb-4">
        <div class="card-body">
            <div class="row g-3">
                <div class="col-md-3">
                    <label class="form-label fw-small"><span data-i18n="training">培训</span></label>
                    <input type="text" id="filterTraining" class="form-control" 
                           placeholder="搜索培训名称..." data-i18n-placeholder="placeholder_training_name">
                </div>
                <div class="col-md-2">
                    <label class="form-label fw-small"><span data-i18n="country">国家</span></label>
                    <input type="text" id="filterCountry" class="form-control" list="countryDatalist"
                           placeholder="国家" data-i18n-placeholder="placeholder_country">
                    <datalist id="countryDatalist"></datalist>
                </div>
                <div class="col-md-2">
                    <label class="form-label fw-small"><span data-i18n="training_id">培训ID</span></label>
                    <input type="number" id="filterTrainingId" class="form-control" placeholder="培训ID">
                </div>
                <div class="col-md-2 d-flex align-items-end">
                    <button id="searchBtn" class="btn btn-primary w-100"><span data-i18n="search">搜索</span></button>
                </div>
                <div class="col-md-3 d-flex align-items-end">
                    <button id="resetBtn" class="btn btn-outline-secondary w-100"><span data-i18n="reset">重置</span></button>
                </div>
            </div>
        </div>
    </div>

    <!-- 照片网格 -->
    <div id="photoGridContainer">
        <div class="loading-spinner">
            <div class="spinner-border text-primary me-2" role="status"></div>
            <span data-i18n="loading">加载中...</span>
        </div>
    </div>

    <!-- 分页 -->
    <nav class="mt-4">
        <ul class="pagination justify-content-center" id="pagination"></ul>
    </nav>
</div>

<!-- 上传模态框 -->
<div class="modal fade" id="uploadModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title"><i class="bi bi-upload me-2"></i><span data-i18n="upload_photos">上传照片</span></h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label fw-bold"><span data-i18n="training">培训</span> *</label>
                    <input type="text" id="uploadTrainingSearch" class="form-control" 
                           placeholder="搜索并选择培训..." data-i18n-placeholder="placeholder_training_name">
                    <input type="hidden" id="uploadTrainingId">
                    <input type="hidden" id="uploadTrainingName">
                    <input type="hidden" id="uploadTrainingCountry">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold"><span data-i18n="exam_name">考试（可选）</span></label>
                    <input type="text" id="uploadExamSearch" class="form-control" 
                           placeholder="搜索并选择考试..." data-i18n-placeholder="placeholder_exam_name">
                    <input type="hidden" id="uploadExamId">
                    <input type="hidden" id="uploadExamName">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold"><span data-i18n="photos">照片</span> *</label>
                    <div class="upload-zone" id="uploadZone">
                        <i class="bi bi-image" style="font-size: 2.5rem; color: #6c757d;"></i>
                        <p class="mt-2"><span data-i18n="drag_drop_photos_here">拖拽照片到这里，或点击选择</span></p>
                        <p class="text-muted small"><span data-i18n="max_20_photos">最多20张，每张不超过10MB</span></p>
                        <input type="file" id="fileInput" multiple accept="image/*" style="display: none;">
                    </div>
                    <div class="upload-preview" id="uploadPreview"></div>
                </div>
                <div class="mb-3" id="descriptionArea" style="display: none;">
                    <label class="form-label"><span data-i18n="photo_descriptions">照片描述（可选）</span></label>
                    <div id="descriptionInputs"></div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal"><span data-i18n="cancel">取消</span></button>
                <button type="button" class="btn btn-primary" id="uploadBtn" disabled>
                    <span data-i18n="upload">上传</span>
                </button>
            </div>
        </div>
    </div>
</div>

<!-- 重命名模态框 -->
<div class="modal fade" id="renameModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title"><span data-i18n="rename_photo">重命名照片</span></h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="renamePhotoId">
                <div class="mb-3">
                    <label class="form-label"><span data-i18n="file_name">文件名</span></label>
                    <input type="text" id="renameFileName" class="form-control">
                </div>
                <div class="mb-3">
                    <label class="form-label"><span data-i18n="description">描述</span></label>
                    <textarea id="renameDescription" class="form-control" rows="2"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal"><span data-i18n="cancel">取消</span></button>
                <button type="button" class="btn btn-primary" id="renameConfirmBtn"><span data-i18n="save">保存</span></button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    // ==================== 照片管理页面 JavaScript ====================

    let currentPage = 1;
    let perPage = 24;
    let selectedPhotos = new Set();
    let photoData = [];

    // ==================== 加载照片列表 ====================
    async function loadPhotos(page = 1) {
        currentPage = page;
        const container = document.getElementById('photoGridContainer');
        container.innerHTML = `
            <div class="loading-spinner">
                <div class="spinner-border text-primary me-2" role="status"></div>
                <span>${t('loading')}</span>
            </div>
        `;
        
        const params = new URLSearchParams({
            page: page,
            per_page: perPage,
            training_id: document.getElementById('filterTrainingId').value || '',
            country: document.getElementById('filterCountry').value || ''
        });
        
        const trainingSearch = document.getElementById('filterTraining').value.trim();
        if (trainingSearch) {
            params.append('training_name', trainingSearch);
        }
        
        try {
            const res = await fetch(`/api/admin/training/photos?${params}`);
            const data = await res.json();
            
            if (data.success) {
                photoData = data.data || [];
                renderPhotos(photoData);
                renderPagination(data.total, data.page, data.per_page);
            } else {
                container.innerHTML = `<div class="alert alert-danger">${data.message || t('load_failed')}</div>`;
            }
        } catch (err) {
            console.error('加载照片失败:', err);
            container.innerHTML = `<div class="alert alert-danger">${t('load_failed')}</div>`;
        }
    }

    // ==================== 渲染照片网格 ====================
    function renderPhotos(photos) {
        const container = document.getElementById('photoGridContainer');
        
        if (!photos || photos.length === 0) {
            container.innerHTML = `
                <div class="text-center py-5 text-muted">
                    <i class="bi bi-images" style="font-size: 3rem; display: block; margin-bottom: 12px;"></i>
                    <p>${t('no_photos_uploaded')}</p>
                </div>
            `;
            return;
        }
        
        let html = '<div class="photo-grid">';
        photos.forEach(photo => {
            const isSelected = selectedPhotos.has(photo.id);
            const isCover = photo.is_cover;
            const uploadedAt = photo.uploaded_at ? new Date(photo.uploaded_at).toLocaleString() : '';
            const uploadedBy = photo.uploaded_by_name || '系统';
            
            html += `
                <div class="photo-card ${isSelected ? 'selected' : ''}" data-id="${photo.id}">
                    ${isCover ? '<span class="cover-badge">📌 封面</span>' : ''}
                    <input type="checkbox" class="photo-checkbox" data-id="${photo.id}" ${isSelected ? 'checked' : ''}>
                    <img src="${photo.photo_url}" alt="${photo.file_name}" loading="lazy" 
                        onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22180%22%3E%3Crect fill=%22%23f0f0f0%22 width=%22200%22 height=%22180%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 text-anchor=%22middle%22 dy=%22.3em%22 fill=%22%23999%22 font-size=%2214%22%3E图片加载失败%3C/text%3E%3C/svg%3E'">
                    <div class="photo-info">
                        <div class="file-name" title="${photo.file_name}">${photo.file_name}</div>
                        <div class="meta">
                            <span>📁 ${photo.training_name || '-'}</span>
                            <span class="ms-2">📅 ${uploadedAt}</span>
                        </div>
                        <div class="meta">
                            <span>👤 ${uploadedBy}</span>
                            ${photo.photo_description ? `<span class="ms-2">💬 ${photo.photo_description}</span>` : ''}
                        </div>
                    </div>
                    <div class="action-menu">
                        ${!isCover ? `<button class="btn btn-sm btn-success set-cover-btn" data-id="${photo.id}" title="${t('set_as_cover')}">📌</button>` : ''}
                        <button class="btn btn-sm btn-primary rename-btn" data-id="${photo.id}" title="${t('rename')}">✏️</button>
                        <button class="btn btn-sm btn-danger delete-btn" data-id="${photo.id}" title="${t('delete')}">🗑️</button>
                    </div>
                </div>
            `;
        });
        html += '</div>';
        container.innerHTML = html;
        
        // 绑定事件
        bindPhotoEvents();
    }

    // ==================== 绑定照片事件 ====================
    function bindPhotoEvents() {
        // 复选框事件
        document.querySelectorAll('.photo-checkbox').forEach(cb => {
            cb.addEventListener('change', function() {
                const id = parseInt(this.dataset.id);
                if (this.checked) {
                    selectedPhotos.add(id);
                    this.closest('.photo-card').classList.add('selected');
                } else {
                    selectedPhotos.delete(id);
                    this.closest('.photo-card').classList.remove('selected');
                }
                updateBatchDeleteBtn();
            });
        });
        
        // 设为封面
        document.querySelectorAll('.set-cover-btn').forEach(btn => {
            btn.addEventListener('click', async function() {
                const id = parseInt(this.dataset.id);
                if (!confirm(t('confirm_set_cover'))) return;
                
                try {
                    const res = await fetch(`/api/admin/training/photos/${id}/cover`, { method: 'PUT' });
                    const data = await res.json();
                    if (data.success) {
                        showToast(t('cover_set_success'), 'success');
                        loadPhotos(currentPage);
                    } else {
                        showToast(data.message, 'error');
                    }
                } catch (err) {
                    console.error('设置封面失败:', err);
                    showToast(t('operation_failed'), 'error');
                }
            });
        });
        
        // 重命名
        document.querySelectorAll('.rename-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const id = parseInt(this.dataset.id);
                const photo = photoData.find(p => p.id === id);
                if (photo) {
                    document.getElementById('renamePhotoId').value = id;
                    document.getElementById('renameFileName').value = photo.file_name;
                    document.getElementById('renameDescription').value = photo.photo_description || '';
                    new bootstrap.Modal(document.getElementById('renameModal')).show();
                }
            });
        });
        
        // 删除
        document.querySelectorAll('.delete-btn').forEach(btn => {
            btn.addEventListener('click', async function() {
                const id = parseInt(this.dataset.id);
                const photo = photoData.find(p => p.id === id);
                if (!confirm(t('confirm_delete_photo', photo?.file_name || ''))) return;
                
                try {
                    const res = await fetch(`/api/admin/training/photos/${id}`, { method: 'DELETE' });
                    const data = await res.json();
                    if (data.success) {
                        showToast(t('photo_deleted'), 'success');
                        selectedPhotos.delete(id);
                        loadPhotos(currentPage);
                    } else {
                        showToast(data.message, 'error');
                    }
                } catch (err) {
                    console.error('删除失败:', err);
                    showToast(t('operation_failed'), 'error');
                }
            });
        });
    }

    // ==================== 批量删除 ====================
    document.getElementById('batchDeleteBtn')?.addEventListener('click', async function() {
        const ids = Array.from(selectedPhotos);
        if (ids.length === 0) return;
        
        if (!confirm(t('confirm_batch_delete_photos', ids.length))) return;
        
        try {
            const res = await fetch('/api/admin/training/photos/batch_delete', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ ids: ids })
            });
            const data = await res.json();
            if (data.success) {
                showToast(t('batch_delete_success', data.success_count), 'success');
                selectedPhotos.clear();
                updateBatchDeleteBtn();
                loadPhotos(currentPage);
            } else {
                showToast(data.message || t('operation_failed'), 'error');
            }
        } catch (err) {
            console.error('批量删除失败:', err);
            showToast(t('operation_failed'), 'error');
        }
    });

    function updateBatchDeleteBtn() {
        const btn = document.getElementById('batchDeleteBtn');
        if (btn) {
            if (selectedPhotos.size > 0) {
                btn.style.display = 'inline-block';
                btn.innerHTML = `<i class="bi bi-trash"></i> ${t('delete_selected')} (${selectedPhotos.size})`;
            } else {
                btn.style.display = 'none';
            }
        }
    }

    // ==================== 分页 ====================
    function renderPagination(total, page, perPage) {
        const totalPages = Math.ceil(total / perPage);
        const pagination = document.getElementById('pagination');
        if (totalPages <= 1) {
            pagination.innerHTML = '';
            return;
        }
        
        let html = '';
        // 上一页
        if (page > 1) {
            html += `<li class="page-item"><a class="page-link" href="#" data-page="${page - 1}">«</a></li>`;
        }
        for (let i = 1; i <= totalPages; i++) {
            html += `<li class="page-item ${i === page ? 'active' : ''}">
                        <a class="page-link" href="#" data-page="${i}">${i}</a>
                    </li>`;
        }
        if (page < totalPages) {
            html += `<li class="page-item"><a class="page-link" href="#" data-page="${page + 1}">»</a></li>`;
        }
        pagination.innerHTML = html;
        
        pagination.querySelectorAll('.page-link').forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                const pageNum = parseInt(link.dataset.page);
                if (!isNaN(pageNum)) loadPhotos(pageNum);
            });
        });
    }

    // ==================== 搜索 ====================
    document.getElementById('searchBtn')?.addEventListener('click', () => {
        selectedPhotos.clear();
        updateBatchDeleteBtn();
        loadPhotos(1);
    });

    document.getElementById('resetBtn')?.addEventListener('click', () => {
        document.getElementById('filterTraining').value = '';
        document.getElementById('filterCountry').value = '';
        document.getElementById('filterTrainingId').value = '';
        selectedPhotos.clear();
        updateBatchDeleteBtn();
        loadPhotos(1);
    });

    // ==================== 上传功能 ====================
    const uploadZone = document.getElementById('uploadZone');
    const fileInput = document.getElementById('fileInput');
    let selectedFiles = [];

    uploadZone?.addEventListener('click', () => fileInput?.click());

    uploadZone?.addEventListener('dragover', (e) => {
        e.preventDefault();
        uploadZone.classList.add('dragover');
    });

    uploadZone?.addEventListener('dragleave', () => {
        uploadZone.classList.remove('dragover');
    });

    uploadZone?.addEventListener('drop', (e) => {
        e.preventDefault();
        uploadZone.classList.remove('dragover');
        if (e.dataTransfer.files) {
            handleFiles(e.dataTransfer.files);
        }
    });

    fileInput?.addEventListener('change', function() {
        if (this.files) {
            handleFiles(this.files);
        }
    });

    function handleFiles(files) {
        const maxFiles = 20;
        const remaining = maxFiles - selectedFiles.length;
        
        for (let i = 0; i < Math.min(files.length, remaining); i++) {
            const file = files[i];
            if (file.type.startsWith('image/')) {
                selectedFiles.push(file);
            }
        }
        
        renderPreview();
        updateUploadBtn();
    }

    function renderPreview() {
        const container = document.getElementById('uploadPreview');
        container.innerHTML = '';
        
        selectedFiles.forEach((file, index) => {
            const reader = new FileReader();
            reader.onload = (e) => {
                const div = document.createElement('div');
                div.className = 'preview-item';
                div.innerHTML = `
                    <img src="${e.target.result}" alt="${file.name}">
                    <button class="remove-btn" data-index="${index}">×</button>
                `;
                div.querySelector('.remove-btn').addEventListener('click', () => {
                    selectedFiles.splice(index, 1);
                    renderPreview();
                    updateUploadBtn();
                });
                container.appendChild(div);
            };
            reader.readAsDataURL(file);
        });
        
        // 显示描述输入区
        const descArea = document.getElementById('descriptionArea');
        if (selectedFiles.length > 0) {
            descArea.style.display = 'block';
            const descContainer = document.getElementById('descriptionInputs');
            descContainer.innerHTML = selectedFiles.map((file, i) => `
                <div class="mb-2">
                    <label class="form-label small">${file.name}</label>
                    <input type="text" class="form-control form-control-sm" 
                        placeholder="描述..." data-index="${i}">
                </div>
            `).join('');
        } else {
            descArea.style.display = 'none';
        }
    }

    function updateUploadBtn() {
        const btn = document.getElementById('uploadBtn');
        const trainingId = document.getElementById('uploadTrainingId').value;
        btn.disabled = !(selectedFiles.length > 0 && trainingId);
    }

    // ==================== 培训搜索（上传模态框） ====================
    const uploadTrainingSearch = document.getElementById('uploadTrainingSearch');
    let trainingSearchTimeout;

    uploadTrainingSearch?.addEventListener('input', function() {
        clearTimeout(trainingSearchTimeout);
        const q = this.value.trim();
        if (q.length < 2) return;
        
        trainingSearchTimeout = setTimeout(async () => {
            try {
                const res = await fetch(`/api/search/trainings?q=${encodeURIComponent(q)}&per_page=10`);
                const data = await res.json();
                const trainings = Array.isArray(data) ? data : (data.data || []);
                
                // 显示下拉建议（简单的 datalist 方式）
                const datalist = document.getElementById('trainingDatalist');
                if (!datalist) {
                    const dl = document.createElement('datalist');
                    dl.id = 'trainingDatalist';
                    uploadTrainingSearch.setAttribute('list', 'trainingDatalist');
                    document.body.appendChild(dl);
                }
                const dl = document.getElementById('trainingDatalist');
                dl.innerHTML = trainings.map(t => 
                    `<option value="${t.name}" data-id="${t.id}" data-country="${t.country || ''}">`
                ).join('');
            } catch (err) {
                console.error('搜索培训失败:', err);
            }
        }, 300);
    });

    uploadTrainingSearch?.addEventListener('change', function() {
        const selected = document.querySelector(`#trainingDatalist option[value="${this.value}"]`);
        if (selected) {
            document.getElementById('uploadTrainingId').value = selected.dataset.id;
            document.getElementById('uploadTrainingName').value = this.value;
            document.getElementById('uploadTrainingCountry').value = selected.dataset.country || '';
            updateUploadBtn();
        }
    });

    // ==================== 考试搜索（上传模态框） ====================
    const uploadExamSearch = document.getElementById('uploadExamSearch');
    let examSearchTimeout;

    uploadExamSearch?.addEventListener('input', function() {
        clearTimeout(examSearchTimeout);
        const q = this.value.trim();
        if (q.length < 2) return;
        
        examSearchTimeout = setTimeout(async () => {
            try {
                const res = await fetch(`/api/search/exams?q=${encodeURIComponent(q)}`);
                const data = await res.json();
                const exams = Array.isArray(data) ? data : [];
                
                const datalist = document.getElementById('examDatalist');
                if (!datalist) {
                    const dl = document.createElement('datalist');
                    dl.id = 'examDatalist';
                    uploadExamSearch.setAttribute('list', 'examDatalist');
                    document.body.appendChild(dl);
                }
                const dl = document.getElementById('examDatalist');
                dl.innerHTML = exams.map(e => 
                    `<option value="${e}" data-id="${e.id}">`
                ).join('');
            } catch (err) {
                console.error('搜索考试失败:', err);
            }
        }, 300);
    });

    uploadExamSearch?.addEventListener('change', function() {
        const selected = document.querySelector(`#examDatalist option[value="${this.value}"]`);
        if (selected) {
            document.getElementById('uploadExamId').value = selected.dataset.id;
            document.getElementById('uploadExamName').value = this.value;
        }
    });

    // ==================== 上传确认 ====================
    document.getElementById('uploadBtn')?.addEventListener('click', async function() {
        const trainingId = document.getElementById('uploadTrainingId').value;
        const trainingName = document.getElementById('uploadTrainingName').value;
        const trainingCountry = document.getElementById('uploadTrainingCountry').value;
        const examId = document.getElementById('uploadExamId').value;
        const examName = document.getElementById('uploadExamName').value;
        
        if (!trainingId || !trainingName) {
            showToast(t('please_select_training'), 'warning');
            return;
        }
        
        if (selectedFiles.length === 0) {
            showToast(t('please_select_photos'), 'warning');
            return;
        }
        
        // 收集描述
        const descInputs = document.querySelectorAll('#descriptionInputs input');
        const descriptions = Array.from(descInputs).map(el => el.value.trim());
        
        const formData = new FormData();
        formData.append('training_id', trainingId);
        formData.append('training_name', trainingName);
        formData.append('training_country', trainingCountry);
        if (examId) formData.append('exam_id', examId);
        if (examName) formData.append('exam_name', examName);
        formData.append('descriptions', JSON.stringify(descriptions));
        
        selectedFiles.forEach(file => {
            formData.append('photos', file);
        });
        
        this.disabled = true;
        this.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>' + t('uploading');
        
        try {
            const res = await fetch('/api/admin/training/photos', {
                method: 'POST',
                body: formData
            });
            const data = await res.json();
            
            if (data.success) {
                showToast(t('upload_success', data.uploaded_count), 'success');
                if (data.errors && data.errors.length > 0) {
                    console.warn('上传警告:', data.errors);
                }
                // 关闭模态框
                bootstrap.Modal.getInstance(document.getElementById('uploadModal')).hide();
                // 重置状态
                selectedFiles = [];
                renderPreview();
                document.getElementById('uploadTrainingId').value = '';
                document.getElementById('uploadTrainingName').value = '';
                document.getElementById('uploadTrainingSearch').value = '';
                document.getElementById('uploadExamId').value = '';
                document.getElementById('uploadExamName').value = '';
                document.getElementById('uploadExamSearch').value = '';
                updateUploadBtn();
                // 刷新列表
                loadPhotos(1);
            } else {
                showToast(data.message || t('upload_failed'), 'error');
            }
        } catch (err) {
            console.error('上传失败:', err);
            showToast(t('upload_failed'), 'error');
        } finally {
            this.disabled = false;
            this.innerHTML = `<span data-i18n="upload">${t('upload')}</span>`;
        }
    });

    // ==================== 重命名确认 ====================
    document.getElementById('renameConfirmBtn')?.addEventListener('click', async function() {
        const id = parseInt(document.getElementById('renamePhotoId').value);
        const fileName = document.getElementById('renameFileName').value.trim();
        const description = document.getElementById('renameDescription').value.trim();
        
        if (!fileName) {
            showToast(t('file_name_required'), 'warning');
            return;
        }
        
        try {
            const res = await fetch(`/api/admin/training/photos/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    file_name: fileName,
                    photo_description: description
                })
            });
            const data = await res.json();
            if (data.success) {
                showToast(t('update_success'), 'success');
                bootstrap.Modal.getInstance(document.getElementById('renameModal')).hide();
                loadPhotos(currentPage);
            } else {
                showToast(data.message || t('operation_failed'), 'error');
            }
        } catch (err) {
            console.error('更新失败:', err);
            showToast(t('operation_failed'), 'error');
        }
    });

    // ==================== 初始化 ====================
    document.addEventListener('DOMContentLoaded', async () => {
        await waitForI18n();
        if (window.i18n) window.i18n.applyTranslations();
        
        // 加载国家列表
        try {
            const res = await fetch('/api/admin/export/recent_countries');
            const countries = await res.json();
            const datalist = document.getElementById('countryDatalist');
            if (datalist) {
                datalist.innerHTML = countries.map(c => 
                    `<option value="${c.code}" data-zh="${c.name_zh}" data-en="${c.name_en}">`
                ).join('');
            }
        } catch (err) {
            console.error('加载国家列表失败:', err);
        }
        
        loadPhotos(1);
    });

    // 监听语言切换
    window.addEventListener('app:languageChanged', () => {
        if (window.i18n) window.i18n.applyTranslations();
        // 重新渲染当前页
        if (photoData.length > 0) renderPhotos(photoData);
    });

</script>
{% endblock %}
