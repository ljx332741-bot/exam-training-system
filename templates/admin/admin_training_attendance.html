<!-- templates/admin/admin_training_attendance.html -->
{% extends "base.html" %}
{% block title %}培训签到详情{% endblock %}

{% block content %}

<style media="print">
    /* ========== 打印全局设置 ========== */
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    
    body {
        font-family: 'Microsoft YaHei', 'SimHei', 'PingFang SC', sans-serif;
        font-size: 10pt;
        padding: 0;
        margin: 0;
    }
    
    /* 隐藏不需要打印的元素 */
    .no-print, 
    .navbar, 
    footer, 
    .btn, 
    button,
    .print-hide,
    #selectAll,
    .attendance-checkbox,
    .d-flex.justify-content-end,
    .dropdown,
    nav,
    .card-footer,
    .pagination,
    [class*="btn"],
    .country-cell {
        display: none !important;
    }
    
    /* 卡片样式重置 */
    .card {
        border: none !important;
        box-shadow: none !important;
        margin: 0 !important;
        padding: 0 !important;
    }
    
    .card-body {
        padding: 0 !important;
    }
    
    .container-fluid {
        padding: 0 !important;
        margin: 0 !important;
    }
    
    /* ========== 标题样式 ========== */
    h2 {
        font-size: 14pt;
        font-weight: bold;
        text-align: center;
        margin-bottom: 15px;
        display: block !important;
    }
    
    /* ========== 表头信息两列布局 ========== */
    #headerInfo .row {
        border: 1px solid #000;
        border-collapse: collapse;
        margin-bottom: 15px;
    }
    #headerInfo .row > .col-md-6 {
        border: 1px solid #000;
        padding: 4px 6px;
        font-size: 10pt;
        word-break: break-word;
    }

    #headerInfo .col-md-6:nth-child(odd) {
        clear: left;
    }
    
    #headerInfo .row::after {
        content: "";
        display: table;
        clear: both;
    }
    
    #headerInfo hr {
        display: none;
    }
    
    /* ========== 页面边距设置 ========== */
    @page {
        size: A4;
        margin: 2.5cm 1.5cm 2.5cm 1.5cm;
    }
    
    /* 页眉页脚通过 JS 动态注入 */
    #dynamicPrintStyles {
        display: none;
    }
    
    /* ========== 签到表格样式 ========== */
    .table {
        width: 100% !important;
        border-collapse: collapse !important;
        table-layout: fixed !important;
        font-size: 9pt;
    }
    
    .table-bordered,
    .table-bordered th,
    .table-bordered td {
        border: 1px solid #000 !important;
    }
    
    .table thead th {
        background-color: #f0f0f0 !important;
        font-weight: bold;
        text-align: center;
    }
    
    /* 打印时只保留可见列 */
    .table th:nth-child(1),
    .table td:nth-child(1) {
        display: none !important;
    }
    
    .table th:nth-child(6),
    .table td:nth-child(6) {
        display: none !important;
    }
    
    .table th:nth-child(7),
    .table td:nth-child(7) {
        display: none !important;
    }
    
    .table th:nth-child(8),
    .table td:nth-child(8) {
        display: none !important;
    }
    
    .table th:nth-child(2),
    .table td:nth-child(2) {
        width: 8% !important;
    }
    
    .table th:nth-child(3),
    .table td:nth-child(3) {
        width: 34% !important;
    }
    
    .table th:nth-child(4),
    .table td:nth-child(4) {
        width: 30% !important;
    }
    
    .table th:nth-child(5),
    .table td:nth-child(5) {
        width: 28% !important;
    }
    
    .table td, 
    .table th {
        padding: 6px 8px;
        vertical-align: middle;
        word-break: break-word;
    }
    
    .table td:nth-child(2),
    .table th:nth-child(2) {
        text-align: center;
    }
    
    .table td img {
        max-width: 100px;
        max-height: 45px;
        object-fit: contain;
    }
    
    .text-warning {
        color: #856404 !important;
        font-style: italic;
    }
    
    /* ========== 分页控制 ========== */
    .table tr {
        page-break-inside: avoid !important;
        page-break-after: auto !important;
    }
    
    .table thead {
        display: table-header-group;
    }
    
    h2, #headerInfo {
        page-break-after: avoid;
    }
    
    /* ============================================================
    加载动画样式
    ============================================================ */
    .table-responsive {
        position: relative;
        min-height: 200px;
    }
    
    #loadingOverlay {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(255, 255, 255, 0.92);
        backdrop-filter: blur(3px);
        -webkit-backdrop-filter: blur(3px);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 100;
        border-radius: 8px;
    }
    
    #loadingOverlay .spinner-border {
        width: 1.8rem;
        height: 1.8rem;
    }
    
    #loadingOverlay .text-muted {
        font-size: 0.85rem;
        text-align: center;
        max-width: 90%;
        margin-top: 10px;
    }
    .loading-dots {
        display: inline-block;
        font-size: 1.2rem;
        letter-spacing: 4px;
    }

    .loading-dots::after {
        content: '...';
        animation: dots 1.5s steps(3) infinite;
    }

    @keyframes dots {
        0% { content: ''; }
        33% { content: '.'; }
        66% { content: '..'; }
        100% { content: '...'; }
    }

    .loading-dots-alt {
        display: inline-flex;
        gap: 6px;
        align-items: center;
    }

    .loading-dots-alt span {
        width: 8px;
        height: 8px;
        background: #0d6efd;
        border-radius: 50%;
        animation: dotPulse 1.2s ease-in-out infinite;
    }

    .loading-dots-alt span:nth-child(2) {
        animation-delay: 0.2s;
    }

    .loading-dots-alt span:nth-child(3) {
        animation-delay: 0.4s;
    }

    @keyframes dotPulse {
        0%, 80%, 100% {
            transform: scale(0.6);
            opacity: 0.4;
        }
        40% {
            transform: scale(1);
            opacity: 1;
        }
    }
</style>

<!-- 动态打印样式（由 JavaScript 注入） -->
<style id="dynamicPrintStyles" media="print"></style>

<div class="container-fluid">
    <div class="mb-4">
        <h2 class="mb-2" id="attendanceTitle"><i class="bi bi-people-fill"></i> <span data-i18n="training_attendance_record">培训签到表</span></h2>
        <div class="d-flex justify-content-end gap-2 no-print align-items-center flex-wrap">
            <!-- 页眉页脚控制复选框 -->
            <div class="form-check form-switch me-2">
                <input class="form-check-input" type="checkbox" id="showPrintHeaderFooter" checked>
                <label class="form-check-label" for="showPrintHeaderFooter" style="font-size: 0.85rem;">
                    <span data-i18n="show_header_footer">显示页眉页脚</span>
                </label>
            </div>
            <button class="btn btn-primary" onclick="window.print();">
                <i class="bi bi-printer"></i> <span data-i18n="print">打印</span>
            </button>
            <a id="pdfExportBtn" class="btn btn-success" href="#" target="_blank">
                <i class="bi bi-download"></i> <span data-i18n="expert_pdf">PDF导出</span>
            </a>
            <button class="btn btn-sm btn-outline-secondary" id="backButton">
                <i class="bi bi-arrow-left me-1"></i> <span data-i18n="back">返回</span>
            </button>
        </div>
    </div>

    <div class="card shadow-sm" id="printArea">
        <div class="card-body">
            <div class="mb-4" id="headerInfo">
                <!-- 动态加载表头信息 -->
            </div>
            <div class="table-responsive">
                <table class="table table-bordered align-middle">
                    <thead class="table-light">
                        <tr>
                            <th class="no-print" style="width: 5%;"><input type="checkbox" id="selectAll"></th>
                            <th style="width: 5%;">序号No</th>
                            <th style="width: 30%;">部门/合作伙伴（双语）Department/Partner</th>
                            <th style="width: 20%;">姓名+工号Name + Employee ID</th>
                            <th style="width: 20%;">签名Signature</th>
                            <th class="print-hide" style="width: 10%;" data-i18n="sign_in_period">签到时间</th>
                            <th class="print-hide" style="width: 5%;" data-i18n="country">国家</th>
                            <th class="print-hide" style="width: 5%;" data-i18n="actions">操作</th>
                        </tr>
                    </thead>
                    <tbody id="attendanceTbody">
                        <tr><td colspan="8" class="text-center"><span data-i18n="loading">加载中...</span></td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

{% endblock %}

{% block extra_js %}
<script>
    const trainingId = {{ request.view_args.get('training_id') }};
    
    // ============================================================
    // 权限管理
    // ============================================================
    let allowedCountries = null;
    let permissionsLoaded = false;

    async function fetchUserPermissions() {
        if (permissionsLoaded) return;
        try {
            const res = await fetch('/api/admin/current_user_permissions');
            if (res.ok) {
                const data = await res.json();
                allowedCountries = data.allowed_countries || null;
                console.log('📋 用户权限范围:', allowedCountries);
            } else {
                allowedCountries = null;
            }
        } catch (err) {
            console.warn('获取用户权限失败:', err);
            allowedCountries = null;
        }
        permissionsLoaded = true;
    }

    // ============================================================
    // 打印页眉页脚动态控制（支持双语 + 左右分栏）
    // ============================================================
    
    /**
     * 获取当前语言对应的页眉页脚文本
     */
    function getPrintHeaderFooterTexts(lang) {
        if (lang === 'en') {
            return {
                headerLeft: 'ZTE',
                headerRight: 'Internal Use▲',
                footerLeft: 'All rights reserved. No distribution without prior permission of ZTE.',
                footerRight: 'Page'
            };
        } else {
            // 中文（默认）
            return {
                headerLeft: 'ZTE中兴',
                headerRight: '内部使用▲',
                footerLeft: '以上所有信息均为中兴通讯股份有限公司所有，不得外传',
                footerRight: '页码'
            };
        }
    }

    /**
     * 更新打印页眉页脚样式（动态注入 CSS）
     * 使用 @top-left, @top-right, @bottom-left, @bottom-right 实现左右分栏
     */
    function updatePrintHeaderFooterStyles() {
        const lang = window.i18n?.currentLang || 'zh';
        const showHeaderFooter = localStorage.getItem('show_print_header_footer') !== 'false';
        
        // 获取文本
        const texts = getPrintHeaderFooterTexts(lang);
        
        // 构建 CSS 内容 - 使用 @top-left 和 @top-right 实现左右分栏
        // 使用 content 的字符串拼接来实现隐藏控制
        const cssContent = `
            @page {
                /* 页眉 - 左 */
                @top-left {
                    content: ${showHeaderFooter ? `"${texts.headerLeft}"` : '""'};
                    font-size: 9pt;
                    font-weight: bold;
                    border-bottom: 1px solid #ccc;
                    padding-bottom: 6px;
                    padding-left: 1cm;   /* 左侧内边距 1cm */
                }
                
                /* 页眉 - 右 */
                @top-right {
                    content: ${showHeaderFooter ? `"${texts.headerRight}"` : '""'};
                    font-size: 9pt;
                    font-weight: bold;
                    border-bottom: 1px solid #ccc;
                    padding-bottom: 6px;
                    padding-right: 1cm;  /* 右侧内边距 1cm */
                }
                
                /* 页眉 - 中间（占位，保持边框连续） */
                @top-center {
                    content: ${showHeaderFooter ? '""' : '""'};
                    border-bottom: ${showHeaderFooter ? '1px solid #ccc' : 'none'};
                    padding-bottom: 6px;
                }
                
                /* 页脚 - 左 */
                @bottom-left {
                    content: ${showHeaderFooter ? `"${texts.footerLeft}"` : '""'};
                    font-size: 8pt;
                    color: #666;
                    border-top: ${showHeaderFooter ? '1px solid #ccc' : 'none'};
                    padding-top: 6px;
                    padding-left: 1cm;   /* 左侧内边距 1cm */
                }
                
                /* 页脚 - 右（包含页码） */
                @bottom-right {
                    content: ${showHeaderFooter ? `"${texts.footerRight} " counter(page) " / " counter(pages) ""` : '""'};
                    font-size: 8pt;
                    color: #666;
                    border-top: ${showHeaderFooter ? '1px solid #ccc' : 'none'};
                    padding-top: 6px;
                    padding-right: 1cm;  /* 右侧内边距 1cm */
                }
                
                /* 页脚 - 中间（占位，保持边框连续） */
                @bottom-center {
                    content: ${showHeaderFooter ? '""' : '""'};
                    border-top: ${showHeaderFooter ? '1px solid #ccc' : 'none'};
                    padding-top: 6px;
                }
            }
        `;
        
        // 注入或更新样式
        let styleEl = document.getElementById('dynamicPrintStyles');
        if (!styleEl) {
            styleEl = document.createElement('style');
            styleEl.id = 'dynamicPrintStyles';
            styleEl.media = 'print';
            document.head.appendChild(styleEl);
        }
        styleEl.textContent = cssContent;
        
        console.log('📄 打印页眉页脚已更新:', lang, '显示:', showHeaderFooter);
    }

    /**
     * 更新页眉页脚显示状态（复选框控制）
     */
    function updatePrintHeaderFooterVisibility(show) {
        localStorage.setItem('show_print_header_footer', String(show));
        updatePrintHeaderFooterStyles();
    }

    // ============================================================
    // 签到签字详情 - 带加载动画
    // ============================================================
    async function loadDetail() {
        showLoadingState('正在加载签到数据...');
        
        await fetchUserPermissions();

        const urlParams = new URLSearchParams(window.location.search);
        let country = urlParams.get('country');
        if (!country || country === 'null' || country === 'undefined') {
            country = '';
        }
        
        if (country && allowedCountries !== null && Array.isArray(allowedCountries) && !allowedCountries.includes(country)) {
            if (typeof showToast === 'function') {
                showToast('您没有权限查看该国家的签到记录', 'warning');
            } else {
                alert('您没有权限查看该国家的签到记录');
            }
            const newUrl = window.location.pathname;
            window.history.replaceState({}, '', newUrl);
            country = '';
        }
        
        let apiUrl = `/api/training/attendance/${trainingId}`;
        if (country) {
            apiUrl += `?country=${encodeURIComponent(country)}`;
        }
        
        try {
            updateLoadingState(t('retrieving_check_in_data'));
            
            const res = await fetch(apiUrl);
            const data = await res.json();

            if (!data.training) {
                hideLoadingState();
                document.getElementById('attendanceTbody').innerHTML = `<tr><td colspan="8" class="text-center">培训不存在</td></tr>`;
                return;
            }

            updateLoadingState('正在渲染签到列表...');

            const titleElement = document.getElementById('attendanceTitle');
            if (titleElement && data.training.name) {
                titleElement.innerHTML = 
                    '<i class="bi bi-people-fill"></i> 签到表Attendance Record' + 
                    `<span><i class="print-hide badge bg-info ms-2" style="font-size: 0.85rem; margin-top: -4px;">- ${escapeHtml(data.training.name)}</i></span>`;
            }

            const header = data.header_template || {};

            const headerHtml = `
                <div class="row">
                    <div class="col-md-6"><strong>培训课程名称（双语）Training Course Name：</strong> ${escapeHtml(header.course_name || '')}</div>
                    <div class="col-md-6"><strong>项目编号Training Project NO.：</strong> ${escapeHtml(header.project_no || '')}</div>
                    <div class="col-md-6"><strong>培训地点（双语）Training Venue：</strong> ${escapeHtml(header.venue || '')}</div>
                    <div class="col-md-6"><strong>培训语言Language：</strong> ${escapeHtml(header.language || '')}</div>
                    <div class="col-md-6"><strong>培训对象（双语）Target Trainees：</strong> ${escapeHtml(header.target || '')}</div>
                    <div class="col-md-6"><strong>组织部门（双语）Training Organizing Dept：</strong> ${escapeHtml(header.dept || '')}</div>
                    <div class="col-md-6"><strong>组织者Training Organizer：</strong> ${escapeHtml(header.organizer || '')}</div>
                    <div class="col-md-6"><strong>培训日期Training Date：</strong> ${escapeHtml(header.training_date || '')}</div>
                    <div class="col-md-6"><strong>主讲人Course Lecturer：</strong> ${escapeHtml(header.lecturer || '')}</div>
                    <div class="col-md-6"><strong>翻译员Translator：</strong> ${escapeHtml(header.translator || '')}</div>
                </div>
                <hr>
            `;
            document.getElementById('headerInfo').innerHTML = headerHtml;

            const tbody = document.getElementById('attendanceTbody');
            const records = data.attendances || [];
            
            if (records.length === 0) {
                hideLoadingState();
                tbody.innerHTML = `<tr><td colspan="8" class="text-center">暂无签到记录</td></tr>`;
                return;
            }
            
            tbody.innerHTML = '';
            records.forEach((r, idx) => {
                const nameDisplay = r.signed_name || r.name_cn || r.name_en || '';
                const empId = r.employee_id ? ` (${r.employee_id})` : '';
                const signatureCell = r.signature_url
                    ? `<img src="${r.signature_url}" style="max-height:70px; max-width:150px;" onerror="this.style.display='none'">`
                    : `<span class="text-warning fw-bold">待重新签字</span>`;

                const row = tbody.insertRow();
                row.innerHTML = `
                    <td class="no-print"><input type="checkbox" class="attendance-checkbox" data-att-id="${r.id}"></td>
                    <td>${idx+1}</td>
                    <td>${escapeHtml(r.company || '')}</td>
                    <td>${escapeHtml(nameDisplay)}${empId}</td>
                    <td>${signatureCell}</td>
                    <td class="print-hide">${formatLocalTime(r.sign_time)}</td>
                    <td class="country-cell no-print" title="${escapeHtml(r.country)}">${escapeHtml(r.country)}</td>
                    <td class="print-hide">
                        <button class="btn btn-sm btn-outline-warning reset-sign-btn" data-id="${r.id}">
                            <i class="bi bi-pencil-square"></i> ${t('re_signature')}
                        </button>
                        <button class="btn btn-sm btn-outline-danger delete-attendance-btn" data-id="${r.id}" data-name="${escapeHtml(nameDisplay)}">
                            <i class="bi bi-trash"></i> ${t('delete')}
                        </button>
                    </td>
                `;
            });
            
            hideLoadingState();
            
            document.querySelectorAll('.delete-attendance-btn').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    e.stopPropagation();
                    const attId = btn.dataset.id;
                    const name = btn.dataset.name;
                    if (confirm(t('t_confirm_delete_attendance').replace('{name}', name))) {
                        await deleteSingleAttendance(attId);
                    }
                });
            });
            
            document.querySelectorAll('.reset-sign-btn').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    const attId = e.currentTarget.dataset.id;
                    if (!confirm(t('t_re_sign_prompt'))) return;
                    const res = await fetch(`/api/admin/training/attendance/${attId}/reset-signature`, { method: 'POST' });
                    const json = await res.json();
                    if (json.success) {
                        alert('已推送重新签字，请刷新页面查看');
                        loadDetail();
                    } else {
                        alert('操作失败: ' + (json.message || '未知错误'));
                    }
                });
            });

            updatePdfExportLink();
            addBatchDeleteButton();
            bindSelectAll();
            
        } catch (err) {
            console.error('加载签到详情失败:', err);
            hideLoadingState();
            const tbody = document.getElementById('attendanceTbody');
            if (tbody) {
                tbody.innerHTML = `<tr><td colspan="8" class="text-center text-danger">加载失败: ${err.message}</td></tr>`;
            }
        }
    }

    // ============================================================
    // 加载状态控制
    // ============================================================
    let loadingOverlay = null;

    function showLoadingState(message) {
        // 移除已存在的加载遮罩
        hideLoadingState();
        
        // 获取表格容器
        const tableContainer = document.querySelector('.table-responsive');
        if (!tableContainer) return;
        
        // 设置容器为相对定位（如果尚未设置）
        if (tableContainer.style.position !== 'relative') {
            tableContainer.style.position = 'relative';
        }
        
        // 确保容器有最小高度
        if (!tableContainer.style.minHeight) {
            tableContainer.style.minHeight = '280px';
        }
        
        // 创建加载遮罩（在表格容器内部）
        loadingOverlay = document.createElement('div');
        loadingOverlay.id = 'loadingOverlay';
        loadingOverlay.style.cssText = `
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(3px);
            -webkit-backdrop-filter: blur(3px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            border-radius: 8px;
        `;
        
        // 使用较小的 spinner (1.8rem)
        loadingOverlay.innerHTML = `
            <div class="spinner-border text-primary" style="width: 1.8rem; height: 1.8rem;" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <div class="mt-2 text-muted" style="font-size: 0.85rem; text-align: center; max-width: 90%;">
                ${escapeHtml(message || '加载中...')}
            </div>
        `;
        
        tableContainer.appendChild(loadingOverlay);
    }

    function updateLoadingState(message) {
        if (!loadingOverlay) return;
        const textEl = loadingOverlay.querySelector('.text-muted');
        if (textEl && message) {
            textEl.textContent = message;
        }
    }

    function hideLoadingState() {
        if (loadingOverlay) {
            loadingOverlay.remove();
            loadingOverlay = null;
        }
    }

    function bindSelectAll() {
        const selectAll = document.getElementById('selectAll');
        if (selectAll) {
            selectAll.addEventListener('change', (e) => {
                document.querySelectorAll('.attendance-checkbox').forEach(cb => cb.checked = e.target.checked);
            });
        }
    }

    // 批量删除签到记录message: `确定要删除选中的 ${selectedIds.length} 条签到记录吗？`
    async function batchDeleteAttendances() {
        const selectedIds = Array.from(document.querySelectorAll('.attendance-checkbox:checked'))
            .map(cb => cb.dataset.attId);
        
        if (selectedIds.length === 0) {
            alert(t('t_at_least_one_select'));
            return;
        }
        
        if (typeof window.showDeleteConfirm === 'function') {
            window.showDeleteConfirm({
                message: `${t('confirm_batch_delete_sign_in_records', selectedIds.length)}`,
                ids: selectedIds,
                type: 'soft',
                onConfirm: async (deleteType, ids) => {
                    const response = await fetch('/api/admin/training/attendance/batch_delete', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ ids: ids, delete_type: deleteType })
                    });
                    const data = await response.json();
                    if (data.success) {
                        alert(`删除成功: ${data.success_count} 条`);
                        loadDetail(); // 刷新列表
                    } else {
                        alert('删除失败: ' + (data.message || ''));
                    }
                }
            });
        } else {
            if (confirm(`确定要删除选中的 ${selectedIds.length} 条签到记录吗？`)) {
                const response = await fetch('/api/admin/training/attendance/batch_delete', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ids: selectedIds, delete_type: 'soft' })
                });
                const data = await response.json();
                if (data.success) {
                    alert(`删除成功: ${data.success_count} 条`);
                    loadDetail();
                }
            }
        }
    }

    // 单个删除签到记录
    async function deleteSingleAttendance(attendanceId, userName) {
        if (typeof window.showDeleteConfirm === 'function') {
            window.showDeleteConfirm({
                message: `确定要删除 ${userName} 的签到记录吗？`,
                ids: [attendanceId],
                type: 'soft',
                onConfirm: async (deleteType, ids) => {
                    const response = await fetch('/api/admin/training/attendance/batch_delete', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ ids: ids, delete_type: deleteType })
                    });
                    const data = await response.json();
                    if (data.success) {
                        alert('删除成功');
                        loadDetail();
                    } else {
                        alert('删除失败');
                    }
                }
            });
        } else {
            if (confirm(`确定要删除 ${userName} 的签到记录吗？`)) {
                const response = await fetch(`/api/admin/training/attendance/${attendanceId}`, {
                    method: 'DELETE'
                });
                const data = await response.json();
                if (data.success) {
                    alert('删除成功');
                    loadDetail();
                }
            }
        }
    }

    // 添加批量删除按钮
    function addBatchDeleteButton() {
        const headerDiv = document.querySelector('.d-flex.justify-content-end.gap-2');
        if (headerDiv && !document.getElementById('batchDeleteBtn')) {
            const batchDeleteBtn = document.createElement('button');
            batchDeleteBtn.id = 'batchDeleteBtn';
            batchDeleteBtn.className = 'btn btn-danger no-print';
            batchDeleteBtn.innerHTML = `<i class="bi bi-trash no-print"></i> ${t('batch_delete')}`;
            batchDeleteBtn.onclick = batchDeleteAttendances;

            // 手动触发翻译
            if (typeof window.i18n !== 'undefined' && window.i18n.currentLang) {
                const span = batchDeleteBtn.querySelector('[data-i18n="batch_delete"]');
                if (span && typeof t === 'function') {
                    span.textContent = t('batch_delete');
                }
            }
            // 插入到打印按钮后面
            const printBtn = headerDiv.querySelector('.btn-success');
            if (printBtn) {
                printBtn.after(batchDeleteBtn);
            } else {
                headerDiv.appendChild(batchDeleteBtn);
            }
        }
    }

    function updatePdfExportLink() {
        const pdfBtn = document.getElementById('pdfExportBtn');
        if (!pdfBtn) return;
        
        const urlParams = new URLSearchParams(window.location.search);
        let country = urlParams.get('country') || '';
        if (!country || country === 'null' || country === 'undefined') {
            country = '';
        }
        
        const lang = window.i18n?.currentLang || 'zh';
        // ✅ 每次调用时实时读取 localStorage
        const showHeaderFooter = localStorage.getItem('show_print_header_footer') !== 'false';
        
        let url = `/admin/training/${trainingId}/attendance/pdf`;
        const params = [];
        if (country) params.push(`country=${encodeURIComponent(country)}`);
        params.push(`lang=${encodeURIComponent(lang)}`);
        params.push(`show_header=${showHeaderFooter}`);
        
        if (params.length > 0) {
            url += '?' + params.join('&');
        }
        
        pdfBtn.href = url;
        console.log('📄 PDF 链接已更新:', url);
    }

    // 更新批量删除按钮文本（语言切换时调用）
    function updateBatchDeleteButtonText() {
        const batchDeleteBtn = document.getElementById('batchDeleteBtn');
        if (!batchDeleteBtn) return;
        
        const translatedText = typeof t === 'function' ? t('batch_delete') : '批量删除';
        batchDeleteBtn.innerHTML = `<i class="bi bi-trash no-print"></i> ${translatedText}`;
    }

    function escapeHtml(str) {
        if(!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if(m === '&') return '&amp;';
            if(m === '<') return '&lt;';
            if(m === '>') return '&gt;';
            return m;
        });
    }

    // ============================================================
    // 来源检测和返回逻辑
    // ============================================================
    function initBackButton() {
        const backBtn = document.getElementById('backButton');
        if (!backBtn) return;
        
        const urlParams = new URLSearchParams(window.location.search);
        const from = urlParams.get('from');
        const isFromExamBinding = from === 'exam_binding';
        
        if (isFromExamBinding) {
            backBtn.innerHTML = `<i class="bi bi-x-lg me-1"></i> 关闭`;
            backBtn.onclick = function(e) {
                e.preventDefault();
                window.close();
                setTimeout(function() {
                    window.location.href = '/admin/exams';
                }, 100);
            };
        } else {
            backBtn.onclick = function(e) {
                e.preventDefault();
                history.back();
            };
        }
    }

    // ============================================================
    // 打印前更新页眉页脚
    // ============================================================
    function beforePrintHandler() {
        updatePrintHeaderFooterStyles();
    }

    // ============================================================
    // 页面初始化
    // ============================================================
    document.addEventListener('DOMContentLoaded', async function () {
        // 1. 页眉页脚复选框控制
        const headerFooterCheckbox = document.getElementById('showPrintHeaderFooter');
        if (headerFooterCheckbox) {
            const saved = localStorage.getItem('show_print_header_footer');
            if (saved !== null) {
                headerFooterCheckbox.checked = saved === 'true';
            }
            
            // 移除旧监听器避免重复绑定
            headerFooterCheckbox.removeEventListener('change', headerFooterCheckbox._changeHandler);
            
            // 绑定新监听器
            headerFooterCheckbox._changeHandler = function() {
                const show = this.checked;
                localStorage.setItem('show_print_header_footer', String(show));
                
                // ✅ 立即更新打印样式
                updatePrintHeaderFooterStyles();
                
                // ✅ 立即更新 PDF 导出链接（关键修复）
                updatePdfExportLink();
                
                console.log('📄 页眉页脚状态已更新:', show ? '显示' : '隐藏', 'PDF链接已同步更新');
            };
            headerFooterCheckbox.addEventListener('change', headerFooterCheckbox._changeHandler);
        }
        
        // 2. 监听 beforeprint 事件
        window.addEventListener('beforeprint', beforePrintHandler);
        
        // 3. 等待 i18n 就绪后初始化
        await waitForI18n();
        
        // 4. 初始化打印页眉页脚
        updatePrintHeaderFooterStyles();
        
        // 5. 初始化返回按钮
        initBackButton();
        
        // 6. 加载签到详情
        loadDetail();
        
        // 7. 添加批量删除按钮
        addBatchDeleteButton();
        
        // 8. 更新 PDF 链接
        updatePdfExportLink();
    });

    // 监听语言切换事件
    window.addEventListener('app:languageChanged', function(e) {
        console.log('🔄 语言切换，更新打印页眉页脚:', e.detail?.lang);
        updatePrintHeaderFooterStyles();
        updatePdfExportLink();
        updateBatchDeleteButtonText();

        // 更新 PDF 导出按钮文本
        const pdfExportBtn = document.getElementById('pdfExportBtn');
        if (pdfExportBtn && typeof t === 'function') {
            const span = pdfExportBtn.querySelector('[data-i18n="expert_pdf"]');
            if (span) span.textContent = t('expert_pdf');
        }
        
        // 更新页眉页脚复选框标签
        const label = document.querySelector('label[for="showPrintHeaderFooter"]');
        if (label && typeof t === 'function') {
            const span = label.querySelector('[data-i18n="show_header_footer"]');
            if (span) span.textContent = t('show_header_footer');
        }
        
        // 更新签到表格中的按钮文字（重新签名、删除等）
        document.querySelectorAll('.reset-sign-btn').forEach(btn => {
            const icon = btn.querySelector('i');
            if (icon) {
                btn.innerHTML = `<i class="bi bi-pencil-square"></i> ${t('re_signature')}`;
            }
        });
        
        document.querySelectorAll('.delete-attendance-btn').forEach(btn => {
            const icon = btn.querySelector('i');
            if (icon) {
                const name = btn.dataset.name || '';
                btn.innerHTML = `<i class="bi bi-trash"></i> ${t('delete')}`;
            }
        });

        window.addEventListener('afterprint', function() {
            console.log('📄 打印完成');
        });
    });

</script>
{% endblock %}
