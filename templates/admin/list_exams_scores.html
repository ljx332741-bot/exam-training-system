﻿<!-- templates/admin/list_exams_scores.html -->
{% extends "base.html" %}
{% block title %}{{ _('exam_scores_detail') }}{% endblock %}

{% block content %}
<div class="container-fluid px-0">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><span data-i18n="exam_scores_detail">考生成绩详情</span> - <span id="examTitle">{{exam_title}}</span></h2>
        <button class="btn btn-outline-secondary" onclick="history.back();">
            <i class="bi bi-arrow-left me-1"></i> <span data-i18n="back">返回</span>
        </button>
    </div>

    <!-- 过滤栏 -->
    <div class="card mb-3">
        <div class="card-body">
            <div class="row g-3 align-items-end">
                <div class="col-md-5">
                    <div class="row g-4">
                        <div class="col-md-4">
                            <input type="text" id="searchInput" class="form-control" 
                            data-i18n-placeholder="placeholder_mail_name" placeholder="考生姓名/邮箱">
                        </div>
                        <div class="col-md-4">
                            <input type="text" id="filterCountry" class="form-control" list="countryDatalist" 
                            placeholder="输入或选择国家" 
                            data-i18n-placeholder="placeholder_select_or_input"
                            autocomplete="off">
                            <datalist id="countryDatalist"></datalist>
                        </div>
                        <div class="col-md-4">
                            <select id="submitMethodFilter" class="form-select">
                                <option value="" data-i18n="submit_method_all">全部提交方式</option>
                                <option value="manual" data-i18n="student_submit">考生提交</option>
                                <option value="auto" data-i18n="systme_submit">自动提交</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="col-md-2">
                    <button id="searchBtn" class="btn btn-primary w-100"><span data-i18n="search">搜索</span></button>
                </div>
                <div class="col-md-5 d-flex justify-content-end">
                    <button id="batchExportBtn" class="btn btn-success me-2"><i class="bi bi-file-earmark-pdf"></i> <span data-i18n="batch_export">批量导出选中PDF</span></button>
                    {% if is_super_admin %}
                    <button id="batchDeleteBtn" class="btn btn-danger me-2"><i class="bi bi-trash"></i> <span data-i18n="batch_delete">批量删除</span></button>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>

    <!-- 考生成绩表格 -->
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0" style="width: 100% !important; min-width: 100%; white-space: nowrap;">
                    <thead class="table-light">
                        <tr>
                            <th><input type="checkbox" id="selectAll"></th>
                            <th data-i18n="sequence">序号</th>
                            <th data-i18n="country">国家</th>
                            <th data-i18n="name_en">姓名</th>
                            <th data-i18n="email">邮箱</th>
                            <th data-i18n="status">状态</th>
                            <th data-i18n="exam_time_start">考试开始时间</th>
                            <th data-i18n="submit_at">提交时间</th>
                            <th data-i18n="submit_method">提交方式</th>
                            <th data-i18n="time_used">耗时</th>
                            <th data-i18n="candidate_score">得分</th>
                            <th data-i18n="reviewer">阅卷人</th>
                            <th data-i18n="actions">操作</th>
                        </tr>
                    </thead>
                    <tbody id="scoresTbody" style="font-size: 0.875rem";>
                        <tr><td colspan="13" class="text-center"><span data-i18n="loading">加载中...</span></td></tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="card-footer d-flex justify-content-between align-items-center">
            <div><span data-i18n="total_questions">共</span> <span id="totalCount">0</span> <span data-i18n="record">条记录</span></div>
            <nav><ul class="pagination mb-0" id="pagination"></ul></nav>
        </div>
    </div>
</div>

<script>
    const examId = {{ exam_id }};
    const isSuperAdmin = {{ 'true' if is_super_admin else 'false' }};
    let currentPage = 1;
    let currentSearch = '';
    let currentSubmitMethod = '';
    let allSelected = [];
    let examStatus = '';

    // ==================== Loading 遮罩函数 ====================
    function showLoading(text = '正在处理...') {
        const loadingEl = document.getElementById('globalLoading');
        const loadingText = document.getElementById('loadingText');
        
        // ✅ 检查元素是否存在
        if (!loadingEl) {
            console.warn('Loading 元素不存在');
            return;
        }
        
        if (loadingText) loadingText.textContent = text;
        loadingEl.style.display = 'flex';
    }

    function hideLoading() {
        const loadingEl = document.getElementById('globalLoading');
        if (loadingEl) {
            loadingEl.style.display = 'none';
        }
    }

    async function loadScores() {
        if (!examStatus) {
            await loadExamStatus();
        }
        
        const params = new URLSearchParams({
            page: currentPage,
            per_page: 20,
            search: currentSearch,
            submit_method: currentSubmitMethod
        });
        
        try {
            const res = await fetch(`/api/admin/exam/${examId}/scores?${params}`);
            
            // ✅ 检查响应状态
            if (!res.ok) {
                const text = await res.text();
                console.error('API 错误响应:', text);
                throw new Error(`HTTP ${res.status}: ${text.substring(0, 200)}`);
            }
            
            const data = await res.json();
            renderScoresTable(data.data);
            document.getElementById('totalCount').innerText = data.total;
            renderPagination(data.page, Math.ceil(data.total / data.per_page));
        } catch (err) {
            console.error('加载成绩列表失败:', err);
            document.getElementById('scoresTbody').innerHTML = 
                `<tr><td colspan="14" class="text-center text-danger">加载失败: ${err.message}<\/td><\/tr>`;
        }
    }

    // 批量删除（使用全局删除模态框）
    async function batchDeleteSelected() {
        if (!isSuperAdmin) {
            alert('您没有权限执行此操作，只有超级管理员可以删除考试成绩');
            return;
        }
        
        const selectedResultIds = Array.from(document.querySelectorAll('.user-checkbox:checked'))
            .map(cb => cb.dataset.resultId);
        
        if (selectedResultIds.length === 0) {
            alert('请至少选择一个成绩记录');
            return;
        }
    
        // 使用全局删除模态框
        window.showDeleteConfirm({
            title: '删除考试成绩',
            message: `确定要删除选中的 ${selectedResultIds.length} 条成绩记录吗？`,
            ids: selectedResultIds,
            type: 'soft',
            onConfirm: async (deleteType, ids) => {
                const response = await fetch('/api/admin/exam/result/batch_delete', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        ids: ids, 
                        delete_type: deleteType 
                    })
                });
                const data = await response.json();
                
                if (data.success) {
                    alert(`成功删除 ${data.success_count} 条记录`);
                    setTimeout(() => loadScores(), 500);
                } else {
                    alert('删除失败: ' + (data.errors ? data.errors.join(', ') : '未知错误'));
                }
            }
        });
    }

    // 单个删除（使用全局删除模态框）
    async function deleteSingleResult(resultId, userName) {
        if (!isSuperAdmin) {
            alert('您没有权限执行此操作，只有超级管理员可以删除考试成绩');
            return;
        }
        
        // 使用全局删除模态框
        window.showDeleteConfirm({
            title: '删除考试成绩',
            message: `确定要删除考生 "${userName}" 的成绩记录吗？`,
            ids: [resultId],
            type: 'soft',
            onConfirm: async (deleteType, ids) => {
                const response = await fetch('/api/admin/exam/result/batch_delete', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ids: ids, delete_type: deleteType })
                });
                const data = await response.json();
                
                if (data.success && data.success_count > 0) {
                    alert('删除成功');
                    setTimeout(() => loadScores(), 500);
                } else {
                    alert('删除失败: ' + (data.errors ? data.errors[0] : '未知错误'));
                }
            }
        });
    }

    // 获取考试状态（用于判断是否显示强推按钮）
    async function loadExamStatus() {
        try {
            const res = await fetch(`/api/admin/exam/${examId}`);
            if (res.ok) {
                const data = await res.json();
                examStatus = data.status || '';
                console.log('考试状态:', examStatus);
            } else {
                examStatus = '';
            }
        } catch (err) {
            console.error('获取考试状态失败:', err);
            examStatus = '';
        }
    }
    
    function renderScoresTable(scores) {
        const tbody = document.getElementById('scoresTbody');
        if (!scores.length) {
            tbody.innerHTML = '<tr><td colspan="13" class="text-center">暂无数据<\/td><\/tr>';
            return;
        }
        
        tbody.innerHTML = scores.map((s, idx) => {
            const isClosed = examStatus === 'closed';  // 需要从后端获取考试状态 
            // 强制重推按钮（仅已关闭的考试显示）
            let forceResetBtnHtml = '';
            if (isClosed && isSuperAdmin) {
                forceResetBtnHtml = `
                    <button class="btn btn-sm btn-outline-warning force-reset-btn" 
                        data-user-id="${s.user_id}" 
                        data-user-name="${escapeHtml(s.name)}"
                        data-exam-id="${examId}"
                        data-has-force="${s.has_force_reset || false}"
                        data-force-end="${s.force_end_time || ''}"
                        title="强制推送当前学员重新考试（保留原成绩，有效期2小时）">
                        <i class="bi bi-lightning-charge"></i> 
                        <span class="force-btn-text">${s.has_force_reset ? '撤销重推' : '强推考试'}</span>
                    </button>
                `;
            }
            
            // 只有超级管理员才显示删除按钮
            const deleteButtonHtml = isSuperAdmin ? 
                `<button class="btn btn-sm btn-outline-danger delete-result-btn" data-result-id="${s.result_id}" data-user-name="${escapeHtml(s.name)}">
                    <i class="bi bi-trash"></i> ${t('t_delete')}
                </button>` : '';
            
            return `
            <tr>
                <td><input type="checkbox" class="user-checkbox" data-user-id="${s.user_id}" data-result-id="${s.result_id}"></td>
                <td>${(currentPage-1)*20 + idx + 1}</td>
                <td>${s.country || '-'}</td>
                <td>${escapeHtml(s.name)}</td>
                <td>${escapeHtml(s.email)}</td>
                <td>${s.status}</td>
                <td>${formatLocalTime(s.started_at)}</td>
                <td>${formatLocalTime(s.submitted_at)}</td>
                <td>${s.submit_method === 'manual' ? t('t_manual_submit') : t('t_auto_submit')}</td>
                <td>${formatTimeUsed(s.time_used)}</td>  <!-- 用时列 -->
                <td>${s.score}</td>
                <td>${s.reviewer || '-'}</td>
                <td>
                    <a href="/admin/result/${s.result_id}" class="btn btn-sm btn-outline-info">${t('t_details')}</a>
                    <a href="/admin/export_pdf_by_result/${s.result_id}" class="btn btn-sm btn-outline-secondary">PDF</a>
                    ${forceResetBtnHtml}
                    ${deleteButtonHtml}
                <\/td>
            <\/tr>
            `;
        }).join('');

        // 绑定强制重推按钮事件
        document.querySelectorAll('.force-reset-btn').forEach(btn => {
            btn.removeEventListener('click', handleForceReset);
            btn.addEventListener('click', handleForceReset);
        });

        // 绑定删除按钮事件
        document.querySelectorAll('.delete-result-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                deleteSingleResult(btn.dataset.resultId, btn.dataset.userName);
            });
        });

        // 全选逻辑
        const selectAll = document.getElementById('selectAll');
        if (selectAll) {
            // 移除旧监听器
            const newSelectAll = selectAll.cloneNode(true);
            selectAll.parentNode.replaceChild(newSelectAll, selectAll);
            newSelectAll.addEventListener('change', (e) => {
                document.querySelectorAll('.user-checkbox').forEach(cb => cb.checked = e.target.checked);
            });
        }
        
        // 更新选中状态
        document.querySelectorAll('.user-checkbox').forEach(cb => {
            const newCb = cb.cloneNode(true);
            cb.parentNode.replaceChild(newCb, cb);
            newCb.addEventListener('change', updateSelected);
        });
        
        updateSelected();
    }

    // 强制重推处理函数
    async function handleForceReset(e) {
        const btn = e.currentTarget;
        const examId = btn.dataset.examId;
        const userId = btn.dataset.userId;
        const userName = btn.dataset.userName;
        const hasForce = btn.dataset.hasForce === 'true';
        
        if (hasForce) {
            // 已有强制重推，执行撤销
            if (!confirm(`确定要撤销 ${userName} 的强制重推资格吗？`)) return;
            
            showLoading('撤销中...');
            try {
                const response = await fetch(`/api/admin/exam/${examId}/cancel_force_reset/${userId}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                const result = await response.json();
                hideLoading();
                
                if (result.success) {
                    showToast(result.message, 'success');
                    loadScores();  // 刷新列表
                } else {
                    showToast(result.message || '撤销失败', 'error');
                }
            } catch (err) {
                hideLoading();
                showToast('操作失败', 'error');
            }
        } else {
            // 创建强制重推
            if (!confirm(`确定要为 ${userName} 强制推送重考吗？\n\n操作说明：\n• 保留原考试成绩记录\n• 新考试有效期2小时\n• 学员可重新参加考试`)) return;
            
            showLoading('强制推送中...');
            try {
                const response = await fetch(`/api/admin/exam/${examId}/force_reset/${userId}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                const result = await response.json();
                hideLoading();
                
                if (result.success) {
                    showToast(result.message, 'success');
                    loadScores();  // 刷新列表，按钮状态会更新
                } else {
                    showToast(result.message || '操作失败', 'error');
                }
            } catch (err) {
                hideLoading();
                showToast('操作失败', 'error');
            }
        }
    }

    // 添加用时格式化函数
    function formatTimeUsed(seconds) {
        if (!seconds && seconds !== 0) return '-';
        const minutes = Math.floor(seconds / 60);
        const secs = seconds % 60;
        if (minutes > 0) {
            return `${minutes}${t('mins')}${secs}${t('secs')}`;
        }
        return `${secs}${t('secs')}`;
    }

    function updateSelected() {
        allSelected = Array.from(document.querySelectorAll('.user-checkbox:checked')).map(cb => cb.dataset.userId);
    }

    function formatDate(iso) {
        if (!iso) return '-';
        try {
            return new Date(iso).toLocaleString();
        } catch(e) {
            return '-';
        }
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    function renderPagination(current, totalPages) {
        const pagination = document.getElementById('pagination');
        if (totalPages <= 1) { 
            pagination.innerHTML = ''; 
            return; 
        }
        let html = '';
        for (let i = 1; i <= totalPages; i++) {
            html += `<li class="page-item ${i === current ? 'active' : ''}"><a class="page-link" href="#" data-page="${i}">${i}</a></li>`;
        }
        pagination.innerHTML = html;
        pagination.querySelectorAll('.page-link').forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                currentPage = parseInt(link.dataset.page);
                loadScores();
            });
        });
    }

    // 绑定事件
    document.getElementById('searchBtn').addEventListener('click', () => {
        currentSearch = document.getElementById('searchInput').value;
        currentSubmitMethod = document.getElementById('submitMethodFilter').value;
        currentPage = 1;
        loadScores();
    });

    document.getElementById('batchExportBtn').addEventListener('click', batchExportSelected);
    
    // 批量删除按钮（仅当元素存在时绑定）
    const batchDeleteBtn = document.getElementById('batchDeleteBtn');
    if (batchDeleteBtn) {
        batchDeleteBtn.addEventListener('click', batchDeleteSelected);
    }

    async function batchExportSelected() {
        const selectedResultIds = Array.from(document.querySelectorAll('.user-checkbox:checked')).map(cb => cb.dataset.resultId);
        if (selectedResultIds.length === 0) {
            alert('请至少选择一个考生成绩记录');
            return;
        }
        
        const response = await fetch(`/api/admin/exam/batch_export_by_result`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ result_ids: selectedResultIds, exam_id: examId })
        });
        
        if (response.ok) {
            const blob = await response.blob();
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `exam_${examId}_selected.zip`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        } else {
            alert('导出失败');
        }
    }

    // 页面初始化
    document.addEventListener('DOMContentLoaded', async () => {
        await loadExamStatus();  // ✅ 先加载考试状态
        loadScores();
        
        // ... 其他初始化代码
    });

    // 语言切换时重新加载
    window.addEventListener('app:languageChanged', function() {
        loadScores();
    });
</script>
{% endblock %}
