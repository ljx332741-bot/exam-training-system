﻿﻿<!-- templates/admin/list_exams_scores.html -->
{% extends "base.html" %}
{% block title %}{{ _('exam_scores_detail') }}{% endblock %}

{% block content %}
<div class="container-fluid px-0">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><span data-i18n="exam_scores_detail">考生成绩详情</span> - <span id="examTitle">{{exam_title}}</span></h2>
        <button class="btn btn-outline-secondary" onclick="history.back();">
            <i class="bi bi-arrow-left me-1"></i> <span data-i18n="back">返回</span>
        </button>
    </div>

    <!-- ========== 筛选栏（输入即搜索） ========== -->
    <div class="card mb-3">
        <div class="card-body">
            <div class="row g-3 align-items-end">
                <div class="col-md-5">
                    <div class="row g-4">
                        <div class="col-md-4">
                            <input type="text" id="searchInput" class="form-control" 
                                data-i18n-placeholder="placeholder_mail_name" 
                                placeholder="考生姓名/邮箱"
                                autocomplete="off">
                        </div>
                        <div class="col-md-4">
                            <input type="text" id="filterCountry" class="form-control" list="countryDatalist" 
                                placeholder="输入或选择国家" 
                                data-i18n-placeholder="placeholder_select_or_input"
                                autocomplete="off">
                            <datalist id="countryDatalist"></datalist>
                            <input type="hidden" id="filterCountryCode">
                        </div>
                        <div class="col-md-4">
                            <select id="submitMethodFilter" class="form-select">
                                <option value="" data-i18n="submit_method_all">全部提交方式</option>
                                <option value="manual" data-i18n="manual_submit">考生提交</option>
                                <option value="auto" data-i18n="auto_submit">自动提交</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="col-md-2">
                    <button id="resetFiltersBtn" class="btn btn-outline-secondary w-100">
                        <i class="bi bi-arrow-repeat"></i> <span data-i18n="reset">重置</span>
                    </button>
                </div>
                <div class="col-md-5 d-flex justify-content-end">
                    <button id="batchExportBtn" class="btn btn-success me-2"><i class="bi bi-file-earmark-pdf"></i> <span data-i18n="batch_export">批量导出选中PDF</span></button>
                    {% if is_super_admin %}
                    <button id="batchDeleteBtn" class="btn btn-danger me-2"><i class="bi bi-trash"></i> <span data-i18n="batch_delete">批量删除</span></button>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>

    <!-- 考生成绩表格 -->
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0" style="width: 100% !important; min-width: 100%; white-space: nowrap;">
                    <thead class="table-light">
                        <tr>
                            <th><input type="checkbox" id="selectAll"></th>
                            <th data-i18n="sequence">序号</th>
                            <th data-i18n="country">国家</th>
                            <th data-i18n="name_en">姓名</th>
                            <th data-i18n="email">邮箱</th>
                            <th data-i18n="status">状态</th>
                            <th data-i18n="exam_time_start">考试开始时间</th>
                            <th data-i18n="submit_at">提交时间</th>
                            <th data-i18n="submit_method">提交方式</th>
                            <th data-i18n="time_used">耗时</th>
                            <th data-i18n="candidate_score">得分</th>
                            <th data-i18n="reviewer">阅卷人</th>
                            <th data-i18n="actions">操作</th>
                        </tr>
                    </thead>
                    <tbody id="scoresTbody" style="font-size: 0.875rem;">
                        <tr><td colspan="13" class="text-center"><span data-i18n="loading">加载中...</span></td></tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="card-footer d-flex justify-content-between align-items-center">
            <div><span data-i18n="total_questions">共</span> <span id="totalCount">0</span> <span data-i18n="record">条记录</span></div>
            <nav><ul class="pagination mb-0" id="pagination"></ul></nav>
        </div>
    </div>
</div>

<script>
    const examId = {{ exam_id }};
    const isSuperAdmin = {{ 'true' if is_super_admin else 'false' }};
    let currentPage = 1;
    let filters = { search: '', country: '', submit_method: '' };
    let examStatus = '';
    
    // ========== 缓存变量 ==========
    let allData = [];          // 存储所有数据（用于内存过滤）
    let filteredData = [];     // 存储过滤后的数据
    let cachedTotal = 0;
    let searchTimer = null;

    // ==================== Loading 遮罩函数 ====================
    function showLoading(text = '正在处理...') {
        const loadingEl = document.getElementById('globalLoading');
        const loadingText = document.getElementById('loadingText');
        if (!loadingEl) {
            console.warn('Loading 元素不存在');
            return;
        }
        if (loadingText) loadingText.textContent = text;
        loadingEl.style.display = 'flex';
    }

    function hideLoading() {
        const loadingEl = document.getElementById('globalLoading');
        if (loadingEl) {
            loadingEl.style.display = 'none';
        }
    }

    // ========== 加载考试状态 ==========
    async function loadExamStatus() {
        try {
            const res = await fetch(`/api/admin/exam/${examId}`);
            if (res.ok) {
                const data = await res.json();
                examStatus = data.status || '';
                console.log('考试状态:', examStatus);
            } else {
                examStatus = '';
            }
        } catch (err) {
            console.error('获取考试状态失败:', err);
            examStatus = '';
        }
    }

    // ========== 加载成绩数据（首次加载，获取全部数据） ==========
    async function loadScores() {
        // 如果已经有数据，直接使用缓存
        if (allData && allData.length > 0) {
            console.log('📋 使用缓存数据，应用筛选');
            applyFilters();
            return;
        }

        // 否则从服务器加载
        await window.loadTableWithProgress('scoresTbody', async (updateProgress, updateDesc) => {
            try {
                updateProgress(10, t('preparing_load_score_data'));
                
                // 获取所有数据（不分页）
                const params = new URLSearchParams({
                    page: 1,
                    per_page: 10000
                });
                
                updateProgress(40, t('data_acquisition_in_progress'));
                const res = await fetch(`/api/admin/exam/${examId}/scores?${params}`);
                
                if (!res.ok) {
                    const text = await res.text();
                    console.error('API 错误响应:', text);
                    throw new Error(`HTTP ${res.status}: ${text.substring(0, 200)}`);
                }
                
                const data = await res.json();
                
                // ✅ 缓存所有数据
                allData = data.data || [];
                cachedTotal = data.total || 0;

                updateProgress(70, t('processing_data'));
                updateProgress(85, t('rendering_table'));
                
                // 应用筛选（首次加载时无筛选）
                applyFilters();
                
                updateProgress(100, t('infomation_loaded'));
                hideLoading();
                
            } catch (err) {
                console.error('加载成绩列表失败:', err);
                hideLoading();
                document.getElementById('scoresTbody').innerHTML = 
                    `<tr><td colspan="13" class="text-center text-danger">加载失败: ${err.message}</td></tr>`;
                throw err;
            }
        }, {
            title: t('loading_score_data'),
            desc: 'please_wait_loading_scores',
            colspan: 13,
            size: 'md',
            completeMessage: 'score_data_loaded'
        });
    }

    // ========== 应用筛选（内存过滤，静默更新） ==========
    function applyFilters() {
        if (!allData || allData.length === 0) {
            renderScoresTable([]);
            document.getElementById('totalCount').innerText = '0';
            return;
        }

        let filtered = [...allData];
        
        // 1. 姓名/邮箱搜索（支持多关键词组合查询，使用 splitSearchKeywords）
        if (filters.search) {
            const keywords = typeof splitSearchKeywords === 'function' 
                ? splitSearchKeywords(filters.search) 
                : filters.search.trim().split(/\s+/).filter(k => k.length > 0);
            
            if (keywords.length > 0) {
                filtered = filtered.filter(item => {
                    const name = (item.name || '').toLowerCase();
                    const email = (item.email || '').toLowerCase();
                    const searchableText = name + ' ' + email;
                    // 所有关键词都必须匹配（AND 逻辑）
                    return keywords.every(k => searchableText.includes(k.toLowerCase()));
                });
            }
        }
        
        // 2. 国家筛选（支持模糊匹配）
        if (filters.country) {
            const countryLower = filters.country.toLowerCase();
            filtered = filtered.filter(item => {
                const country = (item.country || '').toLowerCase();
                return country.includes(countryLower);
            });
        }
        
        // 3. 提交方式筛选
        if (filters.submit_method) {
            filtered = filtered.filter(item => item.submit_method === filters.submit_method);
        }
        
        filteredData = filtered;
        cachedTotal = filtered.length;
        
        const totalPages = Math.ceil(filtered.length / 20);
        const start = (currentPage - 1) * 20;
        const end = start + 20;
        const pageData = filtered.slice(start, end);
        
        renderScoresTable(pageData);
        document.getElementById('totalCount').innerText = filtered.length;
        renderPagination(currentPage, totalPages);
    }

    // ========== 防抖搜索 ==========
    function loadScoresWithDebounce() {
        if (searchTimer) {
            clearTimeout(searchTimer);
        }
        searchTimer = setTimeout(() => {
            currentPage = 1;
            applyFilters();
            searchTimer = null;
        }, 300);
    }

    // ========== 重置所有筛选条件 ==========
    function resetAllFilters() {
        document.getElementById('searchInput').value = '';
        document.getElementById('filterCountry').value = '';
        document.getElementById('filterCountryCode').value = '';
        document.getElementById('submitMethodFilter').value = '';
        
        filters = { search: '', country: '', submit_method: '' };
        currentPage = 1;
        applyFilters();
    }

    // ========== 绑定筛选事件（输入即搜索） ==========
    function bindFilterEvents() {
        const searchInput = document.getElementById('searchInput');
        const countryInput = document.getElementById('filterCountry');
        const countryCodeHidden = document.getElementById('filterCountryCode');
        const submitMethodSelect = document.getElementById('submitMethodFilter');
        const resetBtn = document.getElementById('resetFiltersBtn');

        // 姓名/邮箱搜索：输入即搜索
        if (searchInput) {
            searchInput.removeEventListener('input', handleSearchInput);
            searchInput.addEventListener('input', handleSearchInput);
        }

        function handleSearchInput() {
            const val = searchInput?.value || '';
            if (val !== filters.search) {
                filters.search = val;
                loadScoresWithDebounce();
            }
        }

        // 国家筛选：输入即搜索
        if (countryInput) {
            countryInput.removeEventListener('input', handleCountryInput);
            countryInput.removeEventListener('change', handleCountryInput);
            countryInput.addEventListener('input', handleCountryInput);
            countryInput.addEventListener('change', handleCountryInput);
        }

        function handleCountryInput() {
            const val = countryInput?.value || '';
            if (val !== filters.country) {
                filters.country = val;
                if (countryCodeHidden) countryCodeHidden.value = '';
                loadScoresWithDebounce();
            }
        }

        // 提交方式：即时搜索
        if (submitMethodSelect) {
            submitMethodSelect.removeEventListener('change', handleSubmitMethodChange);
            submitMethodSelect.addEventListener('change', handleSubmitMethodChange);
        }

        function handleSubmitMethodChange() {
            const val = submitMethodSelect?.value || '';
            if (val !== filters.submit_method) {
                filters.submit_method = val;
                loadScoresWithDebounce();
            }
        }

        // 重置按钮
        if (resetBtn) {
            resetBtn.removeEventListener('click', resetAllFilters);
            resetBtn.addEventListener('click', resetAllFilters);
        }
    }

    // ========== 渲染成绩表格 ==========
    function renderScoresTable(scores) {
        const tbody = document.getElementById('scoresTbody');
        if (!tbody) return;
        
        // 隐藏进度条
        window.hideTableProgress('scoresTbody');
        
        if (!scores || scores.length === 0) {
            tbody.innerHTML = '<tr><td colspan="13" class="text-center">' + t('no_data') + '</td></tr>';
            return;
        }
        
        tbody.innerHTML = scores.map((s, idx) => {
            const isClosed = examStatus === 'closed';
            let forceResetBtnHtml = '';
            if (isClosed && isSuperAdmin) {
                forceResetBtnHtml = `
                    <button class="btn btn-sm btn-outline-warning force-reset-btn" 
                        data-user-id="${s.user_id}" 
                        data-user-name="${escapeHtml(s.name)}"
                        data-exam-id="${examId}"
                        data-has-force="${s.has_force_reset || false}"
                        data-force-end="${s.force_end_time || ''}"
                        data-i18n-title="title_force_repush_hint"
                        title="强制推送当前学员重新考试（保留原成绩，有效期2小时）">
                        <i class="bi bi-lightning-charge"></i> 
                        <span class="force-btn-text">${s.has_force_reset ? t('cancel_repush') : t('force_repush')}</span>
                    </button>
                `;
            }
            
            const deleteButtonHtml = isSuperAdmin ? 
                `<button class="btn btn-sm btn-outline-danger delete-result-btn" data-result-id="${s.result_id}" data-user-name="${escapeHtml(s.name)}">
                    <i class="bi bi-trash"></i> ${t('delete')}
                </button>` : '';
            
            return `
            <tr>
                <td><input type="checkbox" class="user-checkbox" data-user-id="${s.user_id}" data-result-id="${s.result_id}"></td>
                <td>${(currentPage-1)*20 + idx + 1}</td>
                <td>${escapeHtml(s.country || '-')}</td>
                <td>${escapeHtml(s.name)}</td>
                <td>${escapeHtml(s.email)}</td>
                <td>${s.status}</td>
                <td>${formatLocalTime(s.started_at)}</td>
                <td>${formatLocalTime(s.submitted_at)}</td>
                <td>${s.submit_method === 'manual' ? t('manual_submit') : t('auto_submit')}</td>
                <td>${formatTimeUsed(s.time_used)}</td>
                <td>${s.score}</td>
                <td>${escapeHtml(s.reviewer || '-')}</td>
                <td>
                    <a href="/admin/result/${s.result_id}" class="btn btn-sm btn-outline-info">${t('details')}</a>
                    <a href="/admin/export_pdf_by_result/${s.result_id}" class="btn btn-sm btn-outline-secondary">PDF</a>
                    ${forceResetBtnHtml}
                    ${deleteButtonHtml}
                </td>
            </tr>
            `;
        }).join('');

        // 绑定强制重推按钮事件
        document.querySelectorAll('.force-reset-btn').forEach(btn => {
            btn.removeEventListener('click', handleForceReset);
            btn.addEventListener('click', handleForceReset);
        });

        // 绑定删除按钮事件
        document.querySelectorAll('.delete-result-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                deleteSingleResult(btn.dataset.resultId, btn.dataset.userName);
            });
        });

        // 全选逻辑
        const selectAll = document.getElementById('selectAll');
        if (selectAll) {
            const newSelectAll = selectAll.cloneNode(true);
            selectAll.parentNode.replaceChild(newSelectAll, selectAll);
            newSelectAll.addEventListener('change', (e) => {
                document.querySelectorAll('.user-checkbox').forEach(cb => cb.checked = e.target.checked);
            });
        }
        
        // 更新选中状态
        document.querySelectorAll('.user-checkbox').forEach(cb => {
            const newCb = cb.cloneNode(true);
            cb.parentNode.replaceChild(newCb, cb);
            newCb.addEventListener('change', updateSelected);
        });
        
        updateSelected();
    }

    // ========== 强制重推处理函数 ==========
    async function handleForceReset(e) {
        const btn = e.currentTarget;
        const examId = btn.dataset.examId;
        const userId = btn.dataset.userId;
        const userName = btn.dataset.userName;
        const hasForce = btn.dataset.hasForce === 'true';
        
        if (hasForce) {
            if (!confirm(`确定要撤销 ${userName} 的强制重推资格吗？`)) return;
            showLoading('撤销中...');
            try {
                const response = await fetch(`/api/admin/exam/${examId}/cancel_force_reset/${userId}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                const result = await response.json();
                hideLoading();
                if (result.success) {
                    showToast(result.message, 'success');
                    // 刷新数据（清空缓存重新加载）
                    allData = [];
                    loadScores();
                } else {
                    showToast(result.message || '撤销失败', 'error');
                }
            } catch (err) {
                hideLoading();
                showToast('操作失败', 'error');
            }
        } else {
            if (!confirm(`确定要为 ${userName} 强制推送重考吗？\n\n操作说明：\n• 保留原考试成绩记录\n• 新考试有效期2小时\n• 学员可重新参加考试`)) return;
            showLoading('强制推送中...');
            try {
                const response = await fetch(`/api/admin/exam/${examId}/force_reset/${userId}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                const result = await response.json();
                hideLoading();
                if (result.success) {
                    showToast(result.message, 'success');
                    allData = [];
                    loadScores();
                } else {
                    showToast(result.message || '操作失败', 'error');
                }
            } catch (err) {
                hideLoading();
                showToast('操作失败', 'error');
            }
        }
    }

    // ========== 格式化函数 ==========
    function formatTimeUsed(seconds) {
        if (!seconds && seconds !== 0) return '-';
        const minutes = Math.floor(seconds / 60);
        const secs = seconds % 60;
        if (minutes > 0) {
            return `${minutes}${t('mins')}${secs}${t('secs')}`;
        }
        return `${secs}${t('secs')}`;
    }

    function updateSelected() {
        // 更新选中状态（用于批量操作）
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    function renderPagination(current, totalPages) {
        const pagination = document.getElementById('pagination');
        if (totalPages <= 1) { 
            pagination.innerHTML = ''; 
            return; 
        }
        let html = '';
        for (let i = 1; i <= totalPages; i++) {
            html += `<li class="page-item ${i === current ? 'active' : ''}"><a class="page-link" href="#" data-page="${i}">${i}</a></li>`;
        }
        pagination.innerHTML = html;
        pagination.querySelectorAll('.page-link').forEach(link => {
            link.removeEventListener('click', pagination._clickHandler);
            link._clickHandler = (e) => {
                e.preventDefault();
                currentPage = parseInt(link.dataset.page);
                applyFilters();  // 分页切换时使用内存过滤
            };
            link.addEventListener('click', link._clickHandler);
        });
    }

    // ========== 批量导出 ==========
    async function batchExportSelected() {
        const selectedResultIds = Array.from(document.querySelectorAll('.user-checkbox:checked'))
            .map(cb => cb.dataset.resultId);
        if (selectedResultIds.length === 0) {
            showToast(t('select_at_least_one'), 'warning');
            return;
        }
        
        showLoading('导出中...');
        try {
            const response = await fetch(`/api/admin/exam/batch_export_by_result`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ result_ids: selectedResultIds, exam_id: examId })
            });
            hideLoading();
            
            if (response.ok) {
                const blob = await response.blob();
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `exam_${examId}_selected.zip`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                showToast('导出成功', 'success');
            } else {
                showToast('导出失败', 'error');
            }
        } catch (err) {
            hideLoading();
            showToast('导出失败: ' + err.message, 'error');
        }
    }

    // ========== 批量删除 ==========
    async function batchDeleteSelected() {
        if (!isSuperAdmin) {
            showToast('只有超级管理员可以删除考试成绩', 'warning');
            return;
        }
        
        const selectedResultIds = Array.from(document.querySelectorAll('.user-checkbox:checked'))
            .map(cb => cb.dataset.resultId);
        
        if (selectedResultIds.length === 0) {
            showToast(t('select_at_least_one'), 'warning');
            return;
        }
    
        window.showDeleteConfirm({
            title: '删除考试成绩',
            message: `确定要删除选中的 ${selectedResultIds.length} 条成绩记录吗？`,
            ids: selectedResultIds,
            type: 'soft',
            onConfirm: async (deleteType, ids) => {
                showLoading('删除中...');
                try {
                    const response = await fetch('/api/admin/exam/result/batch_delete', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ ids: ids, delete_type: deleteType })
                    });
                    const data = await response.json();
                    hideLoading();
                    
                    if (data.success) {
                        showToast(`成功删除 ${data.success_count} 条记录`, 'success');
                        // 清空缓存重新加载
                        allData = [];
                        loadScores();
                    } else {
                        showToast('删除失败: ' + (data.errors ? data.errors.join(', ') : '未知错误'), 'error');
                    }
                } catch (err) {
                    hideLoading();
                    showToast('删除失败: ' + err.message, 'error');
                }
            }
        });
    }

    // ========== 单个删除 ==========
    async function deleteSingleResult(resultId, userName) {
        if (!isSuperAdmin) {
            showToast('只有超级管理员可以删除考试成绩', 'warning');
            return;
        }
        
        window.showDeleteConfirm({
            title: '删除考试成绩',
            message: `确定要删除考生 "${userName}" 的成绩记录吗？`,
            ids: [resultId],
            type: 'soft',
            onConfirm: async (deleteType, ids) => {
                showLoading('删除中...');
                try {
                    const response = await fetch('/api/admin/exam/result/batch_delete', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ ids: ids, delete_type: deleteType })
                    });
                    const data = await response.json();
                    hideLoading();
                    
                    if (data.success && data.success_count > 0) {
                        showToast('删除成功', 'success');
                        allData = [];
                        loadScores();
                    } else {
                        showToast('删除失败: ' + (data.errors ? data.errors[0] : '未知错误'), 'error');
                    }
                } catch (err) {
                    hideLoading();
                    showToast('删除失败: ' + err.message, 'error');
                }
            }
        });
    }

    // ========== 页面初始化 ==========
    document.addEventListener('DOMContentLoaded', async () => {
        await loadExamStatus();
        
        // 初始化国家自动补全
        await setupCountryAutocomplete('filterCountry', 'countryDatalist', 'filterCountryCode');
        
        // 绑定筛选事件（输入即搜索）
        bindFilterEvents();
        
        // 加载数据
        loadScores();
        
        // 绑定批量操作按钮
        document.getElementById('batchExportBtn').addEventListener('click', batchExportSelected);
        const batchDeleteBtn = document.getElementById('batchDeleteBtn');
        if (batchDeleteBtn) {
            batchDeleteBtn.addEventListener('click', batchDeleteSelected);
        }
    });

    // 语言切换时重新渲染
    window.addEventListener('app:languageChanged', function() {
        if (allData && allData.length > 0) {
            applyFilters();
        } else {
            loadScores();
        }
    });
</script>
{% endblock %}
